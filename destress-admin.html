<!DOCTYPE html>
<!-- destress-admin.html — v1.0.0 — 2026-10-26 — Бухгалтерия → Фразы De-Stress: модерация, переводы, статистика -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Фразы De-Stress</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .page-wrap { min-height: 100vh; padding: 70px 16px 60px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-size: 20px; margin-bottom: 14px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .panel { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 14px; }
    .box { border: 1px solid var(--gold-dim); background: #0a0a0a; padding: 12px; }
    .h { font-family: 'Cinzel', serif; font-size: 14px; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
    select, input[type="text"] { padding: 7px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    input.wide { flex: 1; min-width: 160px; }
    .btn { background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 7px 12px; font-size: 11px; cursor: pointer; font-family: inherit; text-transform: uppercase; }
    .btn:hover { border-color: var(--gold); }
    .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 900; }
    .btn.del:hover { color: #e74c3c; border-color: #e74c3c; }
    .status { font-size: 11px; color: var(--ivory); min-height: 15px; }
    .status.error { color: #e74c3c; }
    .status.ok { color: #6fd48a; }
    .item { border: 1px solid #222; padding: 8px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr; gap: 6px; }
    .item.pending { border-color: #e0a030; }
    .stats { font-size: 10px; color: #9a9a8a; }
    .lbl { font-size: 10px; color: #9a9a8a; }
</style>
</head>
<body>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows"><a class="back-arrow" id="btn-back">&lt;</a><a class="back-arrow" id="btn-accounting">&lt;&lt;</a></div>

<div class="page-wrap">
    <div class="title">ФРАЗЫ DE-STRESS</div>
    <div class="panel">

        <div class="box">
            <div class="h">Добавить клубную фразу</div>
            <div class="row"><input type="text" id="new-text" class="wide" placeholder="Фраза (язык оригинала)" maxlength="180"></div>
            <div class="row">
                <input type="text" id="new-en" class="wide" placeholder="English (необязательно)" maxlength="180">
                <input type="text" id="new-fr" class="wide" placeholder="Français (необязательно)" maxlength="180">
            </div>
            <div class="row"><button class="btn primary" id="btn-add" type="button">Добавить (сразу в набор)</button><span class="status" id="add-status"></span></div>
        </div>

        <div class="box">
            <div class="h">База фраз</div>
            <div class="row">
                <select id="f-status">
                    <option value="pending">Ждут проверки</option>
                    <option value="approved">В наборе</option>
                    <option value="hidden">Скрытые</option>
                    <option value="">Все</option>
                </select>
                <input type="text" id="f-q" class="wide" placeholder="Поиск по тексту">
                <button class="btn" id="btn-load" type="button">Показать</button>
            </div>
            <div class="status" id="list-status"></div>
            <div id="list"></div>
        </div>

    </div>
</div>

<script type="module">
    import { requireAuth } from './core/auth.js';
    import { supabase } from './core/supabase-init.js';

    const session = await requireAuth();
    if (!session) throw new Error('redirecting to login');

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const setStatus = (el, text, cls) => { el.textContent = text; el.className = 'status' + (cls ? ' ' + cls : ''); };

    function translationsFrom(en, fr) {
        const o = {};
        if (en.trim()) o.en = en.trim();
        if (fr.trim()) o.fr = fr.trim();
        return o;
    }

    $('btn-add').addEventListener('click', async () => {
        const text = $('new-text').value.trim();
        if (text.length < 3) { setStatus($('add-status'), 'Фраза слишком короткая.', 'error'); return; }
        const { error } = await supabase.from('destress_phrases').insert({
            text, lang: 'ru', source: 'club', status: 'approved',
            translations: translationsFrom($('new-en').value, $('new-fr').value)
        });
        if (error) { setStatus($('add-status'), error.code === '23505' ? 'Такая фраза уже есть.' : 'Ошибка: ' + error.message, 'error'); return; }
        ['new-text', 'new-en', 'new-fr'].forEach(id => { $(id).value = ''; });
        setStatus($('add-status'), 'Добавлено.', 'ok');
        load();
    });

    async function load() {
        setStatus($('list-status'), 'Загружаю…');
        let q = supabase.from('destress_phrases').select('*').order('created_at', { ascending: false }).limit(300);
        const st = $('f-status').value;
        if (st) q = q.eq('status', st);
        const { data, error } = await q;
        if (error) { setStatus($('list-status'), 'Не удалось загрузить: ' + error.message + ' — проверьте, что SQL выполнен.', 'error'); return; }
        const query = $('f-q').value.trim().toLowerCase();
        const rows = (data || []).filter(r => !query || r.text.toLowerCase().includes(query));
        setStatus($('list-status'), `Показано: ${rows.length}`);
        $('list').innerHTML = rows.map(r => {
            const tr = r.translations || {};
            return `<div class="item ${r.status}" data-id="${esc(r.id)}">
                <div class="row">
                    <input type="text" class="wide" data-f="text" value="${esc(r.text)}" maxlength="180">
                    <select data-f="status">
                        <option value="pending"${r.status === 'pending' ? ' selected' : ''}>ждёт проверки</option>
                        <option value="approved"${r.status === 'approved' ? ' selected' : ''}>в наборе</option>
                        <option value="hidden"${r.status === 'hidden' ? ' selected' : ''}>скрыта</option>
                    </select>
                </div>
                <div class="row">
                    <input type="text" class="wide" data-f="en" placeholder="English" value="${esc(tr.en || '')}" maxlength="180">
                    <input type="text" class="wide" data-f="fr" placeholder="Français" value="${esc(tr.fr || '')}" maxlength="180">
                </div>
                <div class="row">
                    <span class="stats">${esc(r.source === 'club' ? 'клубная' : 'от посетителя')} · ${esc(r.lang)} ·
                        в Ателье ${r.n_atelier} · заказов ${r.n_order} · Telegram ${r.n_share} · скачано ${r.n_download} · скопировано ${r.n_copy}</span>
                    <button class="btn" data-save type="button">Сохранить</button>
                    <button class="btn del" data-del type="button">Удалить</button>
                    <span class="status" data-msg></span>
                </div>
            </div>`;
        }).join('');
    }

    $('list').addEventListener('click', async (e) => {
        const item = e.target.closest('.item');
        if (!item) return;
        const id = item.dataset.id;
        const msg = item.querySelector('[data-msg]');
        const val = (f) => item.querySelector(`[data-f="${f}"]`).value;

        if (e.target.closest('[data-save]')) {
            const text = val('text').trim();
            if (text.length < 3) { setStatus(msg, 'Слишком короткая.', 'error'); return; }
            const { error } = await supabase.from('destress_phrases')
                .update({ text, status: val('status'), translations: translationsFrom(val('en'), val('fr')) }).eq('id', id);
            setStatus(msg, error ? 'Ошибка: ' + error.message : 'Сохранено.', error ? 'error' : 'ok');
        }
        if (e.target.closest('[data-del]')) {
            if (!confirm('Удалить фразу насовсем?')) return;
            const { error } = await supabase.from('destress_phrases').delete().eq('id', id);
            if (error) { setStatus(msg, 'Ошибка: ' + error.message, 'error'); return; }
            item.remove();
        }
    });

    $('btn-load').addEventListener('click', load);
    $('f-status').addEventListener('change', load);
    $('btn-back').addEventListener('click', () => history.back());
    $('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');

    load();
</script>
</body>
</html>
