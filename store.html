<!DOCTYPE html>
<!--
  store.html
  v3.0.0 — 2026-10-02
  Изменения относительно v2.0.0:
  (1) Полностью на английском, "GY-GY Club" убрано из заголовка.
  (2) Добавление/удаление лотов убрано отсюда совсем — теперь это
      store-admin.html внутри Бухгалтерии (посетители этого не видят).
      Эта страница — чистая витрина: смотреть и (пока условно) купить.
  (3) Категория "Fabric/Paper" заменена на отдельные "Textile" и "Wood".
  (4) Демонстрационная рамка — фон теперь размытая растянутая копия
      самого фото (а не просто светлая плашка) — так, будто витрина
      заполнена фоном, на котором снято фото.
  (5) Явная кнопка "✕" закрыть просмотр лота — чтобы было видно, как
      вернуться к каталогу после выбора товара.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Antique Store v3.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root {
        --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6;
        --border-wood: #5a3e1b; --dark-wood: #2b1d0c; --accent-red: #782814;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
        width: 100%; min-height: 100%; background: #000; color: var(--gold);
        overflow-y: auto; overflow-x: hidden; font-family: 'Share Tech Mono', monospace;
    }
    #store-bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: url('Store 0.png') center/cover no-repeat;
        opacity: 0.3;
    }
    .header-right { position: absolute; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; transition: opacity 0.2s, transform 0.2s; pointer-events: auto; }
    .back-arrow:hover { opacity: 0.8; transform: scale(1.1); }

    .gy-user-badge { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: #111; cursor: pointer; display: none; z-index: 1000; }
    .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .gy-user-badge .badge-flag { position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover; border: 1px solid var(--gold); }

    .page-wrap { position: relative; z-index: 1; min-height: 100vh; padding: 64px 12px 24px; }
    .page-title { text-align: center; font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: 1px; margin-bottom: 14px; text-shadow: 0 0 10px rgba(255,215,0,0.35); }

    .shop-wrapper { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 1100px; margin: 0 auto; }
    @media (min-width: 900px) { .shop-wrapper { grid-template-columns: 300px 1fr 300px; } }

    .panel { background: rgba(25, 16, 8, 0.78); border: 2px solid var(--border-wood); border-radius: 8px; padding: 12px; }
    .left-panel, .right-panel { display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }
    .section-title { font-family: 'Cinzel', serif; font-size: 12px; font-weight: bold; color: var(--gold); border-bottom: 2px solid var(--border-wood); padding-bottom: 4px; margin-bottom: 4px; }

    .category-group { background: rgba(255,255,255,0.05); border: 1px solid var(--border-wood); border-radius: 6px; padding: 8px; }
    .category-header { font-weight: bold; font-size: 10px; color: var(--gold); margin-bottom: 5px; display: flex; justify-content: space-between; }
    .mini-scroll { display: flex; gap: 6px; overflow-x: auto; padding: 3px 0; min-height: 48px; align-items: center; }
    .mini-item { min-width: 44px; height: 44px; border: 1.5px solid var(--border-wood); background: #fff; cursor: pointer; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
    .mini-item img { width: 100%; height: 100%; object-fit: cover; }
    .mini-item:hover { border-color: var(--gold); }
    .empty-cat { font-size: 9px; color: #998; padding: 3px; }

    .center-panel { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
    .display-frame {
        width: 100%; height: 48vh; border: 3px solid var(--border-wood); border-radius: 6px;
        position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .display-bg-fill { position: absolute; inset: -10px; background-size: cover; background-position: center; filter: blur(18px) brightness(0.75); transform: scale(1.1); }
    .display-frame img.fg { position: relative; max-width: 92%; max-height: 92%; object-fit: contain; z-index: 1; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.5)); }
    .placeholder-text { position: relative; z-index: 1; color: var(--accent-red); font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.92); padding: 10px 14px; border-radius: 6px; }
    .btn-close-item {
        position: absolute; top: 8px; right: 8px; z-index: 2; width: 26px; height: 26px; border-radius: 50%;
        background: rgba(0,0,0,0.6); color: var(--gold); border: 1px solid var(--gold); cursor: pointer;
        font-size: 14px; display: none; align-items: center; justify-content: center;
    }
    .btn-close-item.visible { display: flex; }
    .projection-switcher { display: none; gap: 8px; margin: 8px 0; }
    .projection-switcher.visible { display: flex; }
    .proj-btn { background: #3b2814; color: var(--gold); border: 1px solid var(--border-wood); padding: 4px 10px; font-size: 9px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .proj-btn.active { background: var(--accent-red); }
    .display-info h2 { font-family: 'Cinzel', serif; font-size: 15px; color: var(--gold); margin: 6px 0 3px; }
    .display-info p { font-size: 11px; color: var(--ivory); max-width: 90%; margin: 0 auto; line-height: 1.4; }

    .spec-box { background: rgba(255,255,255,0.05); border: 1px solid var(--border-wood); border-radius: 6px; padding: 10px; font-size: 10px; line-height: 1.6; color: var(--ivory); }
    .spec-box b { color: var(--gold); }
    .price-row { display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 15px; color: var(--gold); }

    .action-btn {
        background: linear-gradient(to bottom, #782814, #4a180b); color: var(--gold); border: 1px solid var(--border-wood);
        padding: 9px; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%;
        font-family: 'Share Tech Mono', monospace;
    }
    .action-btn:hover { filter: brightness(1.15); }
</style>
</head>
<body>

<div id="store-bg"></div>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-hall">&lt;&lt;</a>
</div>
<div id="passport-badge-container"></div>

<div class="page-wrap">
    <div class="page-title">ANTIQUE STORE</div>

    <div class="shop-wrapper">
        <aside class="panel left-panel">
            <div class="section-title">CATALOG</div>
            <div id="categoriesContainer"></div>
        </aside>

        <main class="panel center-panel">
            <div class="display-frame" id="displayFrame">
                <div class="display-bg-fill" id="displayBgFill" style="display:none;"></div>
                <button class="btn-close-item" id="btnCloseItem">✕</button>
                <img class="fg" id="activeImg" src="" alt="" style="display:none;">
                <div class="placeholder-text" id="emptyPlaceholder">The catalog is empty.<br>Check back soon.</div>
            </div>
            <div class="projection-switcher" id="projSwitcher">
                <button class="proj-btn active" id="projBtn1">View 1</button>
                <button class="proj-btn" id="projBtn2">View 2</button>
            </div>
            <div class="display-info">
                <h2 id="activeTitle">No item selected</h2>
                <p id="activeDesc">Pick a piece from the catalog on the left.</p>
            </div>
        </main>

        <section class="panel right-panel">
            <div class="section-title">DETAILS</div>
            <div class="spec-box" id="specsBox">
                <p><b>Category:</b> —</p><p><b>Year:</b> —</p><p><b>Dimensions:</b> —</p><p><b>Quantity:</b> —</p>
            </div>
            <div class="spec-box">
                <div class="price-row"><span>Price:</span><span id="priceDisplay">—</span></div>
            </div>
            <button class="action-btn" id="btn-add-cart">🛒 Add to cart</button>
        </section>
    </div>
</div>

<script type="module">
    import { init as initLocalization } from './core/localization.js';
    import { init as initPassport } from './modules/passport.js';
    import { supabase } from './core/supabase-init.js';
      import { openPaymentTerminal } from './modules/paymentTerminal.js';

    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));

    const CATEGORY_LABELS = { glass: 'Glass', porcelain: 'Porcelain', textile: 'Textile', wood: 'Wood', metal: 'Metal', tech: 'Tech devices' };
    const CATEGORY_ORDER = ['glass', 'porcelain', 'textile', 'wood', 'metal', 'tech'];

    let allItems = [];
    let activeItem = null;
    let activeProjection = 1;

    async function loadItems() {
        const { data, error } = await supabase.from('store_items').select('*').order('created_at', { ascending: false });
        if (error) { console.error('[Store] Load error', error); return; }
        allItems = data || [];
        renderCategories();
    }

    function renderCategories() {
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = CATEGORY_ORDER.map(cat => {
            const items = allItems.filter(i => i.category === cat);
            const thumbs = items.length
                ? items.map(item => `<div class="mini-item" data-id="${item.id}"><img src="${item.image1_url}"></div>`).join('')
                : `<span class="empty-cat">No items yet</span>`;
            return `
                <div class="category-group">
                    <div class="category-header"><span>${CATEGORY_LABELS[cat]}</span><span>(${items.length})</span></div>
                    <div class="mini-scroll">${thumbs}</div>
                </div>`;
        }).join('');
        container.querySelectorAll('.mini-item').forEach(el => {
            el.addEventListener('click', () => {
                const item = allItems.find(i => i.id === el.dataset.id);
                if (item) selectItem(item);
            });
        });
    }

    function selectItem(item) {
        activeItem = item;
        activeProjection = 1;
        updateDisplayImage();

        document.getElementById('btnCloseItem').classList.add('visible');
        const switcher = document.getElementById('projSwitcher');
        switcher.classList.toggle('visible', !!item.image2_url);
        document.getElementById('projBtn1').classList.add('active');
        document.getElementById('projBtn2').classList.remove('active');

        document.getElementById('activeTitle').textContent = item.name;
        document.getElementById('activeDesc').textContent = item.staff_note || '';
        document.getElementById('specsBox').innerHTML = `
            <p><b>Category:</b> ${CATEGORY_LABELS[item.category] || item.category}</p>
            <p><b>Year:</b> ${item.year}</p>
            <p><b>Dimensions:</b> ${item.dimensions || '—'}</p>
            <p><b>Quantity:</b> ${item.quantity_label || '1 pc.'}</p>
            ${item.staff_note ? `<p style="margin-top:4px;"><b>Staff note:</b> ${item.staff_note}</p>` : ''}
        `;
              const qtyForPrice = parseQty(item.quantity_label);
        document.getElementById('priceDisplay').textContent = qtyForPrice > 1
            ? `€${lotTotal(item).toFixed(2)} (€${Number(item.price).toFixed(2)} × ${qtyForPrice})`
            : `€${Number(item.price).toFixed(2)}`;
    }

    function clearSelection() {
        activeItem = null;
        document.getElementById('activeImg').style.display = 'none';
        document.getElementById('displayBgFill').style.display = 'none';
        document.getElementById('emptyPlaceholder').style.display = 'block';
        document.getElementById('btnCloseItem').classList.remove('visible');
        document.getElementById('projSwitcher').classList.remove('visible');
        document.getElementById('activeTitle').textContent = 'No item selected';
        document.getElementById('activeDesc').textContent = 'Pick a piece from the catalog on the left.';
        document.getElementById('specsBox').innerHTML = `<p><b>Category:</b> —</p><p><b>Year:</b> —</p><p><b>Dimensions:</b> —</p><p><b>Quantity:</b> —</p>`;
        document.getElementById('priceDisplay').textContent = '—';
    }
    document.getElementById('btnCloseItem').addEventListener('click', clearSelection);

    function updateDisplayImage() {
        if (!activeItem) return;
        const url = (activeProjection === 2 && activeItem.image2_url) ? activeItem.image2_url : activeItem.image1_url;
        const img = document.getElementById('activeImg');
        img.src = url;
        img.style.display = 'block';
        document.getElementById('emptyPlaceholder').style.display = 'none';
        const bgFill = document.getElementById('displayBgFill');
        bgFill.style.backgroundImage = `url('${url}')`;
        bgFill.style.display = 'block';
    }

    document.getElementById('projBtn1').addEventListener('click', () => {
        activeProjection = 1;
        document.getElementById('projBtn1').classList.add('active');
        document.getElementById('projBtn2').classList.remove('active');
        updateDisplayImage();
    });
    document.getElementById('projBtn2').addEventListener('click', () => {
        activeProjection = 2;
        document.getElementById('projBtn2').classList.add('active');
        document.getElementById('projBtn1').classList.remove('active');
        updateDisplayImage();
    });

     function parseQty(label) {
        const m = (label || '').match(/(\d+)/);
        return m ? parseInt(m[1], 10) : 1;
    }
    function lotTotal(item) { return Number(item.price) * parseQty(item.quantity_label); }

    document.getElementById('btn-add-cart').addEventListener('click', () => {
        if (!activeItem) { alert('Pick an item first.'); return; }
        const item = activeItem;
        const qty = parseQty(item.quantity_label);
        const total = lotTotal(item);
        const orderNumber = 'ST-' + Date.now().toString(36).toUpperCase();
        openPaymentTerminal({
            amount: total,
            orderNumber,
            lineItems: [[item.name, `€${Number(item.price).toFixed(2)} × ${qty}`]],
            onComplete: async () => {
                try {
                    await supabase.from('income_entries').insert({
                        business_line: 'store',
                        order_number: orderNumber,
                        atelier_order: { description: item.name, qty, unitPrice: Number(item.price) },
                        total_amount: total
                    });
                } catch (e) { console.error('[Store] Не удалось записать продажу в Приход', e); }
            }
        });
    });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-hall').addEventListener('click', () => window.location.href = 'hall.html');

    loadItems();
</script>

</body>
</html>
