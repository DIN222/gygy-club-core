<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club | Antique Store 003 </title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden; position: fixed;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Фоновый слой во весь экран */
        #store-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('Store 0.png') no-repeat;
            background-size: 100% 100%;
            background-color: #000;
        }

        /* Интерактивные зоны */
        .store-zone {
            position: absolute;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        /* Анимация пульсации ромашек */
        .hotspot {
            font-size: 20px;
            display: inline-block;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.7));
            animation: hotspot-pulse 2.4s ease-in-out infinite;
            transition: transform 0.2s, filter 0.2s;
            pointer-events: none;
            line-height: 1;
        }
        @keyframes hotspot-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.08); }
        }
        .store-zone:hover .hotspot {
            transform: scale(1.3);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 1));
            animation-play-state: paused;
            opacity: 1;
        }

        /* --- БОЛЬШОЕ ЦЕНТРАЛЬНОЕ ОКНО ДЕМОНСТРАЦИИ АРТЕФАКТА --- */
        .central-display {
            position: absolute;
            top: 29%;
            left: 28%;
            width: 36%;
            height: 57%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
            pointer-events: none;
        }
        .central-display img {
            max-width: 85%;
            max-height: 52%;
            object-fit: contain;
            border: 2px solid #5a3e1b;
            background: #fff;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .central-display h3 {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: bold;
            color: #2b1d0c;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .central-display p {
            font-size: 11px;
            color: #442d13;
            line-height: 1.4;
            max-width: 90%;
        }

        /* Наложенные элементы интерфейса под нарисованные поля макета */
        .ui-overlay-top-title {
            position: absolute;
            top: 19%;
            right: 8%;
            width: 24%;
            text-align: right;
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: bold;
            color: #2b1d0c;
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ui-overlay-price {
            position: absolute;
            top: 53%;
            right: 14%;
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: bold;
            color: #782814;
            z-index: 5;
            pointer-events: none;
        }

        /* --- КООРДИНАТЫ ЗОН --- */
        .zone-catalog    { top: 11%; left: 28%; width: 9%; height: 6%; }
        .zone-membership { top: 11%; left: 39%; width: 12%; height: 6%; }
        .zone-speaking   { top: 11%; left: 54%; width: 13%; height: 6%; }
        .zone-about      { top: 11%; left: 69%; width: 11%; height: 6%; }

        /* Категории слева */
        .zone-glass      { top: 35%; left: 4%; width: 18%; height: 9%; }
        .zone-porcelain  { top: 47%; left: 4%; width: 18%; height: 9%; }
        .zone-fabric     { top: 59%; left: 4%; width: 18%; height: 9%; }
        .zone-metal      { top: 71%; left: 4%; width: 18%; height: 9%; }
        .zone-tech       { top: 83%; left: 4%; width: 18%; height: 9%; }

        /* Кнопки управления справа */
        .zone-add-cart      { top: 62%; left: 66%; width: 24%; height: 7%; }
        .zone-become-member { top: 71%; left: 66%; width: 24%; height: 8%; }
        .zone-back          { top: 81%; left: 66%; width: 24%; height: 7%; }

        /* Нижние плашки */
        .zone-tag-hand      { bottom: 2%; left: 28%; width: 14%; height: 5%; }
        .zone-tag-members   { bottom: 2%; left: 43%; width: 14%; height: 5%; }
        .zone-tag-family    { bottom: 2%; left: 58%; width: 14%; height: 5%; }
    </style>
</head>
<body>

    <!-- Фоновый слой -->
    <div id="store-bg"></div>

    <!-- Большое окно демонстрации артефакта в центре -->
    <div class="central-display" id="centralDisplay">
        <img id="artifactImg" src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=300" alt="Artifact">
        <h3 id="artifactTitle">Хрустальный бокал Чарли</h3>
        <p id="artifactDesc">Ретро-бокал из бара основателей клуба. Сохранил легкий дух 70-х. (Год: 1978)</p>
    </div>

    <!-- Текстовые оверлеи под дизайн макета -->
    <div class="ui-overlay-top-title" id="topTitleDisplay">Хрустальный бокал Чарли</div>
    <div class="ui-overlay-price" id="priceDisplay">120 🪙</div>

    <!-- Интерактивные зоны с ромашками -->
    <div class="zone-zone zone-catalog" style="position:absolute; top:11%; left:28%; width:9%; height:6%; z-index:10; cursor:pointer;" onclick="alert('База данных клуба синхронизирована.')">
        <span class="hotspot" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">🌼</span>
    </div>
    
    <div class="store-zone zone-membership" onclick="location.href='identity.html'" title="Паспорт резидента">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-speaking" onclick="alert('Связь с Мастером Юмора активна')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-about" onclick="alert('GY-GY Club Antique Store — винтаж строго до 1990 года.')">
        <span class="hotspot">🌼</span>
    </div>

    <!-- КАТЕГОРИИ СЛЕВА (Связь с базой компьютера) -->
    <div class="store-zone zone-glass" onclick="selectCategory('glass')" title="Категория: Стекло">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-porcelain" onclick="selectCategory('porcelain')" title="Категория: Фарфор">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-fabric" onclick="selectCategory('fabric')" title="Категория: Текстиль/Бумага">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-metal" onclick="selectCategory('metal')" title="Категория: Металл">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-tech" onclick="selectCategory('tech')" title="Категория: Ретро-техника">
        <span class="hotspot">🌼</span>
    </div>

    <!-- Правые кнопки управления -->
    <div class="store-zone zone-add-cart" onclick="addToCart()">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-become-member" onclick="location.href='identity.html'">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-back" onclick="location.href='hall.html'" title="Вернуться в Холл">
        <span class="hotspot">🌼</span>
    </div>

    <!-- Нижние теги -->
    <div class="store-zone zone-tag-hand" onclick="alert('Категория: Ручная работа мастеров')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-tag-members" onclick="alert('Доступно резидентам клуба')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-tag-family" onclick="alert('Семейные реликвии')">
        <span class="hotspot">🌼</span>
    </div>

    <script>
        // База данных артефактов клуба (строго до 1990 года)
        const artifactsDatabase = {
            glass: [
                { name: "Хрустальный бокал Чарли", year: 1978, price: 120, img: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=300", desc: "Ретро-бокал из бара основателей клуба. Сохранил легкий дух 70-х." },
                { name: "Граненый стакан СССР", year: 1980, price: 45, img: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=300", desc: "Классика советского общепита повышенной прочности и надежности." }
            ],
            porcelain: [
                { name: "Фарфоровый конь", year: 1965, price: 340, img: "https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=300", desc: "Статуэтка смеющегося коня. Тончайшая работа мастеров старой школы." },
                { name: "Чайный сервиз 'Мальвина'", year: 1975, price: 280, img: "https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=300", desc: "Костяной фарфор с золотым ручным тиснением. Проверен на винтажность." }
            ],
            fabric: [
                { name: "Карта подземелий клуба", year: 1950, price: 95, img: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=300", desc: "Бумажный артефакт на пожелтевшем пергаменте с метками тайных ходов." },
                { name: "Винтажный гобелен", year: 1972, price: 180, img: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=300", desc: "Тканевый артефакт с вышивкой эпохи развитого гаражного соцреализма." }
            ],
            metal: [
                { name: "Шестеренка от паровоза", year: 1920, price: 210, img: "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=300", desc: "Надежная сталь начала века. Выдержала две мировые войны." },
                { name: "Медный подстаканник", year: 1968, price: 110, img: "https://images.unsplash.com/photo-1578749556568-bc2c40e68b61?w=300", desc: "С заводским клеймом. Идеален под горячий чай в долгие зимние вечера." }
            ],
            tech: [
                { name: "Ламповый процессор", year: 1985, price: 500, img: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=300", desc: "Ретро-микросхема с ручной пайкой. Теплый ламповый разум." },
                { name: "Калькулятор Электроника", year: 1988, price: 150, img: "https://images.unsplash.com/photo-1592659762303-90081d34b277?w=300", desc: "Легендарный советский калькулятор на ярких индикаторах." }
            ]
        };

        let currentCategoryIndex = {};
        let activeItem = artifactsDatabase.glass[0];

        function selectCategory(category) {
            let items = artifactsDatabase[category];
            if (!items || items.length === 0) return;

            // Циклическое переключение по предметам категории при повторном клике на ромашку
            if (currentCategoryIndex[category] === undefined) {
                currentCategoryIndex[category] = 0;
            } else {
                currentCategoryIndex[category] = (currentCategoryIndex[category] + 1) % items.length;
            }

            activeItem = items[currentCategoryIndex[category]];

            // Обновляем центральное окно
            document.getElementById('artifactImg').src = activeItem.img;
            document.getElementById('artifactTitle').textContent = activeItem.name;
            document.getElementById('artifactDesc').textContent = `${activeItem.desc} (Год создания: ${activeItem.year})`;

            // Обновляем плашки в дизайне макета
            document.getElementById('topTitleDisplay').textContent = activeItem.name;
            document.getElementById('priceDisplay').textContent = `${activeItem.price} 🪙`;
        }

        function addToCart() {
            if (activeItem) {
                alert(`🛒 Артефакт "${activeItem.name}" успешно добавлен в корзину за ${activeItem.price} GY-GY монет!`);
            }
        }
    </script>
</body>
</html>
