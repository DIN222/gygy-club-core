<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club | Antique Store 002 </title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden; position: fixed;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Фоновый слой во весь экран с точным покрытием 100% x 100% */
        #store-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('Store 0.png') no-repeat;
            background-size: 100% 100%; /* Растягивает картинку ровно на весь экран */
            background-color: #000;
        }

        /* Интерактивные зоны */
        .store-zone {
            position: absolute;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        /* Анимация пульсации ромашек */
        .hotspot {
            font-size: 20px;
            display: inline-block;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.7));
            animation: hotspot-pulse 2.4s ease-in-out infinite;
            transition: transform 0.2s, filter 0.2s;
            pointer-events: none;
            line-height: 1;
        }
        @keyframes hotspot-pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.08); }
        }
        .store-zone:hover .hotspot {
            transform: scale(1.3);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 1));
            animation-play-state: paused;
            opacity: 1;
        }

        /* --- КООРДИНАТЫ ЗОН НА ПОЛНОЭКРАННОЙ КАРТИНКЕ --- */
        /* Верхнее меню */
        .zone-catalog    { top: 11%; left: 28%; width: 9%; height: 6%; }
        .zone-membership { top: 11%; left: 39%; width: 12%; height: 6%; }
        .zone-speaking   { top: 11%; left: 54%; width: 13%; height: 6%; }
        .zone-about      { top: 11%; left: 69%; width: 11%; height: 6%; }

        /* Левые категории */
        .zone-glass      { top: 35%; left: 4%; width: 18%; height: 9%; }
        .zone-porcelain  { top: 47%; left: 4%; width: 18%; height: 9%; }
        .zone-fabric     { top: 59%; left: 4%; width: 18%; height: 9%; }
        .zone-metal      { top: 71%; left: 4%; width: 18%; height: 9%; }
        .zone-tech       { top: 83%; left: 4%; width: 18%; height: 9%; }

        /* Правые кнопки действий */
        .zone-add-cart      { top: 62%; left: 66%; width: 24%; height: 7%; }
        .zone-become-member { top: 71%; left: 66%; width: 24%; height: 8%; }
        .zone-back          { top: 81%; left: 66%; width: 24%; height: 7%; }

        /* Нижние плашки */
        .zone-tag-hand      { bottom: 2%; left: 28%; width: 14%; height: 5%; }
        .zone-tag-members   { bottom: 2%; left: 43%; width: 14%; height: 5%; }
        .zone-tag-family    { bottom: 2%; left: 58%; width: 14%; height: 5%; }
    </style>
</head>
<body>

    <!-- Фоновый слой на весь экран -->
    <div id="store-bg"></div>

    <!-- Интерактивные зоны с ромашками -->
    <div class="store-zone zone-catalog" onclick="alert('Вы в каталоге реликвий Лавки древностей')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-membership" onclick="location.href='identity.html'" title="Паспорт резидента">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-speaking" onclick="alert('Связь с Мастером Юмора активна')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-about" onclick="alert('GY-GY Club Antique Store — винтаж строго до 1990 года.')">
        <span class="hotspot">🌼</span>
    </div>

    <!-- Категории товаров -->
    <div class="store-zone zone-glass" onclick="selectCategory('glass')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-porcelain" onclick="selectCategory('porcelain')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-fabric" onclick="selectCategory('fabric')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-metal" onclick="selectCategory('metal')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-tech" onclick="selectCategory('tech')">
        <span class="hotspot">🌼</span>
    </div>

    <!-- Правые кнопки управления -->
    <div class="store-zone zone-add-cart" onclick="addToCart()">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-become-member" onclick="location.href='identity.html'">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-back" onclick="location.href='hall.html'" title="Вернуться в Холл">
        <span class="hotspot">🌼</span>
    </div>

    <!-- Нижние теги -->
    <div class="store-zone zone-tag-hand" onclick="alert('Категория: Ручная работа мастеров')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-tag-members" onclick="alert('Доступно резидентам клуба')">
        <span class="hotspot">🌼</span>
    </div>
    <div class="store-zone zone-tag-family" onclick="alert('Семейные реликвии')">
        <span class="hotspot">🌼</span>
    </div>

    <script>
        function selectCategory(category) {
            alert(`Активирована категория артефактов: ${category.toUpperCase()}`);
        }

        function addToCart() {
            alert('Артефакт успешно добавлен в вашу корзину!');
        }
    </script>
</body>
</html>
