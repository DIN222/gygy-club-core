<!DOCTYPE html>
<!--
  prints-admin.html — v2.0.0 — 2026-10-15
  Принты клуба (только сотрудники): просмотр, фон под принтом (его увидят клиенты
  в Ателье), проверка на пустые, удаление.
  Фон: light / dark / check (Grid = по умолчанию, в базе null).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Принты клуба</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .page-wrap { min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-size: 22px; margin-bottom: 14px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .panel { width: 100%; max-width: 900px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .bar select { padding: 7px; border: 1px solid var(--gold); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .btn { background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 7px 12px; font-size: 11px; cursor: pointer; font-family: inherit; text-transform: uppercase; }
    .btn:hover { border-color: var(--gold); }
    .btn.danger { color: #e74c3c; border-color: #e74c3c; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .progress { font-size: 11px; color: var(--ivory); }
    .bulk { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ivory); margin-bottom: 12px; }
    .bulk span { margin-right: 4px; opacity: 0.8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .pc { border: 1px solid var(--gold-dim); background: #0a0a0a; padding: 6px; }
    .pc.flagged { border-color: #e74c3c; }
    .thumb { width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#5a5a5a 0% 25%, #8a8a8a 0% 50%) 50% / 14px 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .thumb.bg-light { background: #ececec; }
    .thumb.bg-dark { background: #151515; }
    .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .bgsel { display: flex; gap: 3px; margin-top: 5px; }
    .bgb { flex: 1; background: #000; color: #9a9a8a; border: 1px solid #333; padding: 3px 0; font-size: 9px; cursor: pointer; font-family: inherit; }
    .bgb:hover { color: var(--gold); border-color: var(--gold-dim); }
    .bgb.on { background: var(--gold); color: #000; border-color: var(--gold); }
    .meta { font-size: 9px; color: #9a9a8a; margin: 5px 0; line-height: 1.4; }
    .flag { font-size: 10px; color: #e74c3c; margin-bottom: 4px; }
    .del { width: 100%; background: #000; color: #9a9a8a; border: 1px solid #333; padding: 4px; font-size: 10px; cursor: pointer; font-family: inherit; }
    .del:hover { color: #e74c3c; border-color: #e74c3c; }
    .note { font-size: 11px; color: #666; text-align: center; padding: 20px; }
    .note.error { color: #e74c3c; }
</style>
</head>
<body>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows"><a class="back-arrow" id="btn-back">&lt;</a><a class="back-arrow" id="btn-accounting">&lt;&lt;</a></div>
<div class="page-wrap">
    <div class="title">ПРИНТЫ КЛУБА</div>
    <div class="panel">
        <div class="bar">
            <select id="cat-filter">
                <option value="all">Все</option>
                <option value="dtf">Принты</option>
                <option value="embroidery">Вышивка</option>
            </select>
                  <div class="addbox">
            <div class="add-title">Добавить принты в базу клуба</div>
            <input type="file" id="add-files" accept="image/*" multiple>
            <div class="add-row">
                <select id="add-category">
                    <option value="dtf">Принт (DTF)</option>
                    <option value="embroidery">Эскиз вышивки</option>
                </select>
                <select id="add-bg">
                    <option value="check">Фон: Grid</option>
                    <option value="light">Фон: Light</option>
                    <option value="dark">Фон: Dark</option>
                </select>
            </div>
            <label class="add-chk"><input type="checkbox" id="add-removebg" checked> убрать однотонный фон автоматически</label>
            <label class="add-chk"><input type="checkbox" id="add-public"> разрешить лайки (может попасть в «Это круто»)</label>
            <input type="text" id="add-author" placeholder="Автор (по умолчанию GY-GY Club)">
            <button class="btn" id="btn-add-prints" type="button">Загрузить</button>
            <div class="progress" id="add-status"></div>
        </div>
            <button class="btn" id="btn-scan">Проверить на пустые</button>
            <button class="btn danger" id="btn-del-flagged" disabled>Удалить помеченные</button>
            <span class="progress" id="progress"></span>
        </div>
        <div class="bulk" id="bulk-bg">
            <span>Фон всем в списке (клиенты увидят его в Ателье):</span>
            <button class="bgb" type="button" data-bg="light">Light</button>
            <button class="bgb" type="button" data-bg="dark">Dark</button>
            <button class="bgb" type="button" data-bg="check">Grid</button>
        </div>
        <div class="note" id="note" style="display:none;"></div>
        <div class="grid" id="grid"></div>
    </div>
</div>
<script type="module">
    import { requireAuth } from './core/auth.js';
    import { supabase } from './core/supabase-init.js';
   import { prepareImage } from './modules/imageTools.js';

    const session = await requireAuth();
    if (!session) throw new Error('redirecting to login');

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeHttps = (u) => /^https:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim() : '';
    const BG_OPTIONS = [['light', 'Light'], ['dark', 'Dark'], ['check', 'Grid']];

        let rows = [];
    let stats = {};
    const flags = new Map(); // id -> причина

    function visibleRows() {
        const f = document.getElementById('cat-filter').value;
        return rows.filter(r => {
            const cat = r.category === 'embroidery' ? 'embroidery' : 'dtf';
            return f === 'all' || cat === f;
        });
    }

    function render() {
        const shown = visibleRows();
        document.getElementById('grid').innerHTML = shown.map(r => {
            const flag = flags.get(r.id);
            const cat = r.category === 'embroidery' ? 'Вышивка' : 'Принт';
            const cur = r.bg || 'check';
            const bgClass = r.bg === 'light' ? ' bg-light' : (r.bg === 'dark' ? ' bg-dark' : '');
            return `<div class="pc${flag ? ' flagged' : ''}" data-id="${esc(r.id)}">
                <div class="thumb${bgClass}"><img src="${esc(safeHttps(r.image_url))}" alt="" loading="lazy"></div>
                <div class="bgsel">${BG_OPTIONS.map(([v, l]) =>
                    `<button type="button" class="bgb${cur === v ? ' on' : ''}" data-bg="${v}">${l}</button>`).join('')}</div>
                              <div class="pubrow"><button type="button" class="pubbtn${r.published === false ? '' : ' on'}" data-pub>${r.published === false ? 'Скрыт' : 'На витрине'}</button></div>
                <div class="meta">${cat} · ${esc(new Date(r.added_at).toLocaleDateString())}<br>${esc(r.from_user_name || '—')} · ♥ ${r.likes || 0}${r.public_likes_allowed ? ' · публичный' : ''}<br>выбрано ${(stats[r.id] || {}).pick || 0} · заказано ${(stats[r.id] || {}).order || 0}</div>
                ${flag ? `<div class="flag">⚠ ${esc(flag)}</div>` : ''}
                <button class="del" type="button">Удалить</button>
            </div>`;
        }).join('');
        const note = document.getElementById('note');
        note.className = 'note';
        note.style.display = shown.length ? 'none' : 'block';
        note.textContent = 'Принтов нет.';
        document.getElementById('btn-del-flagged').disabled = flags.size === 0;
    }

    async function load() {
        const { data, error } = await supabase.from('club_prints').select('*').order('added_at', { ascending: false }).limit(500);
        const note = document.getElementById('note');
        if (error) {
            console.error(error);
            note.className = 'note error';
            note.style.display = 'block';
            note.textContent = 'Не удалось загрузить принты: ' + (error.message || '');
            return;
        }
               rows = data || [];
        await loadStats();
        render();
    }

    // ---------- фон под принтом ----------
    async function setBg(ids, bg) {
        const value = bg === 'check' ? null : bg;
        const { data, error } = await supabase.from('club_prints').update({ bg: value }).in('id', ids).select('id');
        if (error || !data || data.length === 0) {
            throw new Error(error ? error.message : 'нет прав — проверьте SQL (политика update и колонка bg)');
        }
        rows.forEach(r => { if (ids.includes(r.id)) r.bg = value; });
    }

    document.getElementById('bulk-bg').addEventListener('click', async (e) => {
        const b = e.target.closest('.bgb');
        if (!b) return;
        const shown = visibleRows();
        const label = BG_OPTIONS.find(o => o[0] === b.dataset.bg)[1];
        if (!shown.length || !confirm(`Задать фон «${label}» для принтов в списке (${shown.length})? Клиенты увидят его в Ателье.`)) return;
        try {
            await setBg(shown.map(r => r.id), b.dataset.bg);
            render();
        } catch (err) { alert('Не удалось задать фон: ' + err.message); }
    });

    // ---------- проверка на пустые ----------
    function loadImage(src) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('load'));
            img.src = src;
        });
    }

    // Возвращает причину, если изображение «пустое», иначе null
    async function analyze(url) {
        let img;
        try { img = await loadImage(url); } catch (e) { return 'не загружается'; }
        try {
            const N = 48;
            const c = document.createElement('canvas');
            c.width = N; c.height = N;
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, N, N);
            const d = ctx.getImageData(0, 0, N, N).data;
            let opaque = 0, minL = 255, maxL = 0;
            for (let i = 0; i < d.length; i += 4) {
                if (d[i + 3] > 25) {
                    opaque++;
                    const L = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                    if (L < minL) minL = L;
                    if (L > maxL) maxL = L;
                }
            }
            const ratio = opaque / (N * N);
            if (ratio < 0.01) return 'полностью прозрачное';
            if (ratio > 0.98 && (maxL - minL) < 12) return 'сплошной однотонный квадрат';
            return null;
        } catch (e) {
            return null; // не удалось прочитать пиксели — не помечаем
        }
    }

    async function scan() {
        const btn = document.getElementById('btn-scan');
        const prog = document.getElementById('progress');
        btn.disabled = true;
        flags.clear();
        for (let i = 0; i < rows.length; i++) {
            prog.textContent = `Проверено ${i} из ${rows.length}`;
            const reason = await analyze(safeHttps(rows[i].image_url));
            if (reason) flags.set(rows[i].id, reason);
        }
        prog.textContent = `Готово: помечено ${flags.size} из ${rows.length}`;
        btn.disabled = false;
        render();
    }

    // ---------- удаление ----------
    async function deleteRow(r) {
        const { error: storageError } = await supabase.storage.from('club-prints').remove([r.storage_path]);
        if (storageError) console.warn('[PrintsAdmin] Файл не удалён из хранилища', storageError);
        const { data, error } = await supabase.from('club_prints').delete().eq('id', r.id).select('id');
        if (error || !data || !data.length) throw new Error(error ? error.message : 'нет прав — проверьте SQL (политика удаления)');
    }

    document.getElementById('grid').addEventListener('click', async (e) => {
        const card = e.target.closest('.pc');
        if (!card) return;
        const r = rows.find(x => String(x.id) === card.dataset.id);
        if (!r) return;

                if (e.target.closest('[data-pub]')) {
            const next = r.published === false;   // скрыт → выставить, иначе скрыть
            const { data, error } = await supabase.from('club_prints').update({ published: next }).eq('id', r.id).select('id');
            if (error || !data || !data.length) { alert('Не удалось изменить: ' + (error ? error.message : 'нет прав — проверьте SQL')); return; }
            r.published = next;
            render();
            return;
        }

        const bgBtn = e.target.closest('.bgb');
        if (bgBtn) {
            try {
                await setBg([r.id], bgBtn.dataset.bg);
                render();
            } catch (err) { alert('Не удалось задать фон: ' + err.message); }
            return;
        }

        if (e.target.closest('.del')) {
            if (!confirm('Удалить принт насовсем?')) return;
            try {
                await deleteRow(r);
                rows = rows.filter(x => x.id !== r.id);
                flags.delete(r.id);
                render();
            } catch (err) { alert('Не удалось удалить: ' + err.message); }
        }
    });

    document.getElementById('btn-del-flagged').addEventListener('click', async () => {
        const targets = rows.filter(r => flags.has(r.id));
        if (!targets.length || !confirm(`Удалить помеченные принты (${targets.length}) насовсем?`)) return;
        const prog = document.getElementById('progress');
        let done = 0;
        for (const r of targets) {
            try { await deleteRow(r); rows = rows.filter(x => x.id !== r.id); flags.delete(r.id); done++; }
            catch (err) { prog.textContent = 'Остановлено: ' + err.message; break; }
            prog.textContent = `Удалено ${done} из ${targets.length}`;
        }
        render();
    });

    document.getElementById('cat-filter').addEventListener('change', render);
    document.getElementById('btn-scan').addEventListener('click', scan);
    document.getElementById('btn-back').addEventListener('click', () => history.back());
     document.getElementById('btn-accounting').addEventListener('click', () => window.location.href = 'gallery.html');
    // ---------- добавление принтов администрацией ----------
    (function ensureAddStyles() {
        if (document.getElementById('pa-add-styles')) return;
        const s = document.createElement('style');
        s.id = 'pa-add-styles';
        s.textContent = `
            .addbox { border: 1px solid #8a6f24; background: #0a0a0a; padding: 10px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
            .add-title { font-size: 10px; color: #8a6f24; text-transform: uppercase; letter-spacing: 1px; }
            .addbox input[type="file"] { color: #F0EAD6; font-family: inherit; font-size: 11px; }
            .addbox input[type="text"], .addbox select { padding: 7px; border: 1px solid #8a6f24; background: #F0EAD6; color: #1a1408; font-family: inherit; font-size: 11px; }
            .add-row { display: flex; gap: 8px; }
            .add-row select { flex: 1; }
            .add-chk { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #F0EAD6; }
        `;
        document.head.appendChild(s);
    })();

    document.getElementById('btn-add-prints').addEventListener('click', async () => {
        const input = document.getElementById('add-files');
        const status = document.getElementById('add-status');
        const btn = document.getElementById('btn-add-prints');
        const files = [...input.files];
        if (!files.length) { status.textContent = 'Выберите файлы.'; return; }

        const category = document.getElementById('add-category').value;
        const bg = document.getElementById('add-bg').value;
        const removeBg = document.getElementById('add-removebg').checked;
        const publicLikes = document.getElementById('add-public').checked;
        const author = document.getElementById('add-author').value.trim() || 'GY-GY Club';

        btn.disabled = true;
        let ok = 0;
        const failed = [];
        for (let i = 0; i < files.length; i++) {
            status.textContent = `Загружаю ${i + 1} из ${files.length}…`;
            try {
                const blob = await prepareImage(files[i], { removeBg });
                const path = `${category}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.png`;
                const { error: upErr } = await supabase.storage.from('club-prints').upload(path, blob, { contentType: 'image/png' });
                if (upErr) throw upErr;
                const { data: urlData } = supabase.storage.from('club-prints').getPublicUrl(path);
                const { error: insErr } = await supabase.from('club_prints').insert({
                    category, image_url: urlData.publicUrl, storage_path: path,
                    from_user_id: 'office', from_user_name: author,
                    public_likes_allowed: publicLikes, bg: bg === 'check' ? null : bg
                });
                if (insErr) {
                    await supabase.storage.from('club-prints').remove([path]);
                    throw insErr;
                }
                ok++;
            } catch (e) {
                console.error('[PrintsAdmin] Не загрузилось:', files[i].name, e);
                failed.push(`${files[i].name}: ${e.message || e}`);
            }
        }
        btn.disabled = false;
        input.value = '';
        status.textContent = failed.length
            ? `Загружено ${ok} из ${files.length}. Не загрузились: ${failed.join('; ')}`
            : `Готово: загружено ${ok}.`;
        await load();
    });
  
    load();
</script>
</body>
</html>
