<!DOCTYPE html>
<!--
  production.html
  v1.0.0 — 2026-10-01
  Нормы расхода сырья на единицу изделия + создание партий: списывает
  сырьё со склада по нормам, добавляет зарплату/накладные, считает
  себестоимость единицы (с учётом брака — брак увеличивает себестоимость
  годных единиц, не идёт в продажу), сдаёт годные изделия на склад.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Производство v1.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); overflow-y: auto; font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .back-arrow:hover { opacity: 0.6; }
    .page-wrap { position: relative; min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; margin-bottom: 16px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .panel { width: 100%; max-width: 640px; }
    .section-label { font-size: 10px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 70px; gap: 6px; margin-bottom: 8px; }
    .form-grid input, .form-grid select { padding: 7px; border: 1px solid var(--gold); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 10px; }
    .btn-cfg { background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 8px 12px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-family: inherit; font-size: 11px; }
    .btn-cfg:hover { border-color: var(--gold); }
    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
    th { text-align: left; color: var(--gold-dim); padding: 6px 4px; border-bottom: 1px solid var(--gold-dim); font-size: 10px; text-transform: uppercase; }
    td { padding: 6px 4px; border-bottom: 1px solid #1a1a1a; color: var(--ivory); }
    td.amount { color: var(--gold); text-align: right; white-space: nowrap; }
    .batch-form { display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px dashed var(--gold-dim); margin-bottom: 10px; }
    .batch-form input, .batch-form select { padding: 7px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .status-line { font-size: 11px; margin-top: 8px; min-height: 14px; }
    .status-line.error { color: #e74c3c; }
    .status-line.ok { color: #6fd48a; }
</style>
</head>
<body>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-accounting">&lt;&lt;</a>
</div>

<div class="page-wrap">
    <div class="title">ПРОИЗВОДСТВО</div>

    <div class="panel">
        <div class="section-label">Нормы расхода на 1 единицу</div>
        <div class="form-grid">
            <input type="text" id="norm-garment" placeholder="Вид (tshirt, hoodie...)">
            <input type="text" id="norm-material" placeholder="Материал (как на складе)">
            <input type="number" id="norm-qty" placeholder="Кол-во на 1 шт" min="0" step="0.01">
            <button class="btn-cfg" id="btn-add-norm" style="font-size:10px; padding:7px 4px;">+</button>
        </div>
        <table>
            <thead><tr><th>Вид</th><th>Материал</th><th>Норма/ед.</th></tr></thead>
            <tbody id="norms-rows"></tbody>
        </table>

        <div class="section-label">Новая партия</div>
        <div class="batch-form">
            <input type="text" id="batch-garment" placeholder="Вид изделия (должен совпадать с нормой)">
            <input type="number" id="batch-qty" placeholder="Произведено, шт" min="1" step="1">
            <input type="number" id="batch-defect" placeholder="Брак, шт" min="0" step="1" value="0">
            <input type="number" id="batch-labor" placeholder="Зарплата на партию, €" min="0" step="0.01">
            <input type="number" id="batch-overhead" placeholder="Накладные на партию (аренда/комм.), €" min="0" step="0.01">
            <button class="btn-cfg" id="btn-create-batch">СОЗДАТЬ ПАРТИЮ</button>
            <div class="status-line" id="batch-status"></div>
        </div>

        <div class="section-label">История партий</div>
        <table>
            <thead><tr><th>Дата</th><th>Вид</th><th>Годных</th><th>Брак</th><th>Себест./ед.</th></tr></thead>
            <tbody id="batch-rows"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { supabase } from './core/supabase-init.js';

    async function loadNorms() {
        const { data } = await supabase.from('production_norms').select('*').order('garment_type');
        document.getElementById('norms-rows').innerHTML = (data || []).map(n => `
            <tr><td>${n.garment_type}</td><td>${n.material_name}</td><td>${n.quantity_per_unit} ${n.unit}</td></tr>
        `).join('') || '<tr><td colspan="3" style="color:#666;">Норм пока нет</td></tr>';
        return data || [];
    }

    document.getElementById('btn-add-norm').addEventListener('click', async () => {
        const garment_type = document.getElementById('norm-garment').value.trim();
        const material_name = document.getElementById('norm-material').value.trim();
        const quantity_per_unit = parseFloat(document.getElementById('norm-qty').value) || 0;
        if (!garment_type || !material_name || quantity_per_unit <= 0) return;
        await supabase.from('production_norms').insert({ garment_type, material_name, quantity_per_unit });
        document.getElementById('norm-garment').value = '';
        document.getElementById('norm-material').value = '';
        document.getElementById('norm-qty').value = '';
        loadNorms();
    });

    async function loadBatches() {
        const { data } = await supabase.from('production_batches').select('*').order('produced_at', { ascending: false }).limit(20);
        document.getElementById('batch-rows').innerHTML = (data || []).map(b => `
            <tr>
                <td>${new Date(b.produced_at).toLocaleDateString()}</td>
                <td>${b.garment_type}</td>
                <td>${b.quantity_produced - b.quantity_defect}</td>
                <td>${b.quantity_defect}</td>
                <td class="amount">€${Number(b.cost_per_unit).toFixed(2)}</td>
            </tr>`).join('') || '<tr><td colspan="5" style="color:#666;">Партий пока нет</td></tr>';
    }

    document.getElementById('btn-create-batch').addEventListener('click', async () => {
        const status = document.getElementById('batch-status');
        status.className = 'status-line';
        const garment_type = document.getElementById('batch-garment').value.trim();
        const quantity_produced = parseInt(document.getElementById('batch-qty').value) || 0;
        const quantity_defect = parseInt(document.getElementById('batch-defect').value) || 0;
        const labor_cost = parseFloat(document.getElementById('batch-labor').value) || 0;
        const overhead_cost = parseFloat(document.getElementById('batch-overhead').value) || 0;

        if (!garment_type || quantity_produced <= 0) {
            status.textContent = 'Укажите вид и количество.'; status.classList.add('error'); return;
        }
        const goodUnits = quantity_produced - quantity_defect;
        if (goodUnits <= 0) {
            status.textContent = 'Годных единиц получилось 0 — проверьте цифры.'; status.classList.add('error'); return;
        }

        const norms = await loadNorms();
        const myNorms = norms.filter(n => n.garment_type === garment_type);
        if (myNorms.length === 0) {
            status.textContent = `Нет норм для "${garment_type}" — добавьте их выше перед созданием партии.`;
            status.classList.add('error'); return;
        }

        // Проверяем остатки и считаем стоимость материалов
        let materialsCost = 0;
        const deductions = [];
        for (const norm of myNorms) {
            const needed = norm.quantity_per_unit * quantity_produced;
            const { data: stock } = await supabase
                .from('warehouse_stock').select('*')
                .eq('item_name', norm.material_name).eq('item_type', 'raw_material').eq('business_line', 'atelier')
                .maybeSingle();
            const available = stock ? Number(stock.quantity) : 0;
            if (available < needed) {
                status.textContent = `Не хватает "${norm.material_name}" на складе: нужно ${needed.toFixed(2)}, есть ${available.toFixed(2)}.`;
                status.classList.add('error');
                return;
            }
            materialsCost += needed * Number(stock.avg_unit_cost);
            deductions.push({ stock, needed });
        }

        // Списываем со склада
        for (const { stock, needed } of deductions) {
            await supabase.from('warehouse_stock').update({
                quantity: Number(stock.quantity) - needed, updated_at: new Date().toISOString()
            }).eq('id', stock.id);
            await supabase.from('warehouse_movements').insert({
                item_name: stock.item_name, item_type: 'raw_material', business_line: 'atelier',
                movement_type: 'issue_production', quantity: -needed, unit: stock.unit
            });
        }

        const totalCost = materialsCost + labor_cost + overhead_cost;
        const costPerUnit = totalCost / goodUnits; // себестоимость брака ложится на годные единицы

        // Приходуем готовую продукцию
        const { data: existingFinished } = await supabase
            .from('warehouse_stock').select('*')
            .eq('item_name', garment_type).eq('item_type', 'finished_good').eq('business_line', 'atelier')
            .maybeSingle();
        if (existingFinished) {
            const oldQty = Number(existingFinished.quantity), oldCost = Number(existingFinished.avg_unit_cost);
            const newQty = oldQty + goodUnits;
            const newAvgCost = ((oldQty * oldCost) + (goodUnits * costPerUnit)) / newQty;
            await supabase.from('warehouse_stock').update({
                quantity: newQty, avg_unit_cost: newAvgCost, updated_at: new Date().toISOString()
            }).eq('id', existingFinished.id);
        } else {
            await supabase.from('warehouse_stock').insert({
                item_name: garment_type, item_type: 'finished_good', business_line: 'atelier',
                quantity: goodUnits, unit: 'шт', avg_unit_cost: costPerUnit
            });
        }
        await supabase.from('warehouse_movements').insert({
            item_name: garment_type, item_type: 'finished_good', business_line: 'atelier',
            movement_type: 'receipt_production', quantity: goodUnits, unit: 'шт'
        });
        if (quantity_defect > 0) {
            await supabase.from('warehouse_movements').insert({
                item_name: garment_type, item_type: 'finished_good', business_line: 'atelier',
                movement_type: 'defect_writeoff', quantity: quantity_defect, unit: 'шт',
                note: 'Брак, не поступает на продажу'
            });
        }

        await supabase.from('production_batches').insert({
            garment_type, quantity_produced, quantity_defect,
            materials_cost: materialsCost, labor_cost, overhead_cost,
            total_cost: totalCost, cost_per_unit: costPerUnit
        });

        status.textContent = `Партия создана: ${goodUnits} шт готовой продукции, себестоимость €${costPerUnit.toFixed(2)}/шт.`;
        status.classList.add('ok');
        document.getElementById('batch-garment').value = '';
        document.getElementById('batch-qty').value = '';
        document.getElementById('batch-defect').value = '0';
        document.getElementById('batch-labor').value = '';
        document.getElementById('batch-overhead').value = '';
        loadBatches();
    });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');

    loadNorms();
    loadBatches();
</script>

</body>
</html>
