<!DOCTYPE html>
<!--
  hall.html
  v2.0.0 — 2026-09-22
  Полная перестройка навигации: лифт убран целиком (lift.html больше
  никуда не ведёт и может быть удалён из репозитория). Фото-фон Холла
  остаётся приглушённой атмосферной подложкой (opacity вместо полной
  непрозрачности), а поверх — прямая панель с кнопками, по тому же
  принципу, что и в Ателье (никаких hover-only ромашек без подписи
  на мобильном).
  Пять реально рабочих направлений собраны в панель: AI ROOM, OFFICE,
  BAR (все три уже были рабочими), АТЕЛЬЕ (заменяет мёртвую заглушку
  "Студио"), ЛАВКА ДРЕВНОСТЕЙ (уже была рабочей зоной). Сувениры и
  Проектор — ещё не построены, сознательно не показаны как заглушки
  в панели (тот же принцип, что и с Embroidery/Combined в Ателье) —
  добавятся отдельной правкой, когда будут готовы их страницы.
  Стилистика приведена в соответствие с уже устоявшимся языком Ателье:
  золото — только на важном (заголовок, кнопки), тонкие линии вместо
  толстых рамок, ivory для читаемых участков, glow — только на
  заголовке. Навигационные стрелки/лого/бейдж паспорта — position:
  absolute (не fixed), чтобы корректно уезжали при скролле длинного
  контента (тот же баг, что чинили в Ателье).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GY-GY Club — Hall v2.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
        width: 100%; min-height: 100%;
        background: #000000; color: var(--gold);
        overflow-y: auto; overflow-x: hidden;
        font-family: 'Share Tech Mono', monospace;
    }

    #hall-bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: url('Нalld2.png') center/85% auto no-repeat;
        opacity: 0.3;
    }

    .header-right {
        position: absolute; top: 18px; right: 25px; z-index: 1000;
        font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif;
        pointer-events: none;
    }

    .ui-nav-arrows {
        position: absolute; top: 18px; left: 20px; z-index: 1000;
        display: flex; gap: 15px; font-size: 24px; font-weight: 900;
        font-family: 'Share Tech Mono', monospace;
    }
    .back-arrow {
        color: var(--gold); background: transparent; border: none; text-decoration: none;
        cursor: pointer; transition: opacity 0.2s, transform 0.2s;
    }
    .back-arrow:hover { opacity: 0.8; transform: scale(1.1); }

    .gy-user-badge {
        position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
        width: 36px; height: 36px; border-radius: 50%;
        border: 2px solid var(--gold); background: #111;
        z-index: 1000; cursor: pointer; display: none;
    }
    .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .gy-user-badge .badge-flag {
        position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover;
        border: 1px solid var(--gold);
    }

    .page-wrap {
        position: relative; z-index: 1; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 70px 16px 40px;
    }

    .hall-title {
        font-family: 'Cinzel', serif; font-weight: 900; font-size: 22px;
        letter-spacing: 3px; text-align: center; margin-bottom: 8px;
        text-shadow: 0 0 10px rgba(255,215,0,0.4);
    }

    .quote-text {
        text-align: center; max-width: 420px;
        font-family: 'Cormorant Garamond', serif; font-style: italic;
        font-size: 18px; color: var(--ivory);
        margin-bottom: 32px;
    }

    .menu-grid {
        display: flex; flex-direction: column; gap: 10px;
        width: 100%; max-width: 300px;
    }
    .menu-btn {
        background: #000; color: var(--gold); border: 1px solid var(--gold-dim);
        padding: 14px 16px; cursor: pointer; font-weight: 700; text-transform: uppercase;
        font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 1px;
        text-align: center; border-radius: 2px; transition: border-color 0.2s, color 0.2s;
    }
    .menu-btn:hover { border-color: var(--gold); filter: brightness(1.1); }

    .gy-passport-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
        display: none; align-items: center; justify-content: center; opacity: 0;
        transition: opacity 0.3s ease;
    }
    .gy-passport-card {
        background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px;
        padding: 25px; width: 280px; color: #000; text-align: center; position: relative;
        font-family: 'Share Tech Mono', monospace;
    }
    .gy-passport-close { position: absolute; top: 10px; right: 14px; font-size: 28px; cursor: pointer; }
    .gy-passport-title { font-weight: 900; font-size: 16px; font-family: 'Cinzel', serif; }
    .gy-passport-id { font-weight: 700; font-size: 13px; margin-top: 5px; color: #555; }
    .gy-passport-nick { font-weight: 700; font-size: 14px; margin-top: 4px; }
    .gy-passport-avatar-box, .gy-passport-qr-box {
        width: 90px; height: 90px; border: 2px solid var(--gold); background: #fff;
        margin: 8px auto; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .gy-passport-avatar { width: 100%; height: 100%; object-fit: cover; }
    .gy-passport-edit {
        margin-top: 14px; padding: 8px 20px; background: #000; border: 2px solid var(--gold);
        color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700;
        font-family: 'Montserrat', 'Cinzel', sans-serif; font-size: 11px;
        transition: filter 0.3s ease;
    }
    .gy-passport-edit:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<div id="hall-bg"></div>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back" title="Назад">&lt;</a>
    <a class="back-arrow" id="btn-home" title="На вход">&lt;&lt;</a>
</div>
<div id="passport-badge-container"><!-- заполняется modules/passport.js --></div>

<div class="page-wrap">
    <div class="hall-title">GY-GY CLUB — HALL</div>
    <div class="quote-text" data-translate="hall_quote">In every joke there is a share of whisky</div>

      <div class="menu-grid">
        <button class="menu-btn" id="btn-ai-room" data-translate="zone_ai_room">AI ROOM</button>
        <button class="menu-btn" id="btn-office" data-translate="zone_office">OFFICE</button>
        <button class="menu-btn" id="btn-bar" data-translate="zone_bar">BAR</button>
        <button class="menu-btn" id="btn-atelier">АТЕЛЬЕ «КОНЬ В ПАЛЬТО»</button>
        <button class="menu-btn" id="btn-store">ЛАВКА ДРЕВНОСТЕЙ</button>
        <button class="menu-btn" id="btn-hall-of-fame">★ ЗАЛ СЛАВЫ</button>
    </div>
</div>

<script type="module">
    import { init as initLocalization } from './core/localization.js';
    import { init as initPassport } from './modules/passport.js';
    import { init as initNav, registerSound, goToPage } from './modules/navigation.js';

    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));
    initNav(document.body);
    registerSound('door', 'door_open.mp3');

    document.getElementById('btn-ai-room').addEventListener('click', () => goToPage('verses.html'));
    document.getElementById('btn-office').addEventListener('click', () => goToPage('office.html'));
    document.getElementById('btn-bar').addEventListener('click', () => goToPage('bar.html', { sound: 'door' }));
    document.getElementById('btn-atelier').addEventListener('click', () => goToPage('atelier.html'));
        document.getElementById('btn-store').addEventListener('click', () => goToPage('store.html'));
    document.getElementById('btn-hall-of-fame').addEventListener('click', () => goToPage('hall-of-fame.html'));
    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-home').addEventListener('click', () => window.location.href = 'index.html');
</script>

</body>
</html>
