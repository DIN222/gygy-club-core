<!DOCTYPE html>
<!--
  atelier.html
  v3.2.0 — 2026-09-14
  Изменения относительно v3.1.0:
  (1) Полная перекомпоновка CONFIGURE YOUR ORDER: все селекторы и кнопки
      сведены в единую узкую левую колонку, вся освободившаяся ширина
      отдана под увеличенное превью (до 460×460), адаптивная раскладка
      (колонка под колонкой) ниже 700px.
  (2) Силуэты пересобраны с нуля: футболка — короткий рукав + круглый
      вырез; худи — длинный рукав, капюшон со шнурками, накладной карман-
      кенгуру; свитшот — длинный рукав, круглый вырез, ребристые манжеты/
      низ/ворот. Устранён баг предыдущей версии: капюшон рендерился тем же
      цветом, что и корпус, из-за дублирующегося атрибута fill при
      regex-замене — теперь используются токены {{FILL}}/{{STROKE}}/
      {{ACCENT}} с точечной заменой.
  (3) Введено разделение БАЗА ЮЗЕРА / БАЗА АТЕЛЬЕ: индикатор владельца
      базы (из паспорта), модалка "MY BASE" с личными загрузками + кнопка
      переноса каждого изображения в общую "ATELIER BASE".
  (4) Загружаемые изображения теперь автоматически уменьшаются
      (canvas, max 500px, JPEG q=0.85) перед сохранением — экономия
      localStorage.
  (5) Интеграция с паспортом — через ДИНАМИЧЕСКИЙ import core/eventBus.js
      с защитой try/catch (не роняет страницу, если модуль/метод не
      совпадает). ТРЕБУЕТ ПРОВЕРКИ реального имени события и формы данных
      — см. комментарий в блоке <script>.
  (6) Atelier94.png — без изменений.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Atelier v3.2.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<style>
    :root { --gold: #FFD700; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%; background: #000; color: var(--gold);
        overflow: hidden; position: fixed; font-family: 'Share Tech Mono', monospace;
    }
    #atelier-bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: url('Atelier94.png') center/cover no-repeat;
    }
    .header-right { position: fixed; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: fixed; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; transition: opacity 0.2s, transform 0.2s; pointer-events: auto; }
    .back-arrow:hover { opacity: 0.8; transform: scale(1.1); }
    .gy-user-badge { position: fixed; top: 4px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: #111; cursor: pointer; display: none; z-index: 1000; }
    .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .gy-user-badge .badge-flag { position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover; border: 1px solid var(--gold); }

    .zone {
        position: absolute; cursor: pointer; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        pointer-events: auto;
    }
    .hotspot {
        font-size: 20px; display: inline-block;
        filter: drop-shadow(0 0 4px rgba(255,215,0,0.7));
        animation: hotspot-pulse 2.4s ease-in-out infinite;
        transition: transform 0.2s, filter 0.2s; pointer-events: none; line-height: 1;
    }
    @keyframes hotspot-pulse { 0%,100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    .zone:hover .hotspot { transform: scale(1.3); filter: drop-shadow(0 0 10px rgba(255,215,0,1)); animation-play-state: paused; opacity: 1; }
    .zone-label {
        position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
        margin-bottom: 4px; font-size: 10px; font-weight: 700; letter-spacing: 1px;
        color: var(--gold); text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
        white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .zone:hover .zone-label { opacity: 1; }

    .zone-rack        { top: 42vh; left: 16vw; width: 24vw; height: 32vh; }
    .zone-embroidery  { top: 61.5vh; left: 44vw; width: 20vw; height: 6vh; }
    .zone-combined    { top: 68vh; left: 44vw; width: 20vw; height: 6vh; }
    .zone-consultant  { top: 30vh; left: 73vw; width: 15vw; height: 40vh; }
    .zone-monitor     { top: 15vh; left: 8vw; width: 10vw; height: 15vh; }
    .zone-phone       { top: 65vh; left: 88vw; width: 8vw; height: 12vh; }

    /* ===== Единый экран конфигурации ===== */
    .config-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000;
        display: none; align-items: center; justify-content: center;
        opacity: 0; transition: opacity 0.3s ease; overflow-y: auto; padding: 16px;
        pointer-events: auto;
    }
    .config-card {
        background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px;
        padding: 18px; width: 760px; max-width: 98vw; color: #000; position: relative;
        font-family: 'Share Tech Mono', monospace;
    }
    .config-close { position: absolute; top: 6px; right: 10px; font-size: 24px; cursor: pointer; }
    .config-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 15px; margin-bottom: 10px; text-align: center; }

    /* ---- База юзера / база ателье ---- */
    .base-indicator {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        background: #fff; border: 1px solid #000; padding: 5px 8px; margin-bottom: 8px;
        font-size: 9px; font-weight: 700;
    }
    .base-indicator .btn-cfg { padding: 3px 7px; font-size: 8px; }
    .base-tabs { display: flex; gap: 6px; margin: 10px 0 4px; }
    .base-tab { flex: 1; text-align: center; }
    .base-tab.active { background: var(--gold); color: #000; }
    .base-gallery {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        max-height: 280px; overflow-y: auto; margin-top: 6px;
    }
    .base-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .base-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid #000; background: #eee; }
    .base-cell-actions { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
    .base-cell-actions .btn-cfg { padding: 2px 4px; font-size: 7px; }
    .modal-card.wide { width: 360px; }

    /* ---- Поля конфигурации (в левой колонке) ---- */
    .field-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .field-row select { flex: 1; padding: 5px; border: 1px solid #000; font-family: inherit; font-size: 9px; }

    .config-body { display: flex; gap: 14px; margin-top: 4px; align-items: flex-start; }
    .buttons-col { flex: 0 0 220px; display: flex; flex-direction: column; gap: 6px; }
    .frame-col { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }

    @media (max-width: 700px) {
        .config-body { flex-direction: column; align-items: center; }
        .buttons-col { flex: 1 1 auto; width: 100%; max-width: 460px; }
    }

    .preview-frame {
        width: 100%; max-width: 460px; height: min(56vh, 460px); border: 2px solid #000; background: #fff;
        position: relative; display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .preview-frame svg.garment-svg { height: 92%; width: auto; }
    .size-badge {
        position: absolute; top: 6px; right: 6px; background: var(--gold);
        color: #000; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px;
    }
    .print-overlay-img, .print-overlay-emoji {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .btn-cfg {
        background: #000; color: var(--gold); border: 2px solid var(--gold);
        padding: 6px 8px; cursor: pointer; font-weight: 700; text-transform: uppercase;
        font-family: 'Share Tech Mono', monospace; font-size: 9px; text-align: left;
    }
    .btn-cfg:hover:not(:disabled) { filter: brightness(1.2); }
    .btn-cfg:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-cfg.confirm { background: #1a4; border-color: #1a4; color: #fff; text-align: center; }

    .position-row { display: flex; gap: 6px; margin-top: 8px; width: 100%; max-width: 460px; }
    .position-row select { flex: 1; padding: 4px; font-size: 10px; border: 1px solid #000; }

    .order-info { font-size: 10px; margin-top: 8px; padding: 6px; background: #fff; border: 1px solid #000; }
    .price-line { font-family: 'Cinzel', serif; font-weight: 700; font-size: 16px; text-align: center; margin-top: 6px; }
    .status-line { font-size: 10px; color: #2a6; text-align: center; margin-top: 4px; min-height: 14px; }

    .prompt-builder { display: none; margin-top: 6px; padding: 8px; background: #fff; border: 1px dashed #000; }
    .prompt-builder.open { display: block; }
    .prompt-builder select, .prompt-builder input { width: 100%; padding: 4px; margin-bottom: 5px; font-size: 9px; border: 1px solid #000; }
    .prompt-output { font-size: 9px; background: #eee; padding: 6px; margin-top: 5px; word-break: break-word; user-select: all; }

    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
        display: none; align-items: center; justify-content: center; opacity: 0;
        transition: opacity 0.3s ease; pointer-events: auto;
    }
    .modal-card {
        background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px;
        padding: 24px; width: 300px; color: #000; text-align: center; position: relative;
        font-family: 'Share Tech Mono', monospace;
    }
    .modal-close { position: absolute; top: 8px; right: 12px; font-size: 26px; cursor: pointer; }
    .modal-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 15px; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="atelier-bg"></div>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-hall">&lt;&lt;</a>
</div>
<div id="passport-badge-container"></div>

<div class="zone zone-rack" id="zone-rack"><span class="hotspot">🌼</span><span class="zone-label">START ORDER</span></div>
<div class="zone zone-embroidery" id="zone-embroidery"><span class="hotspot">🌼</span><span class="zone-label">EMBROIDERY</span></div>
<div class="zone zone-combined" id="zone-combined"><span class="hotspot">🌼</span><span class="zone-label">COMBINED</span></div>
<div class="zone zone-consultant" id="zone-consultant"><span class="hotspot">🌼</span><span class="zone-label">BOT (SOON)</span></div>
<div class="zone zone-phone" id="zone-phone"><span class="hotspot">🌼</span><span class="zone-label">CALL FOR HELP</span></div>
<div class="zone zone-monitor" id="zone-monitor"><span class="hotspot">🌼</span><span class="zone-label">???</span></div>

<div class="config-overlay" id="config-overlay">
    <div class="config-card">
        <span class="config-close" data-close>&times;</span>
        <div class="config-title">CONFIGURE YOUR ORDER</div>

        <div class="config-body">
            <div class="buttons-col">

                <div class="base-indicator">
                    <span id="base-owner-label">BASE: GUEST</span>
                    <button class="btn-cfg" id="btn-my-base">MY BASE</button>
                </div>

                <div class="field-row">
                    <select id="select-type">
                        <option value="tshirt">T-SHIRT (UNISEX)</option>
                        <option value="hoodie">HOODIE (UNISEX)</option>
                        <option value="sweatshirt">SWEATSHIRT (UNISEX)</option>
                    </select>
                </div>
                <div class="field-row">
                    <select id="select-size">
                        <option value="S">S</option><option value="M" selected>M</option>
                        <option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
                    </select>
                    <select id="select-color">
                        <option value="black">BLACK</option><option value="white">WHITE</option>
                    </select>
                </div>
                <div class="field-row">
                    <select id="select-fabric-density">
                        <option value="160-180">160–180 g/m²</option>
                    </select>
                    <select id="select-fabric-composition">
                        <option value="cotton100">100% COTTON</option>
                        <option value="stretch">STRETCH 95/5</option>
                    </select>
                </div>

                <button class="btn-cfg" id="btn-cycle-club">① CYCLE 5 CLUB PRINTS</button>
                <button class="btn-cfg" id="btn-upload-own">② UPLOAD OWN</button>
                <button class="btn-cfg" id="btn-open-prompt">③ GENERATE PROMPT</button>
                <button class="btn-cfg" id="btn-exchange" disabled>④ SPEND → +5 CLUB</button>
                <button class="btn-cfg confirm" id="btn-confirm">⑤ CONFIRM ORDER</button>

                <div class="prompt-builder" id="prompt-builder">
                    <span style="font-size:8px; font-weight:700; opacity:0.7;">PROMPT BUILDER (no API — copy to any AI image tool)</span>
                    <select id="pb-mood">
                        <option value="rebellion">Rebellion / Bold</option>
                        <option value="motivation">Motivation</option>
                        <option value="intellect">Intellect</option>
                        <option value="aesthetic">Aesthetic</option>
                        <option value="nostalgia">Nostalgia</option>
                    </select>
                    <input type="text" id="pb-idea" placeholder="Describe your idea...">
                    <button class="btn-cfg" id="btn-build-prompt" style="width:100%; text-align:center;">BUILD PROMPT</button>
                    <div class="prompt-output" id="prompt-output" style="display:none;"></div>
                </div>

                <input type="file" id="file-input" accept="image/*" style="display:none;">
            </div>

            <div class="frame-col">
                <div class="preview-frame" id="preview-frame">
                    <span class="size-badge" id="size-badge">M</span>
                </div>
                <div class="position-row">
                    <select id="select-position">
                        <option value="front">FRONT</option>
                        <option value="back">BACK</option>
                    </select>
                    <select id="select-scale">
                        <option value="a3">A3 (30x40cm)</option>
                        <option value="a4">A4 (21x30cm)</option>
                        <option value="logo-chest">LOGO CHEST (10x10cm)</option>
                        <option value="logo-sleeve">LOGO SLEEVE (7x7cm)</option>
                    </select>
                </div>
                <div class="order-info" id="order-info" style="width:100%; max-width:460px;"></div>
                <div class="price-line" id="order-price">—</div>
                <div class="status-line" id="order-status"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-base">
    <div class="modal-card wide">
        <span class="modal-close" data-close>&times;</span>
        <div class="modal-title" id="base-modal-title">MY BASE</div>
        <div class="base-tabs">
            <button class="btn-cfg base-tab active" data-tab="user">MY BASE</button>
            <button class="btn-cfg base-tab" data-tab="club">ATELIER BASE</button>
        </div>
        <div class="base-gallery" id="base-gallery"></div>
        <div class="status-line" id="base-status"></div>
    </div>
</div>

<div class="modal-overlay" id="modal-placeholder">
    <div class="modal-card">
        <span class="modal-close" data-close>&times;</span>
        <div class="modal-title" id="placeholder-title">COMING SOON</div>
        <p style="font-size:12px;">This catalog is not ready yet.</p>
        <button class="btn-cfg" data-close style="display:inline-block; text-align:center;">OK</button>
    </div>
</div>

<script type="module">
    import { init as initLocalization } from './core/localization.js';
    import { init as initPassport } from './modules/passport.js';
    import { get, set } from './core/storage.js';

    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));

    const BASE_PRICE = { tshirt: 15, hoodie: 35, sweatshirt: 28 };
    const SCALE_PRICE = { a3: 12, a4: 8, 'logo-chest': 4, 'logo-sleeve': 3 };
    const TELEGRAM_HELP_URL = 'https://t.me/PLACEHOLDER_USERNAME'; // TODO: заменить на реальный юзернейм
    const MAX_BASE_ITEMS = 8; // ограничение размера базы (localStorage не резиновый)

    const SIZE_SCALE_FACTOR = { S: 0.82, M: 1, L: 1.1, XL: 1.2, XXL: 1.3 };

    const CLUB_PRINTS = [
        { emoji: '🔥', category: 'rebellion' }, { emoji: '⚡', category: 'rebellion' },
        { emoji: '🏆', category: 'motivation' }, { emoji: '🚀', category: 'motivation' },
        { emoji: '🧠', category: 'intellect' }, { emoji: '♟️', category: 'intellect' },
        { emoji: '🌹', category: 'aesthetic' }, { emoji: '🦋', category: 'aesthetic' },
        { emoji: '📻', category: 'nostalgia' }, { emoji: '🎞️', category: 'nostalgia' },
        { emoji: '💀', category: 'rebellion' }, { emoji: '🎯', category: 'motivation' },
        { emoji: '🗿', category: 'intellect' }, { emoji: '🎭', category: 'aesthetic' },
        { emoji: '📼', category: 'nostalgia' }
    ];

    // ===== СИЛУЭТЫ =====
    // Каждый силуэт — набор <path>/<rect>/<circle> в общем viewBox 0 0 110 145.
    // {{FILL}} / {{STROKE}} — цвет корпуса одежды (зависит от select-color).
    // {{ACCENT}} — цвет деталей (капюшон, карман, ребро), полупрозрачный,
    // рассчитывается отдельно, чтобы был виден и на чёрном, и на белом.
    // Торс + вырез (crew-neck, круглый) — общий для всех трёх видов.
    const SILHOUETTES = {
        tshirt: `
            <path d="M32,24 L46,12 Q54,24 62,12 L76,24 L76,138 L32,138 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <path d="M32,24 L14,34 L24,50 L32,44 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <path d="M76,24 L94,34 L84,50 L76,44 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
        `,
        hoodie: `
            <path d="M32,24 L46,12 Q54,24 62,12 L76,24 L76,138 L32,138 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <path d="M32,24 L10,40 L18,112 L30,108 L32,50 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <path d="M76,24 L98,40 L90,112 L78,108 L76,50 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <path d="M40,14 Q54,-8 68,14 Q61,23 54,19 Q47,23 40,14 Z" fill="{{ACCENT}}" stroke="{{STROKE}}" stroke-width="1"/>
            <circle cx="51" cy="27" r="1.6" fill="{{STROKE}}"/>
            <circle cx="57" cy="27" r="1.6" fill="{{STROKE}}"/>
            <path d="M40,92 L68,92 L64,112 L44,112 Z" fill="{{ACCENT}}" stroke="{{STROKE}}" stroke-width="1"/>
            <path d="M46,92 Q54,98 62,92" fill="none" stroke="{{STROKE}}" stroke-width="1"/>
        `,
        sweatshirt: `
            <path d="M32,24 L46,12 Q54,24 62,12 L76,24 L76,138 L32,138 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <path d="M32,24 L10,40 L18,112 L30,108 L32,50 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <path d="M76,24 L98,40 L90,112 L78,108 L76,50 Z" fill="{{FILL}}" stroke="{{STROKE}}" stroke-width="1.5"/>
            <rect x="43" y="10" width="26" height="4" rx="2" fill="{{ACCENT}}"/>
            <rect x="32" y="132" width="44" height="6" fill="{{ACCENT}}"/>
            <rect x="12" y="106" width="12" height="6" fill="{{ACCENT}}" transform="rotate(-10 18 109)"/>
            <rect x="84" y="106" width="12" height="6" fill="{{ACCENT}}" transform="rotate(10 90 109)"/>
        `
    };

    function renderSilhouette(type, color) {
        const frame = document.getElementById('preview-frame');
        let svgEl = frame.querySelector('svg.garment-svg');
        if (!svgEl) {
            frame.insertAdjacentHTML('afterbegin', `<svg class="garment-svg" viewBox="0 0 110 145" xmlns="http://www.w3.org/2000/svg"></svg>`);
            svgEl = frame.querySelector('svg.garment-svg');
        }
        const fillColor = color === 'white' ? '#f2f2f2' : '#161616';
        const strokeColor = color === 'white' ? '#8a8a8a' : '#000';
        const accentColor = color === 'white' ? 'rgba(0,0,0,0.16)' : 'rgba(255,255,255,0.14)';
        svgEl.innerHTML = SILHOUETTES[type]
            .replaceAll('{{FILL}}', fillColor)
            .replaceAll('{{STROKE}}', strokeColor)
            .replaceAll('{{ACCENT}}', accentColor);
    }

    // ===== БАЗА ЮЗЕРА / БАЗА АТЕЛЬЕ =====
    // currentUser заполняется через паспорт (см. блок интеграции ниже).
    // Пока паспорт не откликнулся — база работает как GUEST.
    let currentUser = { id: 'guest', name: 'Guest' };

    function userBaseKey() { return `atelierUserBase:${currentUser.id}`; }
    function getUserBase() { return get(userBaseKey(), []); }
    function setUserBase(arr) {
        try { set(userBaseKey(), arr.slice(-MAX_BASE_ITEMS)); }
        catch (e) { console.warn('[Atelier] Не удалось сохранить личную базу (квота localStorage?).', e); }
    }
    function getClubBase() { return get('atelierClubBase', []); }
    function setClubBase(arr) {
        try { set('atelierClubBase', arr.slice(-MAX_BASE_ITEMS)); }
        catch (e) { console.warn('[Atelier] Не удалось сохранить базу ателье (квота localStorage?).', e); }
    }

    function updateBaseLabel() {
        document.getElementById('base-owner-label').textContent = `BASE: ${currentUser.name.toUpperCase()}`;
    }

    function resizeImageDataUrl(dataUrl, maxDim = 500, quality = 0.85) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    const ratio = Math.min(maxDim / width, maxDim / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });
    }

    let activeBaseTab = 'user';
    function renderBaseGallery() {
        const gallery = document.getElementById('base-gallery');
        gallery.innerHTML = '';
        document.getElementById('base-status').textContent = '';
        const items = activeBaseTab === 'user' ? getUserBase() : getClubBase();
        document.getElementById('base-modal-title').textContent =
            activeBaseTab === 'user' ? `MY BASE — ${currentUser.name.toUpperCase()}` : 'ATELIER BASE (SHARED)';

        if (!items.length) {
            gallery.innerHTML = `<div style="font-size:10px; opacity:0.6; text-align:center; grid-column:1/-1;">Empty — upload a design to fill this base.</div>`;
            return;
        }
        items.slice().reverse().forEach(item => {
            const cell = document.createElement('div');
            cell.className = 'base-cell';
            cell.innerHTML = `
                <img src="${item.dataUrl}" class="base-thumb">
                <div class="base-cell-actions">
                    <button class="btn-cfg base-use">USE</button>
                    ${activeBaseTab === 'user' ? '<button class="btn-cfg base-send">→ATELIER</button><button class="btn-cfg base-del">×</button>' : ''}
                </div>`;
            cell.querySelector('.base-use').addEventListener('click', () => {
                state.currentPrint = { source: 'own', design: item.dataUrl, category: null };
                renderPreview();
                closeModal(document.getElementById('modal-base'));
            });
            if (activeBaseTab === 'user') {
                cell.querySelector('.base-send').addEventListener('click', () => {
                    const club = getClubBase();
                    club.push({ id: 'cb_' + Date.now(), dataUrl: item.dataUrl, addedAt: Date.now(), fromUser: currentUser.name });
                    setClubBase(club);
                    document.getElementById('base-status').textContent = 'Sent to Atelier Base!';
                });
                cell.querySelector('.base-del').addEventListener('click', () => {
                    setUserBase(getUserBase().filter(i => i.id !== item.id));
                    renderBaseGallery();
                });
            }
            gallery.appendChild(cell);
        });
    }
    document.querySelectorAll('.base-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.base-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeBaseTab = btn.dataset.tab;
            renderBaseGallery();
        });
    });
    document.getElementById('btn-my-base').addEventListener('click', () => {
        activeBaseTab = 'user';
        document.querySelectorAll('.base-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'user'));
        renderBaseGallery();
        openModal('modal-base');
    });

    // ---- Интеграция с паспортом (ДИНАМИЧЕСКИЙ import, безопасно к ошибкам) ----
    // ⚠️ ПРОВЕРИТЬ: реальное имя события в вашем eventBus.js/passport.js и
    // форму данных. Сейчас ожидается on('PASSPORT_READY'|'PASSPORT_UPDATED', data)
    // с data.id/data.passportId и data.name/data.nickname. Если названия другие —
    // поправьте строки внутри try{} ниже. Пока не подтверждено — база работает
    // как GUEST и ничего не ломается.
    function handlePassportData(data) {
        currentUser = {
            id: (data && (data.id || data.passportId)) || 'guest',
            name: (data && (data.name || data.nickname)) || 'Guest'
        };
        updateBaseLabel();
    }
    (async () => {
        try {
            const eventBusModule = await import('./core/eventBus.js');
            const onFn = eventBusModule.on || eventBusModule.subscribe || (eventBusModule.default && eventBusModule.default.on);
            if (typeof onFn === 'function') {
                onFn('PASSPORT_READY', handlePassportData);
                onFn('PASSPORT_UPDATED', handlePassportData);
            } else {
                console.warn('[Atelier] eventBus.js загружен, но on()/subscribe() не найден — база останется GUEST, пока интеграция не будет уточнена.');
            }
        } catch (e) {
            console.warn('[Atelier] Не удалось подключиться к core/eventBus.js для синхронизации с паспортом — база останется GUEST.', e);
        }
    })();

    // ===== СОСТОЯНИЕ ЗАКАЗА =====
    let state = {
        type: 'tshirt', size: 'M', color: 'black',
        position: 'front', scale: 'a3',
        fabricDensity: '160-180', fabricComposition: 'cotton100',
        currentPrint: null, clubCycleIndex: -1
    };

    function getUnlocked() { return get('atelierUnlockedPrints', 5); }
    function unlockedPrints() { return CLUB_PRINTS.slice(0, getUnlocked()); }

    function renderPreview() {
        renderSilhouette(state.type, state.color);
        document.getElementById('size-badge').textContent = state.size;
        document.querySelectorAll('.print-overlay-img, .print-overlay-emoji').forEach(el => el.remove());

        if (state.currentPrint) {
            const baseSizePx = { a3: 130, a4: 88, 'logo-chest': 40, 'logo-sleeve': 26 }[state.scale];
            const sizePx = Math.round(baseSizePx * SIZE_SCALE_FACTOR[state.size]);
            if (state.currentPrint.source === 'own') {
                const img = document.createElement('img');
                img.className = 'print-overlay-img';
                img.src = state.currentPrint.design;
                img.style.width = sizePx + 'px';
                img.style.height = sizePx + 'px';
                img.style.objectFit = 'cover';
                document.getElementById('preview-frame').appendChild(img);
            } else {
                const span = document.createElement('span');
                span.className = 'print-overlay-emoji';
                span.textContent = state.currentPrint.design;
                span.style.fontSize = sizePx + 'px';
                document.getElementById('preview-frame').appendChild(span);
            }
        }
        document.getElementById('btn-exchange').disabled = !(state.currentPrint && state.currentPrint.source === 'own');
        updateOrderInfo();
    }

    function scaleCm(id) {
        return { a3: '30x40cm', a4: '21x30cm', 'logo-chest': '10x10cm', 'logo-sleeve': '7x7cm' }[id];
    }
    function calculatePrice() {
        let p = BASE_PRICE[state.type] || 0;
        if (state.currentPrint) p += SCALE_PRICE[state.scale] || 0;
        return p;
    }
    function updateOrderInfo() {
        const fabricLabel = state.fabricComposition === 'cotton100' ? '100% cotton' : 'stretch 95/5';
        document.getElementById('order-info').innerHTML =
            `${state.type.toUpperCase()} (unisex) / ${state.size} / ${state.color.toUpperCase()}<br>` +
            `Fabric: ${state.fabricDensity} g/m², ${fabricLabel}<br>` +
            `Print: ${state.currentPrint ? (state.currentPrint.source === 'own' ? '[image]' : state.currentPrint.design) : '— none —'} | ${state.position.toUpperCase()} | ${scaleCm(state.scale)}`;
        document.getElementById('order-price').textContent = `$${calculatePrice()}`;
    }

    ['select-type','select-size','select-color','select-position','select-scale','select-fabric-density','select-fabric-composition'].forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
            const map = {
                'select-type':'type','select-size':'size','select-color':'color',
                'select-position':'position','select-scale':'scale',
                'select-fabric-density':'fabricDensity','select-fabric-composition':'fabricComposition'
            };
            state[map[id]] = e.target.value;
            renderPreview();
        });
    });

    document.getElementById('btn-cycle-club').addEventListener('click', () => {
        const pool = unlockedPrints();
        state.clubCycleIndex = (state.clubCycleIndex + 1) % pool.length;
        const p = pool[state.clubCycleIndex];
        state.currentPrint = { source: 'club', design: p.emoji, category: p.category };
        renderPreview();
    });

    document.getElementById('btn-upload-own').addEventListener('click', () => {
        document.getElementById('file-input').click();
    });
    document.getElementById('file-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            const resized = await resizeImageDataUrl(ev.target.result, 500, 0.85);
            state.currentPrint = { source: 'own', design: resized, category: null };
            renderPreview();
            const base = getUserBase();
            base.push({ id: 'ub_' + Date.now(), dataUrl: resized, addedAt: Date.now() });
            setUserBase(base);
        };
        reader.readAsDataURL(file);
    });

    document.getElementById('btn-open-prompt').addEventListener('click', () => {
        document.getElementById('prompt-builder').classList.toggle('open');
    });
    document.getElementById('btn-build-prompt').addEventListener('click', () => {
        const moodMap = {
            rebellion: 'bold rebellious streetwear graphic, high contrast, graffiti-inspired',
            motivation: 'motivational typography-driven design, dynamic composition, energetic colors',
            intellect: 'intellectual minimalist symbolic illustration, clean lines, thoughtful composition',
            aesthetic: 'elegant aesthetic illustration, refined color palette, artistic linework',
            nostalgia: 'nostalgic vintage-style illustration, retro color grading, aged texture'
        };
        const mood = document.getElementById('pb-mood').value;
        const idea = document.getElementById('pb-idea').value.trim() || 'an abstract emblem';
        const prompt = `A t-shirt print design of ${idea}, ${moodMap[mood]}, professional print-ready vector-style artwork, centered composition, transparent background, high detail, print-safe color palette.`;
        const out = document.getElementById('prompt-output');
        out.textContent = prompt;
        out.style.display = 'block';
    });

    document.getElementById('btn-exchange').addEventListener('click', () => {
        if (!state.currentPrint || state.currentPrint.source !== 'own' || !state.currentPrint.design) {
            document.getElementById('order-status').textContent = 'Nothing to exchange — upload or generate an image first.';
            return;
        }
        set('atelierUnlockedPrints', Math.min(getUnlocked() + 5, CLUB_PRINTS.length));
        state.currentPrint = null;
        state.clubCycleIndex = -1;
        document.getElementById('order-status').textContent = 'Unlocked next 5 club prints!';
        renderPreview();
    });

    document.getElementById('btn-confirm').addEventListener('click', () => {
        const order = {
            type: 'blank',
            garment: state.type, size: state.size, color: state.color,
            fabricDensity: state.fabricDensity, fabricComposition: state.fabricComposition,
            decoration: state.currentPrint ? {
                source: state.currentPrint.source,
                design: state.currentPrint.source === 'club' ? state.currentPrint.design : '[uploaded image]',
                category: state.currentPrint.category,
                position: state.position, scalePreset: state.scale, scaleCm: scaleCm(state.scale)
            } : null,
            price: calculatePrice(), createdAt: Date.now()
        };
        const reports = get('officeAtelierReports', []);
        reports.push(order);
        set('officeAtelierReports', reports.slice(-50));
        document.getElementById('order-status').textContent = 'Order sent to Office!';
    });

    function openModal(id) {
        const m = document.getElementById(id);
        m.style.display = 'flex';
        requestAnimationFrame(() => m.style.opacity = '1');
    }
    function closeModal(m) {
        m.style.opacity = '0';
        setTimeout(() => m.style.display = 'none', 300);
    }
    document.querySelectorAll('[data-close]').forEach(el => {
        el.addEventListener('click', () => closeModal(el.closest('.config-overlay, .modal-overlay')));
    });

    document.getElementById('zone-rack').addEventListener('click', () => {
        updateBaseLabel();
        renderPreview();
        openModal('config-overlay');
    });
    document.getElementById('zone-embroidery').addEventListener('click', () => {
        document.getElementById('placeholder-title').textContent = 'EMBROIDERY CATALOG';
        openModal('modal-placeholder');
    });
    document.getElementById('zone-combined').addEventListener('click', () => {
        document.getElementById('placeholder-title').textContent = 'COMBINED CATALOG';
        openModal('modal-placeholder');
    });
    document.getElementById('zone-phone').addEventListener('click', () => {
        window.open(TELEGRAM_HELP_URL, '_blank');
    });
    document.getElementById('zone-consultant').addEventListener('click', () => {
        console.log('[Atelier] Консультант: заготовка под бота.');
    });
    document.getElementById('zone-monitor').addEventListener('click', () => {
        console.log('[Atelier] LAUNCH SYSTEM: декоративная деталь.');
    });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-hall').addEventListener('click', () => window.location.href = 'hall.html');
</script>

</body>
