<!DOCTYPE html>
<!--
  atelier.html
  v4.4.0 — 2026-09-16
  Изменения относительно v4.3.0 — визуальный принцип "морской офицер":
  чёрный китель, золотые галуны, белая рубашка выглядывает узкой
  полосой (воротник/манжет), а не самостоятельным пятном.
  (1) Новая переменная --ivory (#F0EAD6, тёплый слоновой кости) вместо
      стерильного #fff везде, где белый остаётся по смыслу.
  (2) preview-frame: убрана сплошная белая заливка. Теперь это чёрная
      "витрина" (тонкий радиальный градиент для объёма) в золотой
      рамке с тонким ivory-кантом между рамкой и чёрным полем —
      имитация золотого галуна поверх белого канта кителя.
  (3) order-info: было сплошное белое окно — стало тёмной табличкой
      с тонкой золотой обводкой и текстом цвета ivory (как латунная
      именная табличка/шеврон, а не белая карточка).
  (4) Дропдауны и prompt-output/category-picker: чёрная окантовка
      заменена на золотую (тоньше), заливка — ivory вместо чистого
      белого. Текст внутри остаётся тёмным для читаемости мелкого
      шрифта — это единственное место, где светлый фон нужен
      функционально, не только эстетически.
  (5) status-line оставлен функционально-зелёным (это семантический
      индикатор успеха/ошибки, а не декоративный элемент — трогать
      цепочку цветовой семантики не стал).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Atelier v4.4.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<style>
    :root {
        --gold: #FFD700;
        --gold-dim: #a8862c;
        --ivory: #F0EAD6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%; background: #000; color: var(--gold);
        overflow-y: auto; font-family: 'Share Tech Mono', monospace;
    }
    #atelier-bg {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: url('Atelier94.png') center/cover no-repeat;
        opacity: 0.35;
    }
    .header-right { position: fixed; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: fixed; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; transition: opacity 0.2s, transform 0.2s; pointer-events: auto; }
    .back-arrow:hover { opacity: 0.8; transform: scale(1.1); }

    .page-wrap {
        position: relative; z-index: 1;
        min-height: 100%; display: flex; flex-direction: column; align-items: center;
        padding: 70px 16px 30px;
    }

    .atelier-title-badge {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        margin-bottom: 16px;
    }
    .atelier-title-badge img { width: 44px; height: 44px; object-fit: contain; }
    .atelier-title-badge .title-text {
        font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; text-align: center;
        text-shadow: 0 0 10px rgba(255,215,0,0.4);
    }

    .field-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .field-row select { flex: 1; padding: 5px; border: 1px solid var(--gold-dim); border-radius: 2px; background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 9px; }

    .config-body { display: flex; gap: 20px; align-items: flex-start; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 960px; }
    .buttons-col { flex: 0 0 220px; display: flex; flex-direction: column; gap: 6px; }
    .frame-col { flex: 0 0 380px; display: flex; flex-direction: column; align-items: center; }

    @media (max-width: 900px) {
        .config-body { flex-direction: column; align-items: center; }
        .buttons-col, .frame-col { flex: 1 1 auto; width: 100%; max-width: 400px; }
    }

    .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 700; padding: 4px 2px; color: var(--gold); }
    .checkbox-row input { width: 14px; height: 14px; }

    /* Витрина: золотой галун, тонкий ivory-кант, чёрное поле с объёмом */
    .preview-frame-outer {
        width: 100%; max-width: 380px; padding: 4px;
        background: var(--ivory); border: 2px solid var(--gold);
        border-radius: 6px;
    }
    .preview-frame {
        width: 100%; height: 372px;
        background: radial-gradient(ellipse at center, #202020 0%, #0a0a0a 100%);
        position: relative; display: flex; align-items: center; justify-content: center;
        overflow: hidden; border-radius: 3px;
    }
    .garment-photo { width: 100%; height: 100%; object-fit: contain; user-select: none; pointer-events: none; }
    .size-badge {
        position: absolute; top: 6px; right: 6px; background: var(--gold);
        color: #000; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; z-index: 5;
    }
    .print-overlay-img {
        position: absolute; pointer-events: none; object-fit: cover;
    }

    .btn-cfg {
        background: #000; color: var(--gold); border: 2px solid var(--gold);
        padding: 6px 8px; cursor: pointer; font-weight: 700; text-transform: uppercase;
        font-family: 'Share Tech Mono', monospace; font-size: 9px; text-align: left;
    }
    .btn-cfg:hover:not(:disabled) { filter: brightness(1.2); }
    .btn-cfg:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-cfg.confirm { background: #1a4; border-color: #1a4; color: #fff; text-align: center; }
    .btn-cfg.small { padding: 4px 6px; font-size: 8px; flex: 1; text-align: center; }
    .btn-cfg.wide { text-align: center; }

    .print-strip-row { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .print-strip { display: flex; gap: 4px; flex: 1; }
    .print-icon {
        flex: 1; aspect-ratio: 1; border: 1.5px solid var(--gold-dim); background: var(--ivory);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        overflow: hidden; position: relative; border-radius: 2px;
    }
    .print-icon img { width: 100%; height: 100%; object-fit: cover; }
    .print-icon.empty { background: repeating-linear-gradient(45deg, #2a2a2a, #2a2a2a 4px, #1a1a1a 4px, #1a1a1a 8px); cursor: default; border-color: #333; }
    .print-arrow { background: #000; color: var(--gold); border: 1px solid var(--gold); width: 22px; height: 22px; cursor: pointer; font-weight: 900; font-size: 12px; flex-shrink: 0; }
    .print-arrow:disabled { opacity: 0.25; cursor: not-allowed; }

    .share-row { display: none; gap: 6px; margin-top: 4px; }
    .share-row.visible { display: flex; }
    .category-picker { display: none; gap: 4px; margin-top: 4px; }
    .category-picker.open { display: flex; }
    .category-picker select { flex: 1; padding: 4px; font-size: 8px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; }

    .position-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .position-row select { flex: 1; padding: 4px; font-size: 10px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; }

    .order-info {
        font-size: 10px; margin-top: 4px; padding: 8px;
        background: #0a0a0a; color: var(--ivory);
        border: 1px solid var(--gold); border-radius: 3px;
    }
    .price-line { font-family: 'Cinzel', serif; font-weight: 700; font-size: 16px; text-align: center; margin-top: 6px; }
    .status-line { font-size: 10px; color: #6fd48a; text-align: center; margin-top: 4px; min-height: 14px; }

    .prompt-builder { display: none; margin-top: 6px; padding: 8px; background: #0a0a0a; border: 1px dashed var(--gold-dim); border-radius: 4px; }
    .prompt-builder.open { display: block; }
    .prompt-builder select, .prompt-builder input { width: 100%; padding: 4px; margin-bottom: 5px; font-size: 9px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; }
    .prompt-output { font-size: 9px; background: #1a1a1a; color: var(--ivory); border: 1px solid var(--gold-dim); padding: 6px; margin-top: 5px; word-break: break-word; user-select: all; }

    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
        display: none; align-items: center; justify-content: center; opacity: 0;
        transition: opacity 0.3s ease; pointer-events: auto;
    }
    .modal-card {
        background: var(--ivory); border: 3px solid var(--gold); border-radius: 16px;
        padding: 24px; width: 300px; color: #1a1408; text-align: center; position: relative;
        font-family: 'Share Tech Mono', monospace;
    }
    .modal-close { position: absolute; top: 8px; right: 12px; font-size: 26px; cursor: pointer; }
    .modal-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 15px; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="atelier-bg"></div>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-hall">&lt;&lt;</a>
</div>
<div id="passport-badge-container"></div>

<div class="page-wrap">

    <div class="atelier-title-badge">
        <img src="horse_welcome.png" alt="">
        <span class="title-text">Ателье «Конь в пальто»</span>
    </div>

    <div class="config-body">
        <div class="buttons-col">
            <button class="btn-cfg wide" id="link-help">ПОГОВОРИТЬ С ДРУЗЬЯМИ (TELEGRAM)</button>

            <div class="field-row">
                <select id="select-type">
                    <option value="tshirt">T-SHIRT (UNISEX)</option>
                    <option value="hoodie">HOODIE (UNISEX)</option>
                    <option value="longsleeve">LONGSLEEVE (UNISEX)</option>
                </select>
            </div>
            <div class="field-row">
                <select id="select-size">
                    <option value="S">S</option><option value="M" selected>M</option>
                    <option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
                </select>
                <select id="select-color">
                    <option value="black">BLACK</option><option value="white">WHITE</option>
                </select>
            </div>
            <div class="field-row">
                <select id="select-fabric-density"></select>
                <select id="select-fabric-composition"></select>
            </div>
            <div class="checkbox-row" id="row-drawstring" style="display:none;">
                <input type="checkbox" id="check-drawstring">
                <label for="check-drawstring">Шнурки на капюшоне (визуал без изменений)</label>
            </div>

            <div class="field-row">
                <select id="select-technique">
                    <option value="dtf">DTF-ПЕЧАТЬ</option>
                    <option value="embroidery">ВЫШИВКА</option>
                </select>
            </div>

            <div class="print-strip-row">
                <button class="print-arrow" id="print-prev">‹</button>
                <div class="print-strip" id="print-strip"></div>
                <button class="print-arrow" id="print-next">›</button>
            </div>

            <button class="btn-cfg" id="btn-upload-own" style="margin-top:6px;">ЗАГРУЗИТЬ ФАЙЛ PNG</button>

            <div class="share-row" id="share-row">
                <button class="btn-cfg small" id="btn-share">ПОДЕЛИТЬСЯ С КЛУБОМ</button>
                <button class="btn-cfg small" id="btn-delete-own">УДАЛИТЬ</button>
            </div>
            <div class="category-picker" id="category-picker">
                <select id="share-category">
                    <option value="rebellion">Rebellion</option>
                    <option value="motivation">Motivation</option>
                    <option value="intellect">Intellect</option>
                    <option value="aesthetic">Aesthetic</option>
                    <option value="nostalgia">Nostalgia</option>
                </select>
                <button class="btn-cfg small" id="btn-share-confirm">OK</button>
            </div>

            <button class="btn-cfg" id="btn-open-prompt" style="margin-top:6px;">GENERATE PROMPT</button>
            <div class="prompt-builder" id="prompt-builder">
                <span style="font-size:8px; font-weight:700; opacity:0.7;">PROMPT BUILDER (no API — copy to any AI image tool)</span>
                <select id="pb-mood">
                    <option value="rebellion">Rebellion / Bold</option>
                    <option value="motivation">Motivation</option>
                    <option value="intellect">Intellect</option>
                    <option value="aesthetic">Aesthetic</option>
                    <option value="nostalgia">Nostalgia</option>
                </select>
                <input type="text" id="pb-idea" placeholder="Describe your idea...">
                <button class="btn-cfg" id="btn-build-prompt" style="width:100%; text-align:center;">BUILD PROMPT</button>
                <div class="prompt-output" id="prompt-output" style="display:none;"></div>
            </div>
        </div>

        <div class="frame-col">
            <div class="preview-frame-outer">
                <div class="preview-frame" id="preview-frame">
                    <span class="size-badge" id="size-badge">M</span>
                    <img class="garment-photo" id="garment-photo" src="" alt="">
                </div>
            </div>
        </div>

        <div class="buttons-col">
            <div class="position-row">
                <select id="select-position">
                    <option value="front">FRONT</option>
                    <option value="back">BACK</option>
                </select>
                <select id="select-scale">
                    <option value="a3">A3 (30x40cm)</option>
                    <option value="a4">A4 (21x30cm)</option>
                    <option value="logo-chest">LOGO CHEST (10x10cm)</option>
                    <option value="logo-sleeve">LOGO SLEEVE (7x7cm)</option>
                </select>
            </div>
            <div class="order-info" id="order-info"></div>
            <div class="price-line" id="order-price">—</div>
            <div class="status-line" id="order-status"></div>
            <button class="btn-cfg confirm" id="btn-confirm" style="margin-top:8px;">CONFIRM ORDER</button>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*" style="display:none;">
</div>

<div class="modal-overlay" id="modal-placeholder">
    <div class="modal-card">
        <span class="modal-close" data-close>&times;</span>
        <div class="modal-title" id="placeholder-title">COMING SOON</div>
        <p style="font-size:12px;">This catalog is not ready yet.</p>
        <button class="btn-cfg" data-close style="display:inline-block; text-align:center;">OK</button>
    </div>
</div>

<script type="module">
    import { init as initLocalization } from './core/localization.js';
    import { init as initPassport } from './modules/passport.js';
    import { get, set } from './core/storage.js';
    import * as eventBus from './core/eventBus.js';
    import * as clubBase from './core/clubBase.js';

    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));

    const TELEGRAM_HELP_URL = 'https://t.me/PLACEHOLDER_USERNAME'; // TODO: заменить на реальный юзернейм

    const GARMENT_PHOTOS = {
        tshirt:     { white: { front: 'tshirt-white-front.png', back: 'tshirt-white-back.png' }, black: { front: 'tshirt-black-front.png', back: 'tshirt-black-back.png' } },
        hoodie:     { white: { front: 'hoodie-white-front.png', back: 'hoodie-white-back.png' }, black: { front: 'hoodie-black-front.png', back: 'hoodie-black-back.png' } },
        longsleeve: { white: { front: 'longsleeve-white-front.png', back: 'longsleeve-white-back.png' }, black: { front: 'longsleeve-black-front.png', back: 'longsleeve-black-back.png' } }
    };

    const BASE_PRICE = { tshirt: 15, hoodie: 35, longsleeve: 22 };
    const SCALE_PRICE = { a3: 12, a4: 8, 'logo-chest': 4, 'logo-sleeve': 3 };
    const TECH_PRICE_MOD = { dtf: 0, embroidery: 7 }; // ⚠️ TODO: черновая наценка за вышивку
    const SCALE_DIMENSIONS_CM = {
        'a3':          { w: 30, h: 40 },
        'a4':          { w: 21, h: 30 },
        'logo-chest':  { w: 10, h: 10 },
        'logo-sleeve': { w: 7,  h: 7  }
    };

    const GARMENT_CHEST_CM = {
        tshirt:     { S: 48, M: 51, L: 54, XL: 57, XXL: 60 },
        hoodie:     { S: 60, M: 60, L: 64, XL: 64, XXL: 68 },
        longsleeve: { S: 48, M: 50, L: 52, XL: 54, XXL: 56 }
    };
    const GARMENT_LENGTH_CM = {
        tshirt:     { S: 65, M: 67, L: 68, XL: 69, XXL: 72 },
        hoodie:     { S: 64, M: 64, L: 72, XL: 72, XXL: 76 },
        longsleeve: { S: 68, M: 70, L: 72, XL: 74, XXL: 76 }
    };

    const GARMENT_PHOTO_BBOX_W = { tshirt: 492, hoodie: 435, longsleeve: 440 };
    const OUTSTRETCH_FACTOR = 1.5; // ⚠️ TODO: черновая оценка, сверить вживую
    const PRINT_ANCHOR_Y = 0.42;   // ⚠️ TODO: черновая оценка, сверить вживую

    function pxPerCm(type, size) {
        const basePxPerCm = GARMENT_PHOTO_BBOX_W[type] / (GARMENT_CHEST_CM[type].M * OUTSTRETCH_FACTOR);
        return basePxPerCm * (GARMENT_CHEST_CM[type].M / GARMENT_CHEST_CM[type][size]);
    }

    const FABRIC_OPTIONS = {
        tshirt: {
            density:     [{ value: '160-180', label: '160–180 g/m² (standard weight)' }],
            composition: [
                { value: 'cotton100', label: '100% COTTON' },
                { value: 'stretch',   label: 'STRETCH (95% cotton / 5% elastane)' }
            ]
        },
        hoodie: {
            density:     [{ value: '280-320', label: '280–320 g/m² (heavyweight fleece)' }],
            composition: [
                { value: 'cotton80poly20',  label: '80% COTTON / 20% POLYESTER (brushed fleece)' },
                { value: 'cotton100fleece', label: '100% COTTON FLEECE' }
            ]
        },
        longsleeve: {
            density:     [{ value: '220-240', label: '220–240 g/m² (трёхнитка начёс)' }],
            composition: [
                { value: 'cotton100fleece', label: '100% COTTON (трёхнитка начёс)' }
            ]
        }
    };
    const FABRIC_PRICE_MOD = { cotton100: 0, stretch: 4, cotton80poly20: 0, cotton100fleece: 3 };

    const CATEGORIES = ['rebellion', 'motivation', 'intellect', 'aesthetic', 'nostalgia'];

    function populateFabricOptions(type) {
        const densitySel = document.getElementById('select-fabric-density');
        const compSel = document.getElementById('select-fabric-composition');
        const opts = FABRIC_OPTIONS[type];
        densitySel.innerHTML = opts.density.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
        compSel.innerHTML = opts.composition.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
        state.fabricDensity = opts.density[0].value;
        state.fabricComposition = opts.composition[0].value;
    }

    let state = {
        type: 'tshirt', size: 'M', color: 'black',
        position: 'front', scale: 'a3',
        fabricDensity: '160-180', fabricComposition: 'cotton100',
        drawstring: false, technique: 'dtf',
        currentPrint: null
    };
    let currentUser = { id: 'guest', name: 'Guest' };

    function renderGarmentPhoto() {
        const src = GARMENT_PHOTOS[state.type][state.color][state.position];
        document.getElementById('garment-photo').src = src;
        document.getElementById('size-badge').textContent = state.size;
    }

    function renderPrintOverlay() {
        const frame = document.getElementById('preview-frame');
        const existing = frame.querySelector('.print-overlay-img');
        if (existing) existing.remove();
        if (!state.currentPrint) { updateOrderInfo(); return; }

        const dims = SCALE_DIMENSIONS_CM[state.scale];
        const ratio = pxPerCm(state.type, state.size);
        const wPx = Math.round(dims.w * ratio);
        const hPx = Math.round(dims.h * ratio);

        const img = document.createElement('img');
        img.className = 'print-overlay-img';
        img.src = state.currentPrint.design;
        img.style.width = wPx + 'px';
        img.style.height = hPx + 'px';
        img.style.left = '50%';
        img.style.top = (PRINT_ANCHOR_Y * 100) + '%';
        img.style.transform = 'translate(-50%, -50%)';
        img.style.mixBlendMode = (state.color === 'white') ? 'multiply' : 'normal';
        frame.appendChild(img);
        updateOrderInfo();
    }

    function scaleCm(id) {
        const d = SCALE_DIMENSIONS_CM[id];
        return `${d.w}x${d.h}cm`;
    }
    function calculatePrice() {
        let p = BASE_PRICE[state.type] || 0;
        if (state.currentPrint) {
            p += SCALE_PRICE[state.scale] || 0;
            p += TECH_PRICE_MOD[state.technique] || 0;
        }
        p += FABRIC_PRICE_MOD[state.fabricComposition] || 0;
        return p;
    }
    function updateOrderInfo() {
        const compLabel = (FABRIC_OPTIONS[state.type].composition.find(o => o.value === state.fabricComposition) || {}).label || state.fabricComposition;
        const drawstringLine = (state.type === 'hoodie')
            ? `<br>Шнурки на капюшоне: ${state.drawstring ? 'ДА (визуал без изменений на превью)' : 'нет'}` : '';
        const techLabel = state.technique === 'embroidery' ? 'ВЫШИВКА' : 'DTF-ПЕЧАТЬ';
        document.getElementById('order-info').innerHTML =
            `${state.type.toUpperCase()} (unisex) / ${state.size} / ${state.color.toUpperCase()}<br>` +
            `Fabric: ${state.fabricDensity} g/m², ${compLabel}${drawstringLine}<br>` +
            `Print: ${state.currentPrint ? '[image] · ' + techLabel : '— none —'} | ${state.position.toUpperCase()} | ${scaleCm(state.scale)}`;
        document.getElementById('order-price').textContent = `$${calculatePrice()}`;
    }

    function updateShareRowVisibility() {
        const row = document.getElementById('share-row');
        const isOwnUnshared = state.currentPrint && state.currentPrint.source === 'own' && !state.currentPrint.shared;
        row.classList.toggle('visible', !!isOwnUnshared);
        if (!isOwnUnshared) document.getElementById('category-picker').classList.remove('open');
    }

    let depthPointer = 0;
    function renderPrintStrip() {
        const data = clubBase.getAll();
        const strip = document.getElementById('print-strip');
        strip.innerHTML = '';
        CATEGORIES.forEach(cat => {
            const item = data[cat] && data[cat][depthPointer];
            const cell = document.createElement('div');
            cell.className = 'print-icon' + (item ? '' : ' empty');
            if (item) {
                cell.innerHTML = `<img src="${item.image_url}">`;
                cell.addEventListener('click', () => {
                    state.currentPrint = { source: 'club', design: item.image_url, category: cat, shared: true };
                    renderPrintOverlay();
                    updateShareRowVisibility();
                });
            }
            strip.appendChild(cell);
        });
        const minLen = Math.min(...CATEGORIES.map(c => (data[c] || []).length));
        document.getElementById('print-next').disabled = (minLen === 0) || (depthPointer >= minLen - 1);
        document.getElementById('print-prev').disabled = (depthPointer <= 0);
    }
    document.getElementById('print-next').addEventListener('click', () => { depthPointer++; renderPrintStrip(); });
    document.getElementById('print-prev').addEventListener('click', () => { depthPointer = Math.max(0, depthPointer - 1); renderPrintStrip(); });

    function resizeImageToBlobAndUrl(file, maxDim = 500, quality = 0.85) {
        return new Promise((resolve) => {
            const img = new Image();
            const reader = new FileReader();
            reader.onload = (ev) => {
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        const r = Math.min(maxDim / width, maxDim / height);
                        width = Math.round(width * r); height = Math.round(height * r);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        resolve({ blob, url: URL.createObjectURL(blob) });
                    }, 'image/jpeg', quality);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    document.getElementById('btn-upload-own').addEventListener('click', () => {
        document.getElementById('file-input').click();
    });
    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const { blob, url } = await resizeImageToBlobAndUrl(file);
        state.currentPrint = { source: 'own', design: url, blob, shared: false };
        renderPrintOverlay();
        updateShareRowVisibility();
    });

    document.getElementById('btn-delete-own').addEventListener('click', () => {
        state.currentPrint = null;
        renderPrintOverlay();
        updateShareRowVisibility();
        document.getElementById('order-status').textContent = 'Своё изображение удалено (в базу не отправлялось).';
    });

    document.getElementById('btn-share').addEventListener('click', () => {
        document.getElementById('category-picker').classList.toggle('open');
    });
    document.getElementById('btn-share-confirm').addEventListener('click', async () => {
        if (!state.currentPrint || state.currentPrint.source !== 'own' || !state.currentPrint.blob) return;
        const category = document.getElementById('share-category').value;
        try {
            await clubBase.addPrint(state.currentPrint.blob, category, {
                userId: currentUser.id, userName: currentUser.name
            });
            state.currentPrint.shared = true;
            state.currentPrint.category = category;
            updateShareRowVisibility();
            document.getElementById('order-status').textContent = `Отправлено в базу клуба → ${category}`;
        } catch (err) {
            console.error('[Atelier] Ошибка при отправке в базу клуба', err);
            document.getElementById('order-status').textContent = 'Не удалось отправить в базу клуба — попробуйте ещё раз.';
        }
    });

    document.getElementById('btn-open-prompt').addEventListener('click', () => {
        document.getElementById('prompt-builder').classList.toggle('open');
    });
    document.getElementById('btn-build-prompt').addEventListener('click', () => {
        const moodMap = {
            rebellion: 'bold rebellious streetwear graphic, high contrast, graffiti-inspired',
            motivation: 'motivational typography-driven design, dynamic composition, energetic colors',
            intellect: 'intellectual minimalist symbolic illustration, clean lines, thoughtful composition',
            aesthetic: 'elegant aesthetic illustration, refined color palette, artistic linework',
            nostalgia: 'nostalgic vintage-style illustration, retro color grading, aged texture'
        };
        const mood = document.getElementById('pb-mood').value;
        const idea = document.getElementById('pb-idea').value.trim() || 'an abstract emblem';
        const prompt = `A t-shirt print design of ${idea}, ${moodMap[mood]}, professional print-ready vector-style artwork, centered composition, transparent background, high detail, print-safe color palette.`;
        const out = document.getElementById('prompt-output');
        out.textContent = prompt;
        out.style.display = 'block';
        document.getElementById('share-category').value = mood;
    });

    document.getElementById('select-type').addEventListener('change', (e) => {
        state.type = e.target.value;
        populateFabricOptions(state.type);
        document.getElementById('row-drawstring').style.display = (state.type === 'hoodie') ? 'flex' : 'none';
        renderGarmentPhoto();
        renderPrintOverlay();
    });
    document.getElementById('check-drawstring').addEventListener('change', (e) => {
        state.drawstring = e.target.checked;
        updateOrderInfo();
    });
    document.getElementById('select-technique').addEventListener('change', (e) => {
        state.technique = e.target.value;
        updateOrderInfo();
    });
    ['select-size','select-color','select-position','select-scale'].forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
            const map = { 'select-size':'size','select-color':'color','select-position':'position','select-scale':'scale' };
            state[map[id]] = e.target.value;
            renderGarmentPhoto();
            renderPrintOverlay();
        });
    });
    ['select-fabric-density','select-fabric-composition'].forEach(id => {
        document.getElementById(id).addEventListener('change', (e) => {
            const map = { 'select-fabric-density':'fabricDensity','select-fabric-composition':'fabricComposition' };
            state[map[id]] = e.target.value;
            updateOrderInfo();
        });
    });

    document.getElementById('btn-confirm').addEventListener('click', () => {
        const order = {
            type: 'blank',
            garment: state.type, size: state.size, color: state.color,
            fabricDensity: state.fabricDensity, fabricComposition: state.fabricComposition,
            drawstring: (state.type === 'hoodie') ? state.drawstring : null,
            decoration: state.currentPrint ? {
                source: state.currentPrint.source,
                shared: !!state.currentPrint.shared,
                category: state.currentPrint.category || null,
                technique: state.technique,
                position: state.position, scalePreset: state.scale, scaleCm: scaleCm(state.scale)
            } : null,
            price: calculatePrice(), createdAt: Date.now()
        };
        const reports = get('officeAtelierReports', []);
        reports.push(order);
        set('officeAtelierReports', reports.slice(-50));
        document.getElementById('order-status').textContent = 'Order sent to Office!';
    });

    function openModal(id) {
        const m = document.getElementById(id);
        m.style.display = 'flex';
        requestAnimationFrame(() => m.style.opacity = '1');
    }
    function closeModal(m) {
        m.style.opacity = '0';
        setTimeout(() => m.style.display = 'none', 300);
    }
    document.querySelectorAll('[data-close]').forEach(el => {
        el.addEventListener('click', () => closeModal(el.closest('.modal-overlay')));
    });

    document.getElementById('link-help').addEventListener('click', () => {
        window.open(TELEGRAM_HELP_URL, '_blank');
    });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-hall').addEventListener('click', () => window.location.href = 'hall.html');

    function handlePassportData(data) {
        currentUser = {
            id: (data && (data.id || data.passportId)) || 'guest',
            name: (data && (data.name || data.nickname)) || 'Guest'
        };
    }
    try {
        const onFn = eventBus.on || eventBus.subscribe || (eventBus.default && eventBus.default.on);
        if (typeof onFn === 'function') {
            onFn('PASSPORT_READY', handlePassportData);
            onFn('PASSPORT_UPDATED', handlePassportData);
        }
    } catch (e) {
        console.warn('[Atelier] Не удалось подключиться к eventBus для паспорта.', e);
    }

    clubBase.init(eventBus).then(() => renderPrintStrip());
    try {
        const onFn = eventBus.on || eventBus.subscribe || (eventBus.default && eventBus.default.on);
        if (typeof onFn === 'function') onFn('CLUBBASE_UPDATED', renderPrintStrip);
    } catch (e) { /* eventBus недоступен */ }

    populateFabricOptions(state.type);
    renderGarmentPhoto();
    renderPrintOverlay();
</script>

</body>
