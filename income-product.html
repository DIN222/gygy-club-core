<!DOCTYPE html>
<!--
  income-product.html — v4.0.0 — 2026-10-14
  Приход → Ателье → изделие (?garment=tshirt|hoodie|longsleeve).
  Фильтры вверху. «Параметры цены»: ткань на витрине (название, плотность) +
  построчная себестоимость → ИТОГО → наценка в % → наценка в € → ИТОГО розница.
  Заказы: данные заказа + картинки, бухгалтерия, цена, получатель,
  передача перевозчику, получение, оплата, примечание.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Приход: изделие</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .page-wrap { min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-size: 22px; margin-bottom: 14px; text-align: center; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .panel { width: 100%; max-width: 860px; }
    .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .filters select { padding: 7px; border: 1px solid var(--gold); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }

    details.sum { border: 1px solid var(--gold-dim); background: #0a0a0a; margin-bottom: 12px; }
    details.sum > summary { cursor: pointer; padding: 10px; font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
    .sum-body { padding: 0 10px 10px; }

    .p-sec { font-size: 10px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 6px; }
    .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .p-grid label { display: block; font-size: 9px; color: #9a9a8a; text-transform: uppercase; }
    .p-grid input, .p-grid select { width: 100%; margin-top: 2px; padding: 6px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .p-grid .chk { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ivory); text-transform: none; }
    .p-grid .chk input { width: auto; margin: 0; }
    .ptable { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 11px; }
    .ptable td { padding: 3px 4px; color: var(--ivory); border-bottom: 1px solid #141414; }
    .ptable td:last-child { width: 120px; text-align: right; }
    .ptable tr.grp td { color: var(--gold-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; padding-top: 10px; border-bottom: none; }
    .ptable tr.off td { opacity: 0.35; }
    .ptable tr.tot td { color: var(--gold); font-weight: 900; border-top: 1px solid var(--gold-dim); font-size: 12px; padding-top: 6px; }
    .ptable input { width: 100px; padding: 5px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; text-align: right; }

    details.order { border: 1px solid var(--gold-dim); background: #0a0a0a; margin-bottom: 8px; }
    details.order > summary { list-style: none; cursor: pointer; padding: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 11px; color: var(--ivory); }
    details.order > summary::-webkit-details-marker { display: none; }
    details.order[open] > summary { border-bottom: 1px solid var(--gold-dim); }
    .s-date, .s-num { color: var(--gold); font-weight: 700; }
    .s-amt { margin-left: auto; color: var(--gold); font-weight: 900; }
    .chip { border: 1px solid var(--gold-dim); padding: 2px 6px; font-size: 9px; text-transform: uppercase; }
    .chip.ok { border-color: #6fd48a; color: #6fd48a; }
    .chip.warn { border-color: #e0a030; color: #e0a030; }

    .sec { padding: 10px; border-bottom: 1px solid #1a1a1a; }
    .sec h4 { font-size: 10px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .kv { display: grid; grid-template-columns: 190px 1fr; gap: 3px 10px; font-size: 11px; color: var(--ivory); }
    .kv span:nth-child(odd) { color: #9a9a8a; }
    .kv .tot { color: var(--gold); font-weight: 900; }
    .tel { color: var(--gold); }
    .previews { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .previews a { display: block; width: 170px; text-decoration: none; color: var(--ivory); font-size: 9px; text-align: center; }
    .previews img { width: 100%; display: block; border: 1px solid var(--gold-dim); background: #222; margin-bottom: 3px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
    .fields label { display: block; font-size: 9px; color: #9a9a8a; margin-bottom: 2px; text-transform: uppercase; }
    .fields input, .fields textarea { width: 100%; padding: 6px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .fields .wide { grid-column: 1 / -1; }
    .mini-btn { background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 5px 9px; font-size: 10px; cursor: pointer; font-family: inherit; margin-top: 6px; margin-right: 6px; }
    .mini-btn:hover { border-color: var(--gold); }
    .save-bar { padding: 10px; display: flex; align-items: center; gap: 10px; }
    .btn-save { background: var(--gold); color: #000; border: 1px solid var(--gold); padding: 8px 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; font-family: inherit; font-size: 11px; }
    .save-status { font-size: 11px; color: var(--ivory); }
    .save-status.ok { color: #6fd48a; }
    .save-status.error { color: #e74c3c; }
    .approx { opacity: 0.65; font-style: italic; font-size: 10px; margin-top: 6px; }
    .empty-note { font-size: 11px; color: #666; text-align: center; padding: 20px; }
    @media (max-width: 600px) { .kv { grid-template-columns: 120px 1fr; } .fields, .p-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows"><a class="back-arrow" id="btn-back">&lt;</a><a class="back-arrow" id="btn-atelier">&lt;&lt;</a></div>

<div class="page-wrap">
    <div class="title" id="title">ФУТБОЛКА</div>
    <div class="panel">

        <div class="filters">
            <select id="period">
                <option value="all">За всё время</option>
                <option value="30">Последние 30 дней</option>
                <option value="7">Последние 7 дней</option>
            </select>
            <select id="status-filter">
                <option value="all">Все заказы</option>
                <option value="unshipped">Не переданы перевозчику</option>
                <option value="transit">У перевозчика (в пути)</option>
                <option value="received">Получены</option>
                <option value="unpaid">Не оплачены</option>
            </select>
        </div>

        <details class="sum" id="params-box">
            <summary>Параметры цены</summary>
            <div class="sum-body" id="params-body"></div>
        </details>

        <div id="list"></div>
        <div class="empty-note" id="empty-note" style="display:none;"></div>
    </div>
</div>

<script type="module">
    import { requireAuth } from './core/auth.js';
    import { supabase } from './core/supabase-init.js';
    import {
        PARAM_DEFS, COMPOSITION_LABELS, FABRICS_BY_GARMENT,
        loadPricing, loadStorefrontConfig, computeBreakdown, garmentParamDefs, effectiveValue
    } from './core/pricing.js';

    const session = await requireAuth();
    if (!session) throw new Error('redirecting to login');

    const GARMENTS = ['tshirt', 'hoodie', 'longsleeve'];
    const TITLES = { tshirt: 'ФУТБОЛКА', hoodie: 'ХУДИ', longsleeve: 'ЛОНГСЛИВ' };
    const COLOR_LABELS = { black: 'ЧЁРНЫЙ', white: 'БЕЛЫЙ' };
    const SCALE_OPTIONS = [['a3', 'A3'], ['a4', 'A4'], ['logo-chest', 'Лого на груди'], ['logo-sleeve', 'Лого на рукаве'], ['custom', 'Фактический размер']];

    const urlGarment = new URLSearchParams(location.search).get('garment');
    const garment = GARMENTS.includes(urlGarment) ? urlGarment : 'tshirt';
    document.getElementById('title').textContent = TITLES[garment];

    const currentParams = await loadPricing();
    const storefront = await loadStorefrontConfig(garment);

    const eur = (n) => `€${Number(n || 0).toFixed(2)}`;
    const qtyOf = (o) => Number(o.quantity) || 1;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeHttps = (u) => /^https:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim() : '';
    const kv = (pairs) => `<div class="kv">${pairs.map(([k, v, cls]) => `<span class="${cls || ''}">${k}</span><span class="${cls || ''}">${v}</span>`).join('')}</div>`;

    let allRows = [];
    const openIds = new Set();

    // ---------- Параметры цены ----------
    const sample = { composition: FABRICS_BY_GARMENT[garment][0], hasPrint: true, scale: 'a3', technique: 'dtf', drawstring: false, zipper: false };
    const paramsBody = document.getElementById('params-body');

    function rowApplies(key) {
        if (key.startsWith('fab.')) return key === 'fab.' + sample.composition;
        if (key.startsWith('scale.')) return sample.hasPrint && key === 'scale.' + sample.scale;
        if (key.startsWith('tech.')) return sample.hasPrint && key === 'tech.' + sample.technique;
        if (key === 'extra.drawstring') return sample.drawstring;
        if (key === 'extra.zipper') return sample.zipper;
        return true;
    }

    function readInputs() {
        const m = {};
        paramsBody.querySelectorAll('input[data-storekey]').forEach(i => { m[i.dataset.storekey] = parseFloat(i.value) || 0; });
        return m;
    }

    function updateTotals() {
        const b = computeBreakdown(readInputs(), {
            type: garment, composition: sample.composition, scale: sample.scale,
            technique: sample.technique, hasPrint: sample.hasPrint,
            drawstring: sample.drawstring, zipper: sample.zipper
        });
        paramsBody.querySelector('#t-cost').textContent = eur(b.cost);
        paramsBody.querySelector('#t-margin').textContent = eur(b.margin);
        paramsBody.querySelector('#t-retail').textContent = eur(b.retail);
        paramsBody.querySelectorAll('tr.prow').forEach(tr => tr.classList.toggle('off', !rowApplies(tr.dataset.key)));
    }

    function renderParams() {
        const defs = garmentParamDefs(garment).filter(d => d.key !== 'margin.percent');
        const groups = [...new Set(defs.map(d => d.group))];
        const comps = FABRICS_BY_GARMENT[garment];

        const rows = groups.map(group => {
            const items = defs.filter(d => d.group === group);
            return `<tr class="grp"><td colspan="2">${esc(group)}</td></tr>` + items.map(d => `
                <tr class="prow" data-key="${esc(d.key)}"><td>${esc(d.label)}</td>
                <td><input type="number" step="0.01" data-storekey="${esc(d.storeKey)}" value="${effectiveValue(currentParams, garment, d.key)}"></td></tr>`).join('');
        }).join('');

        paramsBody.innerHTML = `
            <div class="p-sec">Ткань на витрине</div>
            <div class="p-grid">
                ${comps.map(c => `<label>${esc(COMPOSITION_LABELS[c])}<input type="text" data-sf-label="${esc(c)}" value="${esc(storefront.labels[c] || '')}"></label>`).join('')}
                <label>Плотность, g/m²<input type="text" data-sf-density value="${esc(storefront.density)}"></label>
            </div>

            <div class="p-sec">Расчёт итога для</div>
            <div class="p-grid">
                <label>Ткань<select id="s-comp">${comps.map(c => `<option value="${esc(c)}">${esc(COMPOSITION_LABELS[c])}</option>`).join('')}</select></label>
                <label>Размер нанесения<select id="s-scale">${SCALE_OPTIONS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></label>
                <label>Техника<select id="s-tech"><option value="dtf">DTF-печать</option><option value="embroidery">Вышивка</option></select></label>
                <label class="chk"><input type="checkbox" id="s-print" checked> с принтом</label>
                ${garment === 'hoodie' ? `<label class="chk"><input type="checkbox" id="s-draw"> шнурки</label><label class="chk"><input type="checkbox" id="s-zip"> молния</label>` : ''}
            </div>

            <table class="ptable">
                ${rows}
                <tr class="tot"><td>ИТОГО себестоимость</td><td id="t-cost">€0.00</td></tr>
                <tr><td>Наценка, % от себестоимости</td>
                    <td><input type="number" step="0.1" data-storekey="${esc(garment + '|margin.percent')}" value="${effectiveValue(currentParams, garment, 'margin.percent')}"></td></tr>
                <tr><td>Наценка, €</td><td id="t-margin">€0.00</td></tr>
                <tr class="tot"><td>ИТОГО розничная цена</td><td id="t-retail">€0.00</td></tr>
            </table>

            <div class="save-bar" style="padding:10px 0 0;">
                <button class="btn-save" id="btn-save-params" type="button">Сохранить</button>
                <span class="save-status" id="params-status"></span>
            </div>`;

        paramsBody.querySelectorAll('input[data-storekey]').forEach(i => i.addEventListener('input', updateTotals));
        const bind = (id, fn) => { const el = paramsBody.querySelector(id); if (el) el.addEventListener('change', () => { fn(el); updateTotals(); }); };
        bind('#s-comp', el => { sample.composition = el.value; });
        bind('#s-scale', el => { sample.scale = el.value; });
        bind('#s-tech', el => { sample.technique = el.value; });
        bind('#s-print', el => { sample.hasPrint = el.checked; });
        bind('#s-draw', el => { sample.drawstring = el.checked; });
        bind('#s-zip', el => { sample.zipper = el.checked; });
        paramsBody.querySelector('#btn-save-params').addEventListener('click', saveParams);
        updateTotals();
    }

    async function saveParams() {
        const st = paramsBody.querySelector('#params-status');
        st.className = 'save-status';
        st.textContent = 'Сохраняю…';
        const now = new Date().toISOString();
        const rows = [];
        paramsBody.querySelectorAll('input[data-storekey]').forEach(inp => {
            const sk = inp.dataset.storekey;
            const key = sk.split('|')[1];
            const d = PARAM_DEFS.find(x => x[0] === key);
            rows.push({ key: sk, value: parseFloat(inp.value) || 0, label: `${d ? d[1] : key} [${garment}]`, param_group: d ? d[2] : '', updated_at: now });
        });
        const e1 = (await supabase.from('pricing_params').upsert(rows)).error;
        if (e1) { console.error(e1); st.textContent = 'Не удалось сохранить цены: ' + e1.message; st.classList.add('error'); return; }

        const labels = {};
        paramsBody.querySelectorAll('[data-sf-label]').forEach(i => { labels[i.dataset.sfLabel] = i.value.trim(); });
        const density = paramsBody.querySelector('[data-sf-density]').value.trim();
        const e2 = (await supabase.from('storefront_config').upsert({ key: 'fabric.' + garment, value: { density, labels }, updated_at: now })).error;
        if (e2) { console.error(e2); st.textContent = 'Цены сохранены, витрина — нет: ' + e2.message; st.classList.add('error'); return; }

        rows.forEach(r => { currentParams[r.key] = r.value; });
        st.textContent = 'Сохранено — клиенты в Ателье увидят изменения.';
        st.classList.add('ok');
        render();
    }

    // ---------- Заказы ----------
    function techLabel(o) {
        if (!o.decoration) return 'Без принта';
        return o.decoration.technique === 'embroidery' ? 'Вышивка' : 'DTF-принт';
    }
    function printDetail(o) {
        const d = o.decoration;
        if (!d) return '—';
        return [d.scaleCm, d.category === 'embroidery' ? 'вышивка' : (d.source === 'own' ? 'свой' : 'клуб')].filter(Boolean).join(' · ');
    }
    function getPricing(o) {
        if (o.pricing) return { b: o.pricing, approx: false };
        const b = computeBreakdown(currentParams, {
            type: o.garment, composition: o.fabricComposition,
            scale: o.decoration && o.decoration.scalePreset,
            technique: o.decoration && o.decoration.technique,
            hasPrint: !!o.decoration, drawstring: o.drawstring, zipper: o.zipper
        });
        return { b, approx: true };
    }
    function breakdownPairs(b) {
        let pairs;
        if (Array.isArray(b.lines)) {
            pairs = b.lines.map(l => [esc(l.label), eur(l.amount)]);
        } else { // заказ оформлен по прежней структуре затрат
            pairs = [['Изделие', eur(b.garment)], ['Ткань', eur(b.fabric)], ['Обтачка', eur(b.facing)],
                ['Киперная лента', eur(b.tape)], ['Нанесение', eur(b.decoration)], ['Дополнения', eur(b.extras)],
                ['Упаковка', eur(b.packaging)], ['Накладные', eur(b.overhead)]];
        }
        pairs.push(['ИТОГО себестоимость', eur(b.cost), 'tot'],
            ['Наценка', `${esc(b.marginPercent)}% = ${eur(b.margin)}`],
            ['ИТОГО розница за ед.', eur(b.retail), 'tot']);
        return pairs;
    }

    function statusOf(r) {
        const o = r.atelier_order || {};
        return { shipped: !!r.shipping_receipt_number, received: !!r.delivery_confirmed_date, paid: !!r.payment_date, cod: o.paymentMethod === 'cod' };
    }
    function matchesStatus(r, f) {
        const s = statusOf(r);
        if (f === 'unshipped') return !s.shipped;
        if (f === 'transit') return s.shipped && !s.received;
        if (f === 'received') return s.received;
        if (f === 'unpaid') return !s.paid;
        return true;
    }
    function chipsHtml(r) {
        const s = statusOf(r);
        const ship = s.received ? '<span class="chip ok">получено</span>'
            : s.shipped ? '<span class="chip warn">передано перевозчику</span>'
            : '<span class="chip warn">не передано</span>';
        const pay = s.paid ? '<span class="chip ok">оплачено</span>'
            : s.cod ? '<span class="chip warn">наложенный: ждёт</span>'
            : '<span class="chip warn">ждёт оплаты</span>';
        return ship + pay;
    }

    function cardHtml(r) {
        const o = r.atelier_order || {};
        const { b, approx } = getPricing(o);
        const q = qtyOf(o);
        const unit = o.unitPrice != null ? o.unitPrice : b.retail;
        const d = o.decoration;
        const last = o.recipientLastName || '';
        const first = o.recipientFirstName || '';
        const oldFullName = (!last && !first) ? (o.recipientName || '') : '';
        const post = o.recipientPostOffice || o.recipientAddress || '';
        const phone = o.recipientPhone || '';
        const messenger = o.recipientMessenger || '';
        const phoneDigits = String(phone).replace(/[^\d+]/g, '');
        const phoneHtml = phone ? (phoneDigits ? `<a class="tel" href="tel:${esc(phoneDigits)}">${esc(phone)}</a>` : esc(phone)) : '—';
        const method = o.paymentMethod === 'cod' ? 'Наложенный платёж (оплата при получении на почте)' : 'Предоплата';
        const openAttr = openIds.has(r.id) ? ' open' : '';

        const orderPairs = [
            ['Дата заказа', esc(new Date(r.order_date).toLocaleString())],
            ['Номер заказа', esc(r.order_number)],
            ['Изделие', TITLES[o.garment] || esc(o.garment)],
            ['Цвет', esc(COLOR_LABELS[o.color] || o.color || '—')],
            ['Размер', esc(o.size || '—')],
            ['Количество', q],
            ['Ткань', `${esc(o.fabricComposition || '—')} · ${esc(o.fabricDensity || '')} g/m²`],
            ['Техника', techLabel(o)],
            ['Принт', esc(printDetail(o))],
            ['Положение принта', d ? esc((d.position || '').toUpperCase()) : '—']
        ];
        if (o.garment === 'hoodie') orderPairs.push(['Шнурки', o.drawstring ? 'да' : 'нет'], ['Молния', o.zipper ? 'да' : 'нет']);

        const mockup = safeHttps(o.mockupUrl);
        const design = safeHttps(o.designUrl);
        const previewsHtml = (mockup || design)
            ? `<div class="previews">
                ${mockup ? `<a href="${esc(mockup)}" target="_blank" rel="noopener noreferrer"><img src="${esc(mockup)}" alt="Макет"><span>макет на изделии</span></a>` : ''}
                ${design ? `<a href="${esc(design)}" target="_blank" rel="noopener noreferrer"><img src="${esc(design)}" alt="Принт"><span>${d && d.technique === 'embroidery' ? 'вышивка (эскиз)' : 'принт'}</span></a>` : ''}
              </div>`
            : (d ? '<div class="approx">Картинка принта у этого заказа не сохранена (оформлен до появления этой функции)</div>' : '');

        return `
        <details class="order" data-id="${esc(r.id)}"${openAttr}>
            <summary>
                <span class="s-date">${esc(new Date(r.order_date).toLocaleDateString())}</span>
                <span class="s-num">${esc(r.order_number)}</span>
                <span>${esc(COLOR_LABELS[o.color] || o.color || '—')} · ${esc(o.size || '—')} × ${q}</span>
                ${chipsHtml(r)}
                <span class="s-amt">${eur(r.total_amount)}</span>
            </summary>

            <div class="sec"><h4>1. Данные заказа из Ателье</h4>${kv(orderPairs)}${previewsHtml}</div>

            <div class="sec"><h4>2. Данные бухгалтерии (определение цены)</h4>
                ${kv(breakdownPairs(b))}
                ${approx ? '<div class="approx">≈ старый заказ: затраты пересчитаны по текущим параметрам, а не по состоянию на дату заказа</div>' : ''}
            </div>

            <div class="sec"><h4>3. Цена, переданная заказчику в Ателье</h4>
                ${kv([['Цена за единицу', eur(unit)], ['Количество', q], ['Итого', eur(r.total_amount), 'tot']])}
            </div>

            <div class="sec"><h4>4. Получатель</h4>
                ${kv([
                    ['Фамилия', esc(last || oldFullName || '—')], ['Имя', esc(first || '—')],
                    ['Телефон', phoneHtml], ['Мессенджер', esc(messenger || '—')],
                    ['Почтовое отделение', esc(post || '—')]
                ])}
            </div>

            <div class="sec"><h4>5. Передача перевозчику</h4>
                ${kv([['Связь с клиентом: телефон', phoneHtml], ['Связь с клиентом: мессенджер', esc(messenger || '—')]])}
                <div class="fields">
                    <div><label>Дата квитанции</label><input type="date" data-f="shipping_receipt_date" value="${esc(r.shipping_receipt_date || '')}"></div>
                    <div><label>Номер квитанции</label><input type="text" data-f="shipping_receipt_number" value="${esc(r.shipping_receipt_number || '')}"></div>
                    <div class="wide"><label>Сообщение клиенту</label><textarea rows="4" data-f="shipping_message">${esc(r.shipping_message || '')}</textarea></div>
                </div>
                <button class="mini-btn btn-gen" type="button">Сформировать сообщение</button>
                <button class="mini-btn btn-copy" type="button">Скопировать</button>
            </div>

            <div class="sec"><h4>6. Получение</h4>
                <div class="fields">
                    <div><label>Дата подтверждения получения</label><input type="date" data-f="delivery_confirmed_date" value="${esc(r.delivery_confirmed_date || '')}"></div>
                </div>
            </div>

            <div class="sec"><h4>7. Оплата</h4>
                ${kv([['Способ', esc(method)]])}
                <div class="fields">
                    <div><label>Дата оплаты</label><input type="date" data-f="payment_date" value="${esc(r.payment_date || '')}"></div>
                    <div><label>Сумма оплаты, €</label><input type="number" step="0.01" data-f="payment_amount" value="${r.payment_amount != null ? esc(r.payment_amount) : ''}"></div>
                </div>
                <button class="mini-btn btn-fullpay" type="button">Оплачено полностью (= сумма заказа, сегодня)</button>
            </div>

            <div class="sec"><h4>8. Примечание (на случай претензий после получения)</h4>
                <div class="fields"><div class="wide"><textarea rows="3" data-f="claim_note">${esc(r.claim_note || '')}</textarea></div></div>
            </div>

            <div class="save-bar"><button class="btn-save" type="button">Сохранить</button><span class="save-status"></span></div>
        </details>`;
    }

    function periodRows() {
        const period = document.getElementById('period').value;
        const cutoff = period === 'all' ? 0 : Date.now() - Number(period) * 86400000;
        return allRows.filter(r =>
            r.atelier_order && r.atelier_order.garment === garment && new Date(r.order_date).getTime() >= cutoff);
    }

    function render() {
        const f = document.getElementById('status-filter').value;
        const shown = periodRows().filter(r => matchesStatus(r, f));
        document.getElementById('list').innerHTML = shown.map(cardHtml).join('');
        const note = document.getElementById('empty-note');
        note.style.display = shown.length ? 'none' : 'block';
        note.textContent = 'Заказов по выбранным фильтрам нет.';
    }

    async function load() {
        const { data, error } = await supabase.from('income_entries').select('*')
            .eq('business_line', 'atelier').order('order_date', { ascending: false }).limit(1000);
        if (error) {
            console.error(error);
            const note = document.getElementById('empty-note');
            note.style.display = 'block';
            note.textContent = 'Не удалось загрузить заказы: ' + (error.message || '');
            return;
        }
        allRows = data || [];
        render();
    }

    const list = document.getElementById('list');

    list.addEventListener('toggle', (e) => {
        const el = e.target;
        if (el.classList && el.classList.contains('order')) {
            if (el.open) openIds.add(el.dataset.id); else openIds.delete(el.dataset.id);
        }
    }, true);

    list.addEventListener('click', async (e) => {
        const card = e.target.closest('details.order');
        if (!card) return;
        const id = card.dataset.id;
        const row = allRows.find(r => String(r.id) === id);
        if (!row) return;
        const field = (f) => card.querySelector(`[data-f="${f}"]`);

        if (e.target.closest('.btn-gen')) {
            const o = row.atelier_order || {};
            const first = o.recipientFirstName || '';
            const post = o.recipientPostOffice || o.recipientAddress || '';
            const cod = o.paymentMethod === 'cod';
            const date = field('shipping_receipt_date').value;
            const num = field('shipping_receipt_number').value;
            field('shipping_message').value = [
                `Hello${first ? ', ' + first : ''}! Your order ${row.order_number} has been handed over to the carrier${date ? ' on ' + date : ''}.`,
                `Receipt No.: ${num || '—'}. Post office: ${post || '—'}.`,
                cod ? `Amount to pay on receipt: ${eur(row.total_amount)}.` : 'Your order is already paid.',
                'Thank you for choosing GY-GY Club!'
            ].join('\n');
            return;
        }

        if (e.target.closest('.btn-copy')) {
            const btn = e.target.closest('.btn-copy');
            try { await navigator.clipboard.writeText(field('shipping_message').value); btn.textContent = 'Скопировано'; }
            catch (err) { btn.textContent = 'Не удалось скопировать'; }
            setTimeout(() => { btn.textContent = 'Скопировать'; }, 1500);
            return;
        }

        if (e.target.closest('.btn-fullpay')) {
            field('payment_amount').value = Number(row.total_amount).toFixed(2);
            if (!field('payment_date').value) field('payment_date').value = new Date().toISOString().slice(0, 10);
            return;
        }

        if (e.target.closest('.btn-save')) {
            const payload = {};
            card.querySelectorAll('[data-f]').forEach(el => {
                const k = el.dataset.f;
                let v = el.value.trim();
                if (el.type === 'number') v = v === '' ? null : Number(v);
                else v = v === '' ? null : v;
                payload[k] = v;
            });
            const statusEl = card.querySelector('.save-status');
            statusEl.className = 'save-status';
            statusEl.textContent = 'Сохраняю…';
            const { data, error } = await supabase.from('income_entries').update(payload).eq('id', id).select('id');
            if (error || !data || data.length === 0) {
                console.error('[Income] Не удалось сохранить', error);
                statusEl.textContent = 'Не удалось сохранить: ' + (error ? error.message : 'нет прав на изменение — проверьте SQL (политика update)');
                statusEl.classList.add('error');
                return;
            }
            Object.assign(row, payload);
            openIds.add(id);
            render();
            const fresh = list.querySelector(`details.order[data-id="${id}"] .save-status`);
            if (fresh) { fresh.textContent = 'Сохранено'; fresh.classList.add('ok'); }
        }
    });

    document.getElementById('period').addEventListener('change', render);
    document.getElementById('status-filter').addEventListener('change', render);
    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-atelier').addEventListener('click', () => window.location.href = 'income-atelier.html');

    renderParams();
    load();
</script>
</body>
</html>
