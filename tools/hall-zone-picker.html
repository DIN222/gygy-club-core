<!DOCTYPE html>
<!--
  tools/hall-zone-picker.html
  v2.0.0 — 2026-08-26
  Изменения: инструмент теперь УНИВЕРСАЛЬНЫЙ — работает с любой картинкой,
  не только с Холлом. Вписываете имя файла в поле — фон переключается.
  Клик по фото → готовые top/left в vh/vw для вставки в CSS любой комнаты.
-->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Zone Picker (universal)</title>
<style>
    body {
        margin: 0; height: 100vh; overflow: hidden; position: relative;
        background: #000000;
        cursor: crosshair;
        font-family: monospace;
    }
    #bg-layer {
        position: fixed; inset: 0; z-index: 0;
        background-position: center 12%;
        background-size: 75% auto;
        background-repeat: no-repeat;
    }
    #panel {
        position: fixed; top: 10px; right: 10px; z-index: 100;
        background: rgba(0,0,0,0.9); color: #FFD700; padding: 12px;
        border: 2px solid #FFD700; border-radius: 8px; max-width: 340px;
        font-size: 12px; white-space: pre-wrap;
    }
    #panel h3 { margin: 0 0 8px; font-size: 13px; }
    #img-name-input {
        width: 100%; padding: 6px; margin-bottom: 6px;
        background: #000; color: #FFD700; border: 1px solid #FFD700;
        font-family: monospace; font-size: 12px; box-sizing: border-box;
    }
    #load-btn, #clear-btn {
        padding: 4px 10px; cursor: pointer;
        background: #000; color: #FFD700; border: 1px solid #FFD700;
        margin-right: 6px; margin-top: 4px;
    }
    .size-controls { display: flex; gap: 6px; align-items: center; margin: 8px 0; font-size: 11px; }
    .size-controls input { width: 60px; }
    .marker {
        position: absolute; width: 10px; height: 10px; border-radius: 50%;
        background: red; transform: translate(-50%, -50%); pointer-events: none;
        z-index: 50;
    }
    .marker span {
        position: absolute; top: -18px; left: 12px; color: red;
        font-size: 11px; font-weight: bold; white-space: nowrap;
    }
</style>
</head>
<body>

<div id="bg-layer"></div>

<div id="panel">
    <h3>Universal Zone Picker</h3>
    <input type="text" id="img-name-input" placeholder="напр. atelier92.png">
    <button id="load-btn">LOAD IMAGE</button>

    <div class="size-controls">
        <label>size %:</label>
        <input type="number" id="size-input" value="75">
        <label>pos %:</label>
        <input type="number" id="pos-input" value="12">
        <button id="apply-size-btn">APPLY</button>
    </div>

    <div id="output" style="margin-top:8px;">Загрузите картинку, затем кликните по нужным точкам.</div>
    <button id="clear-btn">Очистить точки</button>
</div>

<script>
    const bgLayer = document.getElementById('bg-layer');
    const output = document.getElementById('output');
    const points = [];

    document.getElementById('load-btn').addEventListener('click', () => {
        const name = document.getElementById('img-name-input').value.trim();
        if (!name) return;
        bgLayer.style.backgroundImage = `url('../${name}')`;
    });

    document.getElementById('apply-size-btn').addEventListener('click', () => {
        const size = document.getElementById('size-input').value || 75;
        const pos = document.getElementById('pos-input').value || 12;
        bgLayer.style.backgroundSize = size + '% auto';
        bgLayer.style.backgroundPosition = `center ${pos}%`;
    });

    document.body.addEventListener('click', (e) => {
        if (e.target.closest('#panel')) return;

        const vw = (e.clientX / window.innerWidth * 100).toFixed(1);
        const vh = (e.clientY / window.innerHeight * 100).toFixed(1);
        points.push({ vw, vh });

        const marker = document.createElement('div');
        marker.className = 'marker';
        marker.style.left = e.clientX + 'px';
        marker.style.top = e.clientY + 'px';
        marker.innerHTML = `<span>${points.length}</span>`;
        document.body.appendChild(marker);

        renderOutput();
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
        points.length = 0;
        document.querySelectorAll('.marker').forEach(m => m.remove());
        renderOutput();
    });

    function renderOutput() {
        if (points.length === 0) {
            output.textContent = 'Загрузите картинку, затем кликните по нужным точкам.';
            return;
        }
        output.textContent = points.map((p, i) =>
            `Точка ${i + 1}: top: ${p.vh}vh; left: ${p.vw}vw;`
        ).join('\n');
    }
</script>

</body>
</html>
