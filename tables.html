<!DOCTYPE html>
<!--
  tables.html — v1.6.0 — 2026-10-26
  Раздел бара: шесть столов и зона микрофона.
  Изменения: убран виджет Google (закрыт); перевод — core/localization.js (English / Français),
  подписи столов — core/i18n/tables.js; звук — сценарий core/soundScenario.js
  (старый <audio> убран); паспорт — общий modules/passport.js.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>GY-GY Club | Tables v1.6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="qrcode.min.js"></script>
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }

        /* плавный наплыв из темноты */
        body {
            margin: 0; padding: 0; width: 100%; height: 100%; background: #000;
            font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed;
            opacity: 0; transition: opacity 0.5s ease-in-out;
        }
        body.page-loaded { opacity: 1; }

        .ui-nav-arrows {
            position: fixed; top: 15px; left: 20px; z-index: 6000;
            display: flex; gap: 20px; align-items: center; user-select: none;
        }
        .arrow-item {
            font-family: 'Share Tech Mono', monospace;
            font-size: 26px; font-weight: 900; color: var(--gold); cursor: pointer;
            display: inline-flex; align-items: center; line-height: 1;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transition: opacity 0.2s;
        }
        .arrow-item:hover { opacity: 0.8; }
        .arrow-item span:nth-child(2) { margin-left: -4px; }

        #ui-logo { position: fixed; top: 15px; right: 25px; z-index: 5000; color: var(--gold); font-size: 24px; font-weight: bold; letter-spacing: 5px; }

        #hall-layer {
            width: 100vw; height: 100vh; position: relative;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .table-scene {
            position: relative; width: 1000px; height: 562.5px;
            background: url('lounge.jpg') no-repeat center center / contain;
            z-index: 10; flex-shrink: 0;
            transform: scale(min(100vw / 1000, 100vh / 562.5));
            transform-origin: center center;
        }

        .lamp-zone {
            position: absolute; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; z-index: 100;
            background: radial-gradient(circle, var(--neon-glow) 0%, transparent 75%);
            border: 1px solid var(--violet); box-shadow: 0 0 18px var(--neon-glow);
            transition: 0.3s; transform: translate(-50%, -50%);
        }
        .lamp-zone:hover { transform: translate(-50%, -50%) scale(1.15); box-shadow: 0 0 28px var(--violet); z-index: 500; }

        #table-1 { top: 396px; left: 330px; }
        #table-2 { top: 344px; left: 419px; }
        #table-3 { top: 303px; left: 438px; }
        #table-4 { top: 303px; left: 575px; }
        #table-5 { top: 341px; left: 603px; }
        #table-6 { top: 396px; left: 659px; }
        #mic-zone { top: 234px; left: 503px; }

        .lamp-zone::after {
            content: attr(data-label);
            position: absolute; bottom: 100%; left: 50%;
            transform: translateX(-50%) translateY(-14px);
            background: rgba(10, 10, 10, 0.98); border: 1px solid #444; color: var(--gold);
            padding: 6px 12px; font-size: 13px; white-space: nowrap; border-radius: 4px;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
            font-family: 'Share Tech Mono', monospace; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            text-shadow: 0 0 4px rgba(150, 150, 150, 0.6), 0 0 8px rgba(100, 100, 100, 0.4);
            z-index: 999999 !important;
        }
        .lamp-zone:hover::after { opacity: 1 !important; transform: translateX(-50%) translateY(-20px); }

        /* паспорт (общий модуль modules/passport.js) */
        .gy-user-badge {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--gold); background: #111;
            z-index: 1000000; cursor: pointer; display: none;
        }
        .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; }
        .gy-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px; width: 17px; height: 12px; object-fit: cover;
            border: 1px solid var(--gold);
        }
        .gy-passport-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000000;
            display: none; align-items: center; justify-content: center; opacity: 0;
            transition: opacity 0.3s ease;
        }
        .gy-passport-card {
            background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px;
            padding: 25px; width: 280px; max-width: 94vw; color: #000; text-align: center; position: relative;
            font-family: 'Share Tech Mono', monospace;
        }
        .gy-passport-close { position: absolute; top: 10px; right: 14px; font-size: 28px; cursor: pointer; }
        .gy-passport-title { font-weight: 900; font-size: 16px; }
        .gy-passport-id { font-weight: 700; font-size: 13px; margin-top: 5px; color: #555; }
        .gy-passport-nick { font-weight: 700; font-size: 14px; margin-top: 4px; }
        .gy-passport-avatar-box, .gy-passport-qr-box {
            width: 90px; height: 90px; border: 2px solid var(--gold); background: #fff;
            margin: 8px auto; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .gy-passport-avatar { width: 100%; height: 100%; object-fit: cover; }
        .gy-passport-edit {
            margin-top: 14px; padding: 8px 20px; background: #000; border: 2px solid var(--gold);
            color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; font-size: 11px;
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="ui-nav-arrows" id="global-nav" translate="no">
        <div class="arrow-item" id="btn-bar" title="Back" data-translate-title="nav_back">&lt;</div>
        <div class="arrow-item" id="btn-exit" title="Home" data-translate-title="nav_home"><span>&lt;</span><span>&lt;</span></div>
    </div>

    <div id="ui-logo" translate="no">GY-GY</div>
    <div id="passport-badge-container"></div>

    <div id="hall-layer">
        <div class="table-scene">
            <div id="table-1" class="lamp-zone" data-zone="risk.html"        data-label="TABLE 1: “Risk” (Strategy)"></div>
            <div id="table-2" class="lamp-zone" data-zone="battle.html"      data-label="TABLE 2: “Quote Duel” (Battle)"></div>
            <div id="table-3" class="lamp-zone" data-zone="anon.html"        data-label="TABLE 3: “Verses” (Poetry)"></div>
            <div id="table-4" class="lamp-zone" data-zone="translator.html"  data-label="TABLE 4: “Male / Female Translator”"></div>
            <div id="table-5" class="lamp-zone" data-zone="compliments.html" data-label="TABLE 5: “Compliment Duel”"></div>
            <div id="table-6" class="lamp-zone" data-zone="baron.html"       data-label="TABLE 6: “The Baron’s Shadow” (vs AI)"></div>
            <div id="mic-zone" class="lamp-zone" data-zone="openmic.html"    data-label="MIC ZONE: “Open Mic”"></div>
        </div>
    </div>

<script type="module">
    import { init as initLocalization, t, onLanguageChange, registerDictionary } from './core/localization.js';
    import { TABLES_DICT } from './core/i18n/tables.js';
    import { init as initPassport } from './modules/passport.js';

    registerDictionary(TABLES_DICT);
    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));

    // Подписи столов лежат в data-label (рисуются через CSS), поэтому переводим их из словаря
    const LABELS = {
        'table-1': 'tb_t1', 'table-2': 'tb_t2', 'table-3': 'tb_t3', 'table-4': 'tb_t4',
        'table-5': 'tb_t5', 'table-6': 'tb_t6', 'mic-zone': 'tb_mic'
    };
    function applyLabels() {
        Object.entries(LABELS).forEach(([id, key]) => {
            const el = document.getElementById(id);
            if (!el) return;
            if (el.dataset.labelOrig === undefined) el.dataset.labelOrig = el.getAttribute('data-label') || '';
            el.setAttribute('data-label', t(key, el.dataset.labelOrig));
        });
    }
    applyLabels();
    onLanguageChange(applyLabels);

    function go(url) {
        document.body.classList.remove('page-loaded');
        setTimeout(() => { location.href = url; }, 500);
    }
    document.querySelectorAll('.lamp-zone[data-zone]').forEach(el => {
        el.addEventListener('click', () => go(el.dataset.zone));
    });
    document.getElementById('btn-bar').addEventListener('click', () => go('bar.html'));
    document.getElementById('btn-exit').addEventListener('click', () => go('index.html'));
</script>

<!-- страница должна появиться, даже если модуль выше не загрузился -->
<script>
    function showPage() { document.body.classList.add('page-loaded'); }
    window.addEventListener('load', showPage);
    setTimeout(showPage, 1500);
</script>
</body>
</html>
