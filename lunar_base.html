<!DOCTYPE html>
<!--
  lunar-base.html — Лунная база — v1.0.0 — 2026-10-30
  Продолжение форума (Лунная стена) и Print lab: сообщение со стены или свой текст → открытка
  или нашивка посадки → Ателье / PNG / Telegram. Открывается после пуска в Центре.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>GY-GY Club — Lunar Base</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<link rel="stylesheet" href="space.css">
</head>
<body>
<div class="sp-bg" style="--bg: url('lunar_base_bg.jpg');"></div>

<div class="sp-top">
    <div class="sp-nav" translate="no">
        <span id="btn-back" title="Back" data-translate-title="nav_back">&lt;</span>
        <span id="btn-home" title="Home" data-translate-title="nav_home">&lt;&lt;</span>
    </div>
    <div class="sp-logo" translate="no">GY-GY</div>
</div>
<div id="passport-badge-container"></div>

<main class="sp-page">
    <h1 class="sp-title" data-translate="sp_moon_title">Lunar Base</h1>

    <div class="sp-panel sp-lock" id="locked" hidden>
        <h2 class="sp-h" data-translate="sp_locked_title">The Lunar Base is closed</h2>
        <p class="sp-sub" data-translate="sp_locked_msg">Launch the rocket first: the Lunar Base opens after liftoff.</p>
        <button class="sp-btn primary" id="to-center" type="button" data-translate="sp_locked_btn">To the Space Construction Center →</button>
    </div>

    <div id="base" hidden>
        <p class="sp-welcome">
            <span data-translate="sp_moon_welcome">Welcome to the Lunar Base.</span>
            <span data-translate="sp_mission_label">Mission</span>: <b translate="no" id="mission-val">—</b> ·
            <span data-translate="sp_crew_label">Crew</span>: <b translate="no" id="crew-val">—</b>
        </p>

        <div class="sp-grid">
            <div class="sp-left">
                <div class="sp-panel sp-stagebox">
                    <div class="sp-stagewrap"><canvas class="sq" id="preview" width="480" height="480"></canvas></div>
                    <p class="sp-status" id="status" role="status" translate="no"></p>
                </div>
                <div class="sp-panel sp-steps">
                    <h2 class="sp-h" data-translate="sp_lab_title">Print lab</h2>
                    <p class="sp-sub" data-translate="sp_lab_sub">Turn a message into a postcard or a landing patch.</p>
                    <div class="sp-row">
                        <button class="sp-opt sel" type="button" data-type="card" data-translate="sp_lab_card">Postcard</button>
                        <button class="sp-opt" type="button" data-type="patch" data-translate="sp_lab_patch">Landing patch</button>
                    </div>
                    <input class="sp-input" id="lab-text" type="text" maxlength="70" placeholder="Text for the print (up to 70 characters)" data-translate-placeholder="sp_lab_text_ph">
                    <div class="sp-row">
                        <button class="sp-btn primary" id="lab-atelier" type="button" data-translate="sp_to_atelier">Send to the Atelier →</button>
                        <button class="sp-btn" id="lab-png" type="button" data-translate="sp_png">Save PNG ⬇</button>
                        <button class="sp-btn" id="lab-tg" type="button" data-translate="sp_telegram">Telegram ✈</button>
                    </div>
                </div>
            </div>
            <div class="sp-right">
                <div class="sp-panel sp-wallbox" id="wall"></div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { init as initLocalization, t, onLanguageChange, registerDictionary } from './core/localization.js';
    import { SPACE_DICT } from './core/i18n/space.js';
    import { init as initPassport } from './modules/passport.js';
    import { renderEmblem, canvasBlob } from './modules/spaceArt.js';
    import { mountForum, getCrewName } from './modules/spaceForum.js';
    import { sendImageToAtelier, downloadBlob, shareImage } from './modules/toAtelier.js';

    registerDictionary(SPACE_DICT);
    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));

    const $ = id => document.getElementById(id);
    $('btn-back').addEventListener('click', () => { window.location.href = 'verses.html'; });
    $('btn-home').addEventListener('click', () => { window.location.href = 'index.html'; });
    $('to-center').addEventListener('click', () => { window.location.href = 'space-construction.html'; });

    let launched = false, rec = {};
    try {
        launched = localStorage.getItem('gygy_space_launched') === '1';
        rec = JSON.parse(localStorage.getItem('gygy_space_mission') || '{}') || {};
    } catch (e) { /* ок */ }

    if (!launched) {
        $('locked').hidden = false;
    } else {
        $('base').hidden = false;
        $('mission-val').textContent = rec.mission || '—';
        $('crew-val').textContent = rec.crew || getCrewName();

        const L = { type: 'card', text: String(rec.motto || '').slice(0, 70) };
        $('lab-text').value = L.text;
        const say = (m) => { $('status').textContent = m || ''; };

        function opts(size) {
            const date = new Date().toISOString().slice(0, 10);
            return {
                scene: 'moon', cfg: { capsule: rec.capsule, hull: rec.hull, engines: rec.engines },
                top: L.type === 'card' ? t('sp_greetings', 'GREETINGS FROM THE MOON') : (rec.mission || t('sp_landed', 'LANDING')),
                bottom: (rec.crew || getCrewName()) + ' · ' + date,
                note: L.text, size
            };
        }
        let timer = null;
        async function updatePreview() {
            const c = await renderEmblem(opts(480));
            const p = $('preview');
            p.width = 480; p.height = 480;
            p.getContext('2d').drawImage(c, 0, 0);
        }
        const schedule = () => { clearTimeout(timer); timer = setTimeout(updatePreview, 150); };
        const blob = async () => canvasBlob(await renderEmblem(opts(1200)));

        document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
            L.type = b.dataset.type;
            document.querySelectorAll('[data-type]').forEach(x => x.classList.toggle('sel', x === b));
            schedule();
        }));
        $('lab-text').addEventListener('input', (e) => { L.text = e.target.value; schedule(); });

        $('lab-atelier').addEventListener('click', async () => {
            try {
                say(t('sp_sending', 'Sending to the Atelier…'));
                await sendImageToAtelier(await blob(), 'lunar-base');
            } catch (e) {
                say(t('sp_too_large', 'The image is too large to send. Save the PNG and upload it in the Atelier.'));
            }
        });
        $('lab-png').addEventListener('click', async () => {
            downloadBlob(await blob(), 'gygy-moon-print.png');
            say(t('sp_saved', 'Saved to your computer.'));
        });
        $('lab-tg').addEventListener('click', async () => {
            const r = await shareImage(await blob(), (L.text || t('sp_greetings', 'GREETINGS FROM THE MOON')) + ' · GY-GY Club', 'gygy-moon-print.png');
            say(r === 'shared' ? t('sp_shared', 'Shared.') : (r === 'telegram' ? t('sp_opening_tg', 'Opening Telegram…') : ''));
        });

        // нажатие на сообщение на Лунной стене превращает его в принт
        mountForum($('wall'), {
            area: 'moon',
            onPick: (p) => {
                L.text = String(p.text).slice(0, 70);
                $('lab-text').value = L.text;
                schedule();
                $('preview').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
        onLanguageChange(schedule);
        updatePreview();
    }
</script>
</body>
</html>
