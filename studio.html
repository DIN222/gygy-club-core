<!DOCTYPE html>
<!-- studio.html v1.0.0 — 2026-08-26. Хаб "гаражного производства": вход в гаражи. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Studio v1.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<style>
    :root { --gold: #FFD700; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%; background: #000; color: var(--gold);
        overflow: hidden; position: fixed; font-family: 'Share Tech Mono', monospace;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .header-right { position: fixed; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; }
    .ui-nav-arrows { position: fixed; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; transition: opacity 0.2s, transform 0.2s; }
    .back-arrow:hover { opacity: 0.8; transform: scale(1.1); }
    .gy-user-badge { position: fixed; top: 4px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: #111; cursor: pointer; display: none; }
    .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .gy-user-badge .badge-flag { position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover; border: 1px solid var(--gold); }
    .section-title { font-family: 'Cinzel', serif; font-size: 20px; letter-spacing: 4px; margin-bottom: 24px; }
    .garage-grid { display: flex; gap: 16px; }
    .garage-card {
        width: 160px; padding: 20px 14px; border: 2px solid var(--gold);
        text-align: center; cursor: pointer; transition: filter 0.2s;
    }
    .garage-card:hover { filter: brightness(1.15); }
    .garage-card.locked { opacity: 0.35; cursor: not-allowed; }
    .garage-icon { font-size: 32px; margin-bottom: 8px; }
    .garage-name { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1px; margin-bottom: 4px; }
    .garage-desc { font-size: 9px; opacity: 0.7; }
</style>
</head>
<body>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-hall">&lt;&lt;</a>
</div>
<div id="passport-badge-container"></div>

<div class="section-title">GARAGE STUDIO</div>
<div class="garage-grid">
    <div class="garage-card" id="garage-atelier">
        <div class="garage-icon">🧥</div>
        <div class="garage-name">ATELIER</div>
        <div class="garage-desc">Street clothing</div>
    </div>
    <div class="garage-card locked" id="garage-souvenirs">
        <div class="garage-icon">🎁</div>
        <div class="garage-name">SOUVENIRS</div>
        <div class="garage-desc">Coming soon</div>
    </div>
</div>

<script type="module">
    import { init as initLocalization } from './core/localization.js';
    import { init as initPassport } from './modules/passport.js';

    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));

    document.getElementById('garage-atelier').addEventListener('click', () => {
        window.location.href = 'atelier.html';
    });
    document.getElementById('garage-souvenirs').addEventListener('click', () => {
        console.log('[Studio] Мастерская сувениров: гараж 2, ещё не построен.');
    });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-hall').addEventListener('click', () => window.location.href = 'hall.html');
</script>

</body>
</html>
