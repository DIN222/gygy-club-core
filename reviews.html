<!DOCTYPE html>
<!-- reviews.html — v1.0.0 — 2026-10-14 — отзывы клиентов (читают только сотрудники) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Отзывы</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .page-wrap { min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-size: 22px; margin-bottom: 14px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .panel { width: 100%; max-width: 760px; }
    .filters { display: flex; gap: 8px; margin-bottom: 10px; }
    .filters select { padding: 7px; border: 1px solid var(--gold); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .averages { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .averages span { border: 1px solid var(--gold-dim); padding: 5px 10px; font-size: 11px; color: var(--ivory); }
    .averages b { color: var(--gold); }
    .review { border: 1px solid var(--gold-dim); background: #0a0a0a; padding: 10px; margin-bottom: 8px; }
    .r-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 10px; color: #9a9a8a; margin-bottom: 6px; }
    .r-loc { color: var(--gold); font-weight: 700; text-transform: uppercase; }
    .r-stars { color: var(--gold); }
    .r-body { font-size: 12px; color: var(--ivory); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .r-ctx { margin-top: 6px; font-size: 10px; color: #9a9a8a; }
    .r-ctx img { display: block; width: 70px; margin-top: 4px; border: 1px solid var(--gold-dim); background: #222; }
    .r-del { margin-left: auto; background: #000; color: #9a9a8a; border: 1px solid #333; padding: 2px 8px; font-size: 9px; cursor: pointer; font-family: inherit; }
    .r-del:hover { color: #e74c3c; border-color: #e74c3c; }
    .note { font-size: 11px; color: #666; text-align: center; padding: 20px; }
    .note.error { color: #e74c3c; }
</style>
</head>
<body>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows"><a class="back-arrow" id="btn-back">&lt;</a><a class="back-arrow" id="btn-accounting">&lt;&lt;</a></div>
<div class="page-wrap">
    <div class="title">ОТЗЫВЫ</div>
    <div class="panel">
        <div class="filters">
            <select id="loc-filter">
                <option value="all">Все места</option>
                <option value="atelier">Ателье</option>
                <option value="store">Лавка древностей</option>
                <option value="souvenirs">Сувениры</option>
                <option value="bar">Бар</option>
                <option value="other">Другое</option>
            </select>
        </div>
        <div class="averages" id="averages"></div>
        <div id="list"></div>
        <div class="note" id="note" style="display:none;"></div>
    </div>
</div>
<script type="module">
    import { requireAuth } from './core/auth.js';
    import { supabase } from './core/supabase-init.js';

    const session = await requireAuth();
    if (!session) throw new Error('redirecting to login');

    const LOC = { atelier: 'Ателье', store: 'Лавка древностей', souvenirs: 'Сувениры', bar: 'Бар', other: 'Другое' };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeHttps = (u) => /^https:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim() : '';

    let rows = [];

    function ctxHtml(ctx) {
        if (!ctx || typeof ctx !== 'object') return '';
        const parts = Object.entries(ctx)
            .filter(([k, v]) => v != null && v !== '' && k !== 'printUrl')
            .map(([k, v]) => `${esc(k)}: ${esc(v)}`);
        const img = safeHttps(ctx.printUrl);
        if (!parts.length && !img) return '';
        return `<div class="r-ctx">${parts.join(' · ')}${img ? `<img src="${esc(img)}" alt="">` : ''}</div>`;
    }

    function render() {
        const f = document.getElementById('loc-filter').value;
        const shown = rows.filter(r => f === 'all' || r.location === f);

        const sums = {};
        rows.forEach(r => {
            const s = sums[r.location] || (sums[r.location] = { n: 0, rn: 0, rs: 0 });
            s.n++;
            if (r.rating) { s.rn++; s.rs += r.rating; }
        });
        document.getElementById('averages').innerHTML = Object.entries(sums).map(([loc, s]) =>
            `<span>${esc(LOC[loc] || loc)}: <b>${s.n}</b> отз.${s.rn ? ` · средняя <b>${(s.rs / s.rn).toFixed(1)}</b>` : ''}</span>`).join('');

        document.getElementById('list').innerHTML = shown.map(r => `
            <div class="review" data-id="${esc(r.id)}">
                <div class="r-head">
                    <span class="r-loc">${esc(LOC[r.location] || r.location)}</span>
                    <span>${esc(new Date(r.created_at).toLocaleString())}</span>
                    ${r.rating ? `<span class="r-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>` : ''}
                    ${r.author_name ? `<span>${esc(r.author_name)}</span>` : ''}
                    <button class="r-del" type="button">Удалить</button>
                </div>
                <div class="r-body">${esc(r.body)}</div>
                ${ctxHtml(r.context)}
            </div>`).join('');
        const note = document.getElementById('note');
        note.className = 'note';
        note.style.display = shown.length ? 'none' : 'block';
        note.textContent = 'Отзывов пока нет.';
    }

    async function load() {
        const { data, error } = await supabase.from('reviews').select('*').order('created_at', { ascending: false }).limit(500);
        const note = document.getElementById('note');
        if (error) {
            console.error(error);
            note.className = 'note error';
            note.style.display = 'block';
            note.textContent = 'Не удалось загрузить отзывы: ' + (error.message || '') + ' — проверьте, что SQL выполнен.';
            return;
        }
        rows = data || [];
        render();
    }

    document.getElementById('list').addEventListener('click', async (e) => {
        const btn = e.target.closest('.r-del');
        if (!btn) return;
        const id = btn.closest('.review').dataset.id;
        if (!confirm('Удалить отзыв?')) return;
        const { data, error } = await supabase.from('reviews').delete().eq('id', id).select('id');
        if (error || !data || !data.length) { alert('Не удалось удалить: ' + (error ? error.message : 'нет прав')); return; }
        rows = rows.filter(r => r.id !== id);
        render();
    });

    document.getElementById('loc-filter').addEventListener('change', render);
    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');

    load();
</script>
</body>
</html>
