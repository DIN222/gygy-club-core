<!DOCTYPE html>
<!--
  cost-calculator.html
  v1.0.0 — 2026-09-29
  Подблок Бухгалтерии. Построчный ввод статей затрат (материалы, прочие
  расходы) → авторасчёт себестоимости → наценка → розничная цена.
  Каждое сохранение — новая запись в product_costs (история расчётов,
  не перезапись), можно посмотреть, как менялась себестоимость со временем.
  ⚠️ Пока НЕ связано автоматически с ценами в Ателье (BASE_PRICE там —
  статичные константы в коде). Розничную цену отсюда нужно будет вручную
  перенести в atelier.html, пока не построена прямая интеграция.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Cost Calculator v1.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; min-height: 100%; background: #000; color: var(--gold);
        overflow-y: auto; font-family: 'Share Tech Mono', monospace;
    }
    .header-right { position: absolute; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .back-arrow:hover { opacity: 0.6; }

    .gy-user-badge { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: #111; cursor: pointer; display: none; z-index: 1000; }
    .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .gy-user-badge .badge-flag { position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover; border: 1px solid var(--gold); }

    .page-wrap { position: relative; min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }

    .panel { width: 100%; max-width: 560px; }
    .field-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .field-row input, .field-row select {
        flex: 1; padding: 8px; border: 1px solid var(--gold); border-radius: 2px;
        background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 12px;
    }

    .items-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 11px; }
    .items-table th { text-align: left; color: var(--gold-dim); font-weight: 700; padding: 4px; border-bottom: 1px solid var(--gold-dim); }
    .items-table td { padding: 4px; border-bottom: 1px solid #222; }
    .items-table input { width: 100%; padding: 5px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .items-table .subtotal { color: var(--gold); text-align: right; white-space: nowrap; padding-right: 4px; }
    .remove-btn { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 14px; }

    .btn-cfg {
        background: #000; color: var(--gold); border: 1px solid var(--gold-dim);
        padding: 8px 12px; cursor: pointer; font-weight: 700; text-transform: uppercase;
        font-family: 'Share Tech Mono', monospace; font-size: 11px;
        transition: border-color 0.2s;
    }
    .btn-cfg:hover { border-color: var(--gold); }
    .btn-cfg.confirm { background: var(--gold); color: #000; font-weight: 900; }

    .summary { margin-top: 16px; padding: 12px; background: #0a0a0a; border: 1px solid var(--gold-dim); font-size: 13px; }
    .summary-row { display: flex; justify-content: space-between; padding: 3px 0; }
    .summary-row.total { color: var(--gold); font-weight: 900; font-size: 16px; border-top: 1px solid var(--gold-dim); margin-top: 6px; padding-top: 6px; }

    .history { width: 100%; max-width: 560px; margin-top: 24px; }
    .history-title { font-size: 12px; color: var(--gold-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .history-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--ivory); padding: 5px 0; border-bottom: 1px solid #1a1a1a; }
    .history-row span:last-child { color: var(--gold); }
    .status-line { font-size: 11px; color: #6fd48a; margin-top: 8px; min-height: 14px; text-align: center; }
</style>
</head>
<body>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-office">&lt;&lt;</a>
</div>
<div id="passport-badge-container"></div>

<div class="page-wrap">
    <div class="title">КАЛЬКУЛЯЦИЯ ЗАТРАТ</div>

    <div class="panel">
        <div class="field-row">
            <input type="text" id="product-name" placeholder="Название изделия (например: T-Shirt Humor)">
        </div>

        <table class="items-table">
            <thead>
                <tr><th>Статья затрат</th><th style="width:60px;">Кол-во</th><th style="width:80px;">Цена, €</th><th style="width:80px;">Сумма</th><th></th></tr>
            </thead>
            <tbody id="items-body"></tbody>
        </table>
        <button class="btn-cfg" id="btn-add-item">+ СТАТЬЯ ЗАТРАТ</button>

        <div class="summary">
            <div class="summary-row"><span>Себестоимость</span><span id="sum-cost">€0.00</span></div>
            <div class="field-row" style="margin-top:8px;">
                <label style="align-self:center; font-size:11px; white-space:nowrap;">Наценка, %</label>
                <input type="number" id="margin-input" value="40" min="0" step="1">
            </div>
            <div class="summary-row total"><span>Розничная цена</span><span id="sum-retail">€0.00</span></div>
        </div>

        <button class="btn-cfg confirm" id="btn-save" style="width:100%; margin-top:12px;">СОХРАНИТЬ РАСЧЁТ</button>
        <div class="status-line" id="status-line"></div>
    </div>

    <div class="history">
        <div class="history-title">История расчётов</div>
        <div id="history-list"></div>
    </div>
</div>

<script type="module">
    import { init as initPassport } from './modules/passport.js';
    import { supabase } from './core/supabase-init.js';

    initPassport(document.getElementById('passport-badge-container'));

    let items = [{ name: '', qty: 1, price: 0 }];

    function renderItems() {
        const body = document.getElementById('items-body');
        body.innerHTML = items.map((item, i) => `
            <tr>
                <td><input type="text" data-field="name" data-i="${i}" value="${item.name}" placeholder="ткань, печать, фурнитура..."></td>
                <td><input type="number" data-field="qty" data-i="${i}" value="${item.qty}" min="0" step="0.1"></td>
                <td><input type="number" data-field="price" data-i="${i}" value="${item.price}" min="0" step="0.01"></td>
                <td class="subtotal">€${(item.qty * item.price).toFixed(2)}</td>
                <td>${items.length > 1 ? `<button class="remove-btn" data-remove="${i}">✕</button>` : ''}</td>
            </tr>
        `).join('');

        body.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('input', (e) => {
                const i = +e.target.dataset.i;
                const field = e.target.dataset.field;
                items[i][field] = field === 'name' ? e.target.value : parseFloat(e.target.value) || 0;
                if (field !== 'name') { updateSummary(); renderItems(); }
            });
        });
        body.querySelectorAll('[data-remove]').forEach(btn => {
            btn.addEventListener('click', () => {
                items.splice(+btn.dataset.remove, 1);
                renderItems();
                updateSummary();
            });
        });
    }

    function updateSummary() {
        const totalCost = items.reduce((sum, it) => sum + it.qty * it.price, 0);
        const margin = parseFloat(document.getElementById('margin-input').value) || 0;
        const retail = totalCost * (1 + margin / 100);
        document.getElementById('sum-cost').textContent = `€${totalCost.toFixed(2)}`;
        document.getElementById('sum-retail').textContent = `€${retail.toFixed(2)}`;
        return { totalCost, margin, retail };
    }

    document.getElementById('btn-add-item').addEventListener('click', () => {
        items.push({ name: '', qty: 1, price: 0 });
        renderItems();
    });
    document.getElementById('margin-input').addEventListener('input', updateSummary);

    document.getElementById('btn-save').addEventListener('click', async () => {
        const productName = document.getElementById('product-name').value.trim();
        const status = document.getElementById('status-line');
        if (!productName) { status.textContent = 'Укажите название изделия.'; status.style.color = '#e74c3c'; return; }
        const { totalCost, margin, retail } = updateSummary();
        try {
            const { error } = await supabase.from('product_costs').insert({
                product_name: productName,
                line_items: items,
                total_cost: totalCost,
                margin_percent: margin,
                retail_price: retail
            });
            if (error) throw error;
            status.style.color = '#6fd48a';
            status.textContent = 'Сохранено.';
            loadHistory();
        } catch (e) {
            console.error('[CostCalculator] Ошибка сохранения', e);
            status.style.color = '#e74c3c';
            status.textContent = 'Не удалось сохранить — проверьте, что таблица product_costs создана.';
        }
    });

    async function loadHistory() {
        const list = document.getElementById('history-list');
        try {
            const { data, error } = await supabase
                .from('product_costs').select('*')
                .order('created_at', { ascending: false }).limit(15);
            if (error) throw error;
            list.innerHTML = (data || []).map(row => `
                <div class="history-row">
                    <span>${row.product_name} · ${new Date(row.created_at).toLocaleDateString()}</span>
                    <span>€${Number(row.retail_price).toFixed(2)}</span>
                </div>
            `).join('') || '<div style="font-size:11px; color:#666;">Пока пусто.</div>';
        } catch (e) {
            list.innerHTML = '<div style="font-size:11px; color:#666;">История недоступна.</div>';
        }
    }

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-office').addEventListener('click', () => window.location.href = 'office.html');

    renderItems();
    updateSummary();
    loadHistory();
</script>

</body>
</html>
