<!DOCTYPE html>
<!--
  verses.html — AI ZONE — v2.0.0 — 2026-10-28
  Коридор-серверная → комната с голограммами. Звук коридора — по сценарию (core/soundScenario.js):
  при входе в комнату плавно затихает. Фон комнаты — фотография на весь экран под основной картинкой.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>GY-GY Club — AI ZONE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="qrcode.min.js"></script>
    <style>
        :root { --gold: #d4af37; --orange: #ff7700; --orange-glow: rgba(255,119,0,.7); }
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        img { -webkit-user-drag: none !important; }
        html, body { width: 100%; height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0; }

        .ui-top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: linear-gradient(to bottom, rgba(0,0,0,.9) 0%, rgba(0,0,0,0) 100%); z-index: 999999; pointer-events: none; }
        .ui-top-bar > * { pointer-events: auto; }
        .nav-area { display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 900; user-select: none; }
        .back-arrow { color: var(--gold); cursor: pointer; transition: opacity .2s, transform .2s; }
        .back-arrow:hover { opacity: .8; transform: scale(1.1); }
        .bar-right-logo { font-size: 24px; letter-spacing: 5px; font-weight: bold; text-shadow: 0 0 5px #000; }
      
        /* паспорт (общий модуль modules/passport.js) */
        .gy-user-badge { position: fixed; top: 9px; left: 50%; transform: translateX(-50%); width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--gold); background: #111; z-index: 1000000; cursor: pointer; display: none; }
        .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; }
        .gy-user-badge .badge-flag { position: absolute; bottom: -2px; right: -4px; width: 17px; height: 12px; object-fit: cover; border: 1px solid var(--gold); }
        .gy-passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 2000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity .3s ease; }
        .gy-passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; max-width: 94vw; color: #000; text-align: center; position: relative; }
        .gy-passport-close { position: absolute; top: 10px; right: 14px; font-size: 28px; cursor: pointer; }
        .gy-passport-title { font-weight: 900; font-size: 16px; }
        .gy-passport-id { font-weight: 700; font-size: 13px; margin-top: 5px; color: #555; }
        .gy-passport-nick { font-weight: 700; font-size: 14px; margin-top: 4px; }
        .gy-passport-avatar-box, .gy-passport-qr-box { width: 90px; height: 90px; border: 2px solid var(--gold); background: #fff; margin: 8px auto; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .gy-passport-avatar { width: 100%; height: 100%; object-fit: cover; }
        .gy-passport-edit { margin-top: 14px; padding: 8px 20px; background: #000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; font-size: 11px; }

        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 10; padding-top: 60px; }

        /* коридор-серверная */
        #section-server { background: #000 url('banana_server_room.jpg') center/cover no-repeat; }
        .invisible-door-clicker { position: absolute; cursor: pointer; z-index: 50; width: 200px; height: 320px; top: 50%; left: 50%; transform: translate(-50%, -45%); }

        /* комната: фотография на весь экран (размытая, затемнённая) под основной картинкой */
        #room-bg { position: fixed; inset: 0; z-index: 5; display: none; background: url('OIG2_vintage_tv_room_v2(1).png') center/cover no-repeat; filter: blur(14px) brightness(.45); transform: scale(1.1); }
        #section-ai-room {
            background: transparent url('OIG2_vintage_tv_room_v2(1).png') center/contain no-repeat;
            width: 100%; max-width: 690px; max-height: 92vh; margin: auto; bottom: 0;
        }
        .holo-canvas { position: absolute; width: 100%; height: 60%; top: 45%; left: 0; z-index: 60; }
        .holo-click-label { position: absolute; font-size: 22px; font-weight: 900; letter-spacing: 2px; color: var(--orange); text-shadow: 0 0 12px var(--orange-glow), 0 0 25px var(--orange-glow); cursor: pointer; text-transform: uppercase; transition: all .3s ease; user-select: none; }
        /* вертикаль надписей: меньше % — выше, больше % — ниже */
        .pos-left   { top: -35%; left: 12%; }
        .pos-center { top: -10%; left: 50%; transform: translateX(-50%); }
        .pos-right  { top: -35%; right: 12%; }
              .holo-click-label.long { font-size: 15px; line-height: 1.2; text-align: center; max-width: 34%; letter-spacing: 1px; }
        .holo-click-label.locked { opacity: .4; }
        #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 1000001; background: rgba(0,0,0,.9); border: 1px solid var(--orange); color: var(--orange); padding: 10px 16px; font-size: 13px; text-align: center; max-width: 90vw; display: none; }
    </style>
</head>
<body>

<div class="ui-top-bar">
    <div class="nav-area" translate="no">
        <span class="back-arrow" id="btn-back" title="Back" data-translate-title="nav_back">&lt;</span>
        <span class="back-arrow" id="btn-home" title="Home" data-translate-title="nav_home">&lt;&lt;</span>
    </div>
    <div class="bar-right-logo" translate="no">GY-GY</div>
</div>
<div id="passport-badge-container"></div>

<div id="room-bg" aria-hidden="true"></div>

<div id="section-server" class="block" style="display:flex;">
    <div class="invisible-door-clicker" id="door"></div>
</div>

<div id="section-ai-room" class="block">
    <div class="holo-canvas" translate="no">
        <span id="lbl-et" class="holo-click-label pos-left">ET MESSAGE</span>
        <span id="lbl-lunar" class="holo-click-label pos-center">LUNAR BASE</span>
        <span id="lbl-hello" class="holo-click-label pos-right">HELLO UNIVERSE</span>
    </div>
</div>

<script type="module">
    import { init as initLocalization } from './core/localization.js';
    import { init as initPassport } from './modules/passport.js';
    import { fadeOutTrack, resumeTrack } from './modules/soundscape.js';

    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));

    const $ = id => document.getElementById(id);
    const server = $('section-server');
    const room = $('section-ai-room');
    const roomBg = $('room-bg');
    let inRoom = false;

    function enterRoom() {
        server.style.display = 'none';
        room.style.display = 'flex';
        roomBg.style.display = 'block';
        inRoom = true;
        fadeOutTrack(6);          // звук коридора постепенно затихает за 6 секунд
    }
    function backToServer() {
        room.style.display = 'none';
        roomBg.style.display = 'none';
        server.style.display = 'flex';
        inRoom = false;
        resumeTrack();            // в коридоре звук возвращается
    }

    $('door').addEventListener('click', () => setTimeout(enterRoom, 150));
    ['lbl-et', 'lbl-lunar', 'lbl-hello'].forEach(id => {
        $(id).addEventListener('click', () => console.log('Switched to tab: ' + id));
    });

    $('btn-back').addEventListener('click', () => {
        if (inRoom) backToServer();
        else window.location.href = 'hall.html';
    });
    $('btn-home').addEventListener('click', () => { window.location.href = 'index.html'; });
</script>
</body>
</html>
