
<!DOCTYPE html>
<!--
  accounting.html
  v1.0.0 — 2026-09-29
  Подблок Офиса. Пока два раздела-заглушки: Калькуляция затрат и
  Платёжный терминал — сами страницы cost-calculator.html и
  payment-terminal.html ещё предстоит построить (см. память проекта).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Accounting v1.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; min-height: 100%; background: #000; color: var(--gold);
        overflow-y: auto; font-family: 'Share Tech Mono', monospace;
    }
    .header-right { position: absolute; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .back-arrow:hover { opacity: 0.6; }
    .page-wrap { position: relative; min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; margin-bottom: 24px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .grid { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    .block-btn {
        background: #0a0a0a; border: 1px solid var(--gold-dim); color: var(--gold);
        padding: 18px; text-align: center; font-family: 'Cinzel', serif; font-size: 13px;
        font-weight: 700; cursor: pointer; text-decoration: none; display: block;
        transition: border-color 0.2s;
    }
    .block-btn:hover { border-color: var(--gold); }
    .block-btn small { display: block; margin-top: 4px; font-family: 'Share Tech Mono', monospace; font-size: 9px; opacity: 0.6; font-weight: 400; text-transform: none; }
</style>
</head>
<body>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-office">&lt;&lt;</a>
</div>

<div class="page-wrap">
    <div class="title">БУХГАЛТЕРИЯ</div>
    <div class="grid">
        <a class="block-btn" href="cost-calculator.html">
            КАЛЬКУЛЯЦИЯ ЗАТРАТ
            <small>Материалы, расходы, себестоимость → розничная цена</small>
        </a>
        <a class="block-btn" href="payment-terminal.html">
            ПЛАТЁЖНЫЙ ТЕРМИНАЛ
            <small>Приём оплаты, чек для получателя</small>
        </a>
    </div>
</div>

<script>
    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-office').addEventListener('click', () => window.location.href = 'office.html');
</script>

</body>
</html>
