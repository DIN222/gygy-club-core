<!DOCTYPE html>
<!-- expense.html — v2.0.0 — 2026-10-16 — Расход: три вида блоками + общий журнал -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Расход</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .page-wrap { min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-size: 20px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .grid { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
    .block-btn { background: #0a0a0a; border: 1px solid var(--gold-dim); color: var(--gold); padding: 16px; text-align: center; font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; text-decoration: none; display: block; }
    .block-btn:hover { border-color: var(--gold); }
    .block-btn small { display: block; margin-top: 4px; font-family: 'Share Tech Mono', monospace; font-size: 9px; opacity: 0.65; font-weight: 400; }
    .journal-wrap { width: 100%; max-width: 860px; margin-top: 30px; }
    .journal-heading { font-size: 10px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows"><a class="back-arrow" id="btn-back">&lt;</a><a class="back-arrow" id="btn-accounting">&lt;&lt;</a></div>
<div class="page-wrap">
    <div class="title">РАСХОД</div>
    <div class="grid">
        <a class="block-btn" href="expense-ledger.html?line=atelier">1. АТЕЛЬЕ<small id="sub-atelier">…</small></a>
        <a class="block-btn" href="expense-ledger.html?line=store">2. ЛАВКА ДРЕВНОСТЕЙ<small id="sub-store">…</small></a>
        <a class="block-btn" href="expense-ledger.html?line=souvenirs">3. СУВЕНИРЫ<small id="sub-souvenirs">…</small></a>
    </div>
    <div class="journal-wrap">
        <div class="journal-heading">Общий журнал расхода (Ателье, Лавка, Сувениры)</div>
        <div id="journal"></div>
    </div>
</div>
<script type="module">
    import { requireAuth } from './core/auth.js';
    import { supabase } from './core/supabase-init.js';
    import { renderExpenseJournal } from './modules/expenseJournal.js';

    const session = await requireAuth();
    if (!session) throw new Error('redirecting to login');

    const sums = { atelier: { n: 0, sum: 0 }, store: { n: 0, sum: 0 }, souvenirs: { n: 0, sum: 0 } };
    const { data } = await supabase.from('expense_entries').select('business_line, total_price, delivery_cost').limit(5000);
    (data || []).forEach(r => {
        const s = sums[r.business_line];
        if (s) { s.n++; s.sum += Number(r.total_price || 0) + Number(r.delivery_cost || 0); }
    });
    Object.keys(sums).forEach(k => {
        document.getElementById('sub-' + k).textContent = `${sums[k].n} записей · €${sums[k].sum.toFixed(2)}`;
    });

    renderExpenseJournal(document.getElementById('journal'), { line: null });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');
</script>
</body>
</html>
