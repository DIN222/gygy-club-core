<!DOCTYPE html>
<!--
  index.html — v2.0.0 — 2026-10-27
  Оболочка клуба. Страницы клуба открываются во вложенном окне (iframe), а звук (фон бара,
  кнопка 🔊/🔇, звук двери) живёт здесь и не прерывается при переходах между страницами.
  Вход (двери и приветствие) — entrance.html. Сценарий звука — core/soundScenario.js.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>GY-GY Club</title>
<link rel="icon" type="image/png" href="horse_coat.png">
<style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<iframe id="stage" title="GY-GY Club" allow="autoplay; clipboard-write; web-share; fullscreen; microphone"></iframe>

<script type="module">
    import { registerHost } from './modules/soundscape.js';

    let nested = false;
    try { nested = window.self !== window.top; } catch (e) { nested = true; }

    if (nested) {
        // эту страницу открыла страница клуба (кнопка «на вход»): оболочка внутри оболочки не нужна
        location.replace('entrance.html');
    } else {
        registerHost();
        const frame = document.getElementById('stage');

        const go = new URLSearchParams(location.search).get('go');
        const first = (go && /^[a-z0-9_-]+\.html$/i.test(go)) ? go : 'entrance.html';

        frame.addEventListener('load', () => {
            let win;
            try { win = frame.contentWindow; } catch (e) { return; }
            try {
                const name = (win.location.pathname.split('/').pop() || 'entrance.html');
                window.GY_SOUND.applyForPage(name);
                document.title = win.document.title || 'GY-GY Club';
            } catch (e) { /* страница ещё не готова */ }
            // касание внутри вложенного окна даёт оболочке право запустить звук
            ['click', 'touchstart', 'keydown'].forEach(ev => {
                try { win.addEventListener(ev, () => window.GY_SOUND.kick(), { passive: true }); } catch (e) { /* ок */ }
            });
        });

        frame.src = first;
    }
</script>
</body>
</html>
