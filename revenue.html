<!DOCTYPE html>
<!--
  revenue.html
  v1.0.0 — 2026-10-01
  Доход = сумма Прихода минус сумма Расхода. Считается на лету из уже
  существующих таблиц, без собственного хранения.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Доход v1.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); overflow-y: auto; font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .back-arrow:hover { opacity: 0.6; }
    .page-wrap { position: relative; min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .panel { width: 100%; max-width: 480px; }
    .line-card { background: #0a0a0a; border: 1px solid var(--gold-dim); padding: 14px; margin-bottom: 10px; }
    .line-card h3 { font-family: 'Cinzel', serif; font-size: 13px; margin-bottom: 8px; }
    .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ivory); padding: 2px 0; }
    .row.profit { color: var(--gold); font-weight: 900; font-size: 15px; border-top: 1px solid var(--gold-dim); margin-top: 6px; padding-top: 6px; }
    .row.profit.negative { color: #e74c3c; }
</style>
</head>
<body>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-accounting">&lt;&lt;</a>
</div>

<div class="page-wrap">
    <div class="title">ДОХОД</div>
    <div class="panel" id="panel"></div>
</div>

<script type="module">
    import { supabase } from './core/supabase-init.js';

    const LINES = [
        { key: 'atelier', label: 'Ателье' },
        { key: 'store', label: 'Лавка древностей' },
        { key: 'souvenirs', label: 'Сувениры' }
    ];

    async function render() {
        const { data: income } = await supabase.from('income_entries').select('business_line, total_amount');
        const { data: expense } = await supabase.from('expense_entries').select('business_line, total_price, delivery_cost');

        const panel = document.getElementById('panel');
        let grandIncome = 0, grandExpense = 0;
        panel.innerHTML = LINES.map(line => {
            const inc = (income || []).filter(r => r.business_line === line.key).reduce((s, r) => s + Number(r.total_amount || 0), 0);
            const exp = (expense || []).filter(r => r.business_line === line.key).reduce((s, r) => s + Number(r.total_price || 0) + Number(r.delivery_cost || 0), 0);
            grandIncome += inc; grandExpense += exp;
            const profit = inc - exp;
            return `
                <div class="line-card">
                    <h3>${line.label}</h3>
                    <div class="row"><span>Приход</span><span>€${inc.toFixed(2)}</span></div>
                    <div class="row"><span>Расход</span><span>€${exp.toFixed(2)}</span></div>
                    <div class="row profit ${profit < 0 ? 'negative' : ''}"><span>Доход</span><span>€${profit.toFixed(2)}</span></div>
                </div>`;
        }).join('') + `
            <div class="line-card" style="border-color: var(--gold);">
                <h3>ВСЕГО ПО КЛУБУ</h3>
                <div class="row"><span>Приход</span><span>€${grandIncome.toFixed(2)}</span></div>
                <div class="row"><span>Расход</span><span>€${grandExpense.toFixed(2)}</span></div>
                <div class="row profit ${(grandIncome-grandExpense) < 0 ? 'negative' : ''}"><span>Доход</span><span>€${(grandIncome-grandExpense).toFixed(2)}</span></div>
            </div>`;
    }

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');

    render();
</script>

</body>
</html>
