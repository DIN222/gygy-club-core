<!DOCTYPE html>
<!-- space-prints-admin.html — v1.0.0 — 2026-11-02 — Бухгалтерия → Галерея → Космос (временная страница, пока категория не встроена в «Принты клуба») -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Галерея: Космос</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .page-wrap { min-height: 100vh; padding: 70px 16px 60px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-size: 20px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .help { max-width: 760px; font-size: 11px; color: #9a9a8a; line-height: 1.6; margin-bottom: 14px; text-align: center; }
    .panel { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 14px; }
    .box { border: 1px solid var(--gold-dim); background: #0a0a0a; padding: 12px; }
    .h { font-family: 'Cinzel', serif; font-size: 14px; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
    input[type="file"] { color: var(--ivory); font-family: inherit; font-size: 11px; }
    select { padding: 7px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .btn { background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 7px 12px; font-size: 11px; cursor: pointer; font-family: inherit; text-transform: uppercase; }
    .btn:hover { border-color: var(--gold); }
    .btn.primary { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 900; }
    .btn.del:hover { color: #e74c3c; border-color: #e74c3c; }
    .btn.on { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 900; }
    .status { font-size: 11px; color: var(--ivory); min-height: 15px; }
    .status.error { color: #e74c3c; } .status.ok { color: #6fd48a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { border: 1px solid var(--gold-dim); background: #0a0a0a; padding: 6px; display: flex; flex-direction: column; gap: 6px; }
    .thumb { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: repeating-conic-gradient(#5a5a5a 0% 25%, #8a8a8a 0% 50%) 50% / 12px 12px; }
    .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows"><a class="back-arrow" id="btn-back">&lt;</a><a class="back-arrow" id="btn-accounting">&lt;&lt;</a></div>

<div class="page-wrap">
    <div class="title">ГАЛЕРЕЯ: КОСМОС</div>
    <div class="help">Принты этой категории видны в Ателье «Конь в скафандре» на Луне. Загружайте PNG с вырезанным фоном. «Подложка» нужна, если принт плохо виден на шахматном фоне ленты.</div>
    <div class="panel">
        <div class="box">
            <div class="h">Добавить принт</div>
            <div class="row"><input type="file" id="file" accept="image/*"></div>
            <div class="row">
                <select id="bg">
                    <option value="">Подложка: нет</option>
                    <option value="dark">Тёмная подложка</option>
                    <option value="light">Светлая подложка</option>
                </select>
                <button class="btn primary" id="btn-add" type="button">Загрузить и выставить</button>
                <span class="status" id="add-status"></span>
            </div>
        </div>
        <div class="box">
            <div class="h">Принты «Космос»</div>
            <div class="status" id="list-status"></div>
            <div class="grid" id="grid"></div>
        </div>
    </div>
</div>

<script type="module">
    import { requireAuth } from './core/auth.js';
    import { supabase } from './core/supabase-init.js';

    const session = await requireAuth();
    if (!session) throw new Error('redirecting to login');

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const setStatus = (el, text, cls) => { el.textContent = text; el.className = 'status' + (cls ? ' ' + cls : ''); };
    const safeHttps = (u) => /^https:\/\/\S+$/i.test(String(u || '').trim()) ? String(u).trim() : '';

    function toPng(file, maxDim = 1200) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Файл не похож на изображение')); };
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    const r = Math.min(maxDim / width, maxDim / height);
                    width = Math.round(width * r); height = Math.round(height * r);
                }
                const c = document.createElement('canvas');
                c.width = width; c.height = height;
                c.getContext('2d').drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(url);
                c.toBlob(b => b ? resolve(b) : reject(new Error('Не удалось сохранить изображение')), 'image/png');
            };
            img.src = url;
        });
    }

    $('btn-add').addEventListener('click', async () => {
        const st = $('add-status');
        const f = $('file').files[0];
        if (!f) { setStatus(st, 'Выберите файл.', 'error'); return; }
        setStatus(st, 'Загружаю…');
        try {
            const blob = await toPng(f);
            const path = `space/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.png`;
            const { error: upErr } = await supabase.storage.from('club-prints').upload(path, blob, { contentType: 'image/png' });
            if (upErr) throw new Error('файл не загрузился: ' + upErr.message);
            const image_url = supabase.storage.from('club-prints').getPublicUrl(path).data.publicUrl;
            const { error } = await supabase.from('club_prints').insert({
                category: 'space', image_url, storage_path: path,
                from_user_id: 'office', from_user_name: 'GY-GY', public_likes_allowed: false,
                published: true, bg: $('bg').value || null
            });
            if (error) {
                await supabase.storage.from('club-prints').remove([path]);
                throw new Error('запись не создалась: ' + error.message);
            }
            $('file').value = '';
            setStatus(st, 'Принт добавлен и выставлен.', 'ok');
            load();
        } catch (e) {
            setStatus(st, 'Ошибка: ' + (e.message || e), 'error');
        }
    });

    async function load() {
        const { data, error } = await supabase.from('club_prints')
            .select('id, image_url, storage_path, published, bg').eq('category', 'space').order('added_at', { ascending: false });
        if (error) { setStatus($('list-status'), 'Не удалось загрузить: ' + error.message, 'error'); return; }
        setStatus($('list-status'), `Принтов: ${(data || []).length}`);
        $('grid').innerHTML = (data || []).map(p => {
            const bg = p.bg === 'light' ? 'background:#ececec' : (p.bg === 'dark' ? 'background:#151515' : '');
            return `<div class="card" data-id="${esc(p.id)}" data-path="${esc(p.storage_path || '')}">
                <div class="thumb" style="${bg}"><img src="${esc(safeHttps(p.image_url))}" alt="" loading="lazy"></div>
                <button class="btn${p.published ? ' on' : ''}" data-pub type="button">${p.published ? 'На витрине' : 'Скрыт'}</button>
                <button class="btn del" data-del type="button">Удалить</button>
            </div>`;
        }).join('');
    }

    $('grid').addEventListener('click', async (e) => {
        const card = e.target.closest('.card');
        if (!card) return;
        const id = card.dataset.id;
        if (e.target.closest('[data-pub]')) {
            const on = !e.target.closest('[data-pub]').classList.contains('on');
            const { error } = await supabase.from('club_prints').update({ published: on }).eq('id', id);
            if (error) { alert('Ошибка: ' + error.message); return; }
            load();
        }
        if (e.target.closest('[data-del]')) {
            if (!confirm('Удалить принт насовсем?')) return;
            const { error } = await supabase.from('club_prints').delete().eq('id', id);
            if (error) { alert('Ошибка: ' + error.message); return; }
            if (card.dataset.path) await supabase.storage.from('club-prints').remove([card.dataset.path]);
            card.remove();
        }
    });

    $('btn-back').addEventListener('click', () => history.back());
    $('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');
    load();
</script>
</body>
</html>
