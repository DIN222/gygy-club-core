<!DOCTYPE html>
<!--
  suppliers.html — v4.0.0 — 2026-10-19
  Поставщики: 10 слотов + заказы поставщику (ручное заполнение).
  Позиция заказа: тип (Материал / Ткань / Бланк) и характеристики отдельными полями:
  размер, цвет, состав, плотность, ширина рулона.
  Бланк определяется: изделие + размер + цвет + состав + плотность (как в заказе Ателье).
  «Принять на склад» вызывает функцию receive_supplier_order в базе.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Поставщики</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .page-wrap { min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-size: 22px; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .hint { font-size: 10px; color: var(--ivory); opacity: 0.65; margin-bottom: 14px; text-align: center; max-width: 520px; line-height: 1.5; }
    .panel { width: 100%; max-width: 680px; }

    /* традиционные ссылки: синие, подчёркнутые */
    .lnk { color: #4da3ff; text-decoration: underline; word-break: break-all; }
    .lnk:hover { color: #7dbcff; }

    details.slot { border: 1px solid var(--gold-dim); background: #0a0a0a; margin-bottom: 8px; }
    details.slot > summary { list-style: none; cursor: pointer; padding: 11px 10px; display: flex; gap: 10px; align-items: baseline; font-size: 12px; }
    details.slot > summary::-webkit-details-marker { display: none; }
    details.slot[open] > summary { border-bottom: 1px solid var(--gold-dim); }
    .s-n { color: var(--gold-dim); font-weight: 900; min-width: 22px; }
    .s-title { color: var(--gold); font-weight: 700; }
    .s-title.empty { color: #666; font-weight: 400; }
    .s-sub { color: var(--ivory); opacity: 0.7; font-size: 10px; margin-left: auto; text-align: right; }

    /* блок данных поставщика — выделен */
    .sup-block { margin: 10px; background: #1b1608; border: 1px solid var(--gold); border-left: 5px solid var(--gold); }
    .sup-head { padding: 6px 10px; font-size: 10px; font-weight: 900; letter-spacing: 2px; color: #000; background: var(--gold); text-transform: uppercase; }

    .fields, .ord-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .fields { padding: 10px; }
    .fields label, .ord-fields label, .fields-note label { display: block; font-size: 9px; color: #9a9a8a; margin-bottom: 2px; text-transform: uppercase; }
    .fields input, .fields textarea, .ord-fields input, .ord-fields select, .fields-note textarea, table.items input, table.items select {
        width: 100%; padding: 7px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px;
    }
    .fields .wide { grid-column: 1 / -1; }
    .fields .lnk, .src-links .lnk { font-size: 10px; }
    .fields .lnk { display: inline-block; margin-top: 4px; }
    .bar { padding: 0 10px 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn-save { background: var(--gold); color: #000; border: 1px solid var(--gold); padding: 8px 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; font-family: inherit; font-size: 11px; }
    .btn-release { background: #000; color: #9a9a8a; border: 1px solid #333; padding: 7px 12px; cursor: pointer; font-family: inherit; font-size: 10px; }
    .btn-release:hover { color: #e74c3c; border-color: #e74c3c; }
    .status, .ord-status { font-size: 11px; color: var(--ivory); }
    .status.ok, .ord-status.ok { color: #6fd48a; }
    .status.error, .ord-status.error { color: #e74c3c; }
    .error-note { font-size: 11px; color: #e74c3c; text-align: center; margin: 12px 0; }

    .orders { margin: 0 10px 10px; border-top: 1px dashed var(--gold-dim); padding-top: 10px; }
    .orders-h { font-size: 10px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .orders-note { font-size: 10px; color: #777; margin-bottom: 8px; }
    details.ord { border: 1px solid #333; background: #060606; margin-bottom: 6px; }
    details.ord > summary { list-style: none; cursor: pointer; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 11px; color: var(--ivory); }
    details.ord > summary::-webkit-details-marker { display: none; }
    details.ord[open] > summary { border-bottom: 1px solid #333; }
    .o-ref { color: var(--gold); font-weight: 700; }
    .o-sum { margin-left: auto; color: var(--gold); font-weight: 900; }
    .chip { border: 1px solid var(--gold-dim); padding: 2px 6px; font-size: 9px; text-transform: uppercase; }
    .chip.ok { border-color: #6fd48a; color: #6fd48a; }
    .chip.warn { border-color: #e0a030; color: #e0a030; }
    .chip.dim { border-color: #555; color: #777; }
    .ord-body { padding: 8px; }
    .ro-line { font-size: 11px; color: var(--ivory); padding: 2px 0; }
    .src-links { margin-top: 4px; font-size: 10px; color: #9a9a8a; line-height: 1.6; }

    .items-scroll { overflow-x: auto; }
    table.items { width: 100%; min-width: 800px; border-collapse: collapse; margin: 8px 0 4px; }
    table.items th { font-size: 9px; text-align: left; color: #9a9a8a; padding: 2px 3px; text-transform: uppercase; }
    table.items td { padding: 2px 3px; }
    table.items input, table.items select { padding: 5px 4px; font-size: 10px; }
    table.items td:nth-child(1) { width: 78px; }
    table.items td:nth-child(2) { min-width: 130px; }
    table.items td:nth-child(3) { width: 56px; }
    table.items td:nth-child(4) { width: 78px; }
    table.items td:nth-child(5) { width: 118px; }
    table.items td:nth-child(6) { width: 78px; }
    table.items td:nth-child(7) { width: 72px; }
    table.items td:nth-child(8) { width: 60px; }
    table.items td:nth-child(9) { width: 46px; }
    table.items td:nth-child(10) { width: 64px; }
    table.items td:nth-child(11) { width: 26px; }
    .fields-note { margin-top: 8px; }
    .fields-note textarea { resize: vertical; }
    .ord-totals { font-size: 11px; color: var(--gold); margin: 8px 0; }
    .ord-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
    .btn-mini { background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 6px 10px; font-size: 10px; cursor: pointer; font-family: inherit; }
    .btn-mini:hover { border-color: var(--gold); }
    .btn-mini.primary { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 900; }
    .btn-mini:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-x { background: #000; color: #9a9a8a; border: 1px solid #333; width: 24px; height: 24px; cursor: pointer; }
    .btn-new-order { margin-top: 4px; }
    .items-hint { font-size: 9px; color: #8a8a7a; line-height: 1.5; margin-top: 4px; }
    @media (max-width: 600px) { .fields, .ord-fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows"><a class="back-arrow" id="btn-back">&lt;</a><a class="back-arrow" id="btn-accounting">&lt;&lt;</a></div>
<datalist id="wh-names"></datalist>
<datalist id="dl-colors"><option value="Чёрный"></option><option value="Белый"></option></datalist>
<datalist id="dl-density"><option value="160-180"></option><option value="180-200"></option><option value="220-240"></option><option value="280-320"></option></datalist>

<div class="page-wrap">
    <div class="title">ПОСТАВЩИКИ</div>
    <div class="hint">10 слотов. Название слота — что поставляет (например, «Ткани»). Нажмите на слот, чтобы заполнить карточку и вести заказы поставщику; всё можно менять по факту.</div>
    <div class="panel">
        <div class="error-note" id="error-note" style="display:none;"></div>
        <div id="slots"></div>
    </div>
</div>

<script type="module">
    import { requireAuth } from './core/auth.js';
    import { supabase } from './core/supabase-init.js';

    const session = await requireAuth();
    if (!session) throw new Error('redirecting to login');

    const SLOT_COUNT = 10;
    const PLACEHOLDERS = { 1: 'напр. Ткани', 2: 'напр. Бланки футболок', 3: 'напр. DTF-плёнка' };
    const SOURCES = ['Сайт', 'Мессенджер', 'Соцсеть', 'Телефон', 'Почта', 'Другое'];
    const STATUS_LABEL = { ordered: 'заказан', received: 'принят на склад', cancelled: 'отменён' };
    const STATUS_CLASS = { ordered: 'warn', received: 'ok', cancelled: 'dim' };

    const KINDS = [['material', 'Материал'], ['fabric', 'Ткань'], ['blank', 'Бланк']];
    const SIZES = ['S', 'M', 'L', 'XL', 'XXL'];
    const COMPS = [['cotton100', '100% COTTON'], ['stretch', 'STRETCH 95/5'],
                   ['cotton80poly20', '80% COTTON / 20% POLY'], ['cotton100fleece', '100% COTTON FLEECE']];
    const GARMENT_RU = { tshirt: 'Футболка', hoodie: 'Худи', longsleeve: 'Лонгслив' };

    let rows = [];
    let orders = [];
    const openSlots = new Set();
    const openOrders = new Set();

    const eur = (n) => `€${Number(n || 0).toFixed(2)}`;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function safeUrl(u) {
        if (!u) return '';
        const t = String(u).trim();
        const full = /^https?:\/\//i.test(t) ? t : 'https://' + t;
        return /^https?:\/\/[^\s]+$/i.test(full) ? full : '';
    }
    function messengerLink(m) {
        return /^(https?:\/\/|t\.me\/|wa\.me\/)/i.test((m || '').trim()) ? safeUrl(m) : '';
    }
    function linkText(u) {
        const t = u.replace(/^https?:\/\//i, '').replace(/\/$/, '');
        return t.length > 48 ? t.slice(0, 47) + '…' : t;
    }
    function linkHtml(url) {
        return url ? `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(linkText(url))}</a>` : '';
    }
    // Сайт и мессенджер поставщика — для поля «Откуда информация» в заказе
    function sourceLinks(sup) {
        const parts = [];
        const site = safeUrl(sup.website);
        const msg = messengerLink(sup.messenger);
        if (site) parts.push('Сайт: ' + linkHtml(site));
        if (msg) parts.push('Мессенджер: ' + linkHtml(msg));
        else if (sup.messenger) parts.push('Мессенджер: ' + esc(sup.messenger));
        return parts.length ? `<div class="src-links">${parts.join('<br>')}</div>` : '';
    }

    // ---------- нормализация характеристик ----------
    const colorLabel = (c) => c === 'black' ? 'Чёрный' : (c === 'white' ? 'Белый' : (c || ''));
    function normColor(s) {
        const t = String(s || '').trim().toLowerCase();
        if (['чёрный', 'черный', 'черн', 'black'].includes(t)) return 'black';
        if (['белый', 'бел', 'white'].includes(t)) return 'white';
        return String(s || '').trim();
    }
    function normDensity(s) {
        return String(s || '').replace(/g\s*\/?\s*m\s*²?/ig, '').replace(/[–—\/]/g, '-').replace(/\s+/g, '').trim();
    }
    function garmentFromName(name) {
        const t = String(name || '').toLowerCase();
        if (t.includes('футбол')) return 'tshirt';
        if (t.includes('худи')) return 'hoodie';
        if (t.includes('лонгслив')) return 'longsleeve';
        return null;
    }
    function itemTitle(i) {
        const compLabel = (COMPS.find(c => c[0] === i.composition) || [])[1];
        if (i.kind === 'blank') {
            return ['Бланк', GARMENT_RU[i.garment] || i.item_name, i.size, colorLabel(i.color), compLabel, i.density].filter(Boolean).join(', ');
        }
        return [i.item_name, colorLabel(i.color), compLabel, i.roll_width, i.density].filter(Boolean).join(', ');
    }

    // ---------- заказы ----------
    function itemRowHtml(it = {}) {
        const kind = it.kind || 'material';
        const opt = (list, cur) => list.map(([v, l]) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`).join('');
        return `<tr class="item-row">
            <td><select data-i="kind">${opt(KINDS, kind)}</select></td>
            <td><input type="text" list="wh-names" data-i="item_name" placeholder="Название / Футболка" value="${esc(it.item_name || '')}"></td>
            <td><select data-i="size"><option value=""></option>${SIZES.map(s => `<option${it.size === s ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
            <td><input type="text" list="dl-colors" data-i="color" placeholder="чёрный" value="${esc(colorLabel(it.color))}"></td>
            <td><select data-i="composition"><option value=""></option>${opt(COMPS, it.composition)}</select></td>
            <td><input type="text" list="dl-density" data-i="density" placeholder="160-180" value="${esc(it.density || '')}"></td>
            <td><input type="text" data-i="roll_width" placeholder="180 см" value="${esc(it.roll_width || '')}"></td>
            <td><input type="number" step="0.01" min="0" data-i="quantity" value="${it.quantity ?? ''}"></td>
            <td><input type="text" data-i="unit" value="${esc(it.unit || 'шт')}"></td>
            <td><input type="number" step="0.01" min="0" data-i="unit_price" value="${it.unit_price ?? ''}"></td>
            <td><button type="button" class="btn-x btn-del-item">✕</button></td>
        </tr>`;
    }

    function orderHtml(o, sup) {
        const items = o.supplier_order_items || [];
        const goods = items.reduce((s, i) => s + Number(i.quantity) * Number(i.unit_price), 0);
        const total = goods + Number(o.delivery_cost || 0);
        const label = o.reference ? o.reference : '№' + String(o.id).slice(0, 6);
        const open = openOrders.has(o.id) ? ' open' : '';
        const head = `<summary>
            <span class="o-ref">${esc(label)}</span><span>${esc(o.order_date)}</span>
            <span class="chip ${STATUS_CLASS[o.status] || 'dim'}">${STATUS_LABEL[o.status] || esc(o.status)}</span>
            <span class="o-sum">${eur(total)}</span></summary>`;

        if (o.status !== 'ordered') {
            return `<details class="ord" data-oid="${esc(o.id)}"${open}>${head}<div class="ord-body">
                ${items.map(i => `<div class="ro-line">${esc(itemTitle(i))} — ${Number(i.quantity)} ${esc(i.unit)} × ${eur(i.unit_price)}</div>`).join('')}
                <div class="ro-line">Доставка: ${eur(o.delivery_cost)}</div>
                ${o.received_date ? `<div class="ro-line">Принят: ${esc(o.received_date)}</div>` : ''}
                               ${o.source ? `<div class="ro-line">Источник: ${esc(o.source)}</div>` : ''}
                ${sourceLinks(sup)}
                <div class="src-links"><a class="lnk" href="product-photos.html?order=${esc(o.id)}">Фото товара этого заказа (галерея) →</a></div>
                ${o.note ? `<div class="ro-line">Заметка: ${esc(o.note)}</div>` : ''}
                <div class="ord-bar">${o.status === 'cancelled' ? '<button class="btn-mini btn-delete-order" type="button">Удалить</button>' : ''}<span class="ord-status"></span></div>
            </div></details>`;
        }

        return `<details class="ord" data-oid="${esc(o.id)}"${open}>${head}<div class="ord-body">
            <div class="ord-fields">
                <div><label>Дата заказа</label><input type="date" data-of="order_date" value="${esc(o.order_date)}"></div>
                <div><label>№ заказа / счёта у поставщика</label><input type="text" data-of="reference" value="${esc(o.reference || '')}"></div>
                <div><label>Откуда информация</label>
                    <select data-of="source"><option value=""></option>${SOURCES.map(s => `<option${o.source === s ? ' selected' : ''}>${s}</option>`).join('')}</select>
                    ${sourceLinks(sup)}
                </div>
                <div><label>Доставка, €</label><input type="number" step="0.01" min="0" data-of="delivery_cost" value="${Number(o.delivery_cost || 0)}"></div>
            </div>
            <div class="items-scroll"><table class="items">
                <thead><tr><th>Тип</th><th>Позиция</th><th>Размер</th><th>Цвет</th><th>Состав</th><th>Плотность</th><th>Ширина</th><th>Кол-во</th><th>Ед.</th><th>Цена, €</th><th></th></tr></thead>
                <tbody>${items.map(itemRowHtml).join('') || itemRowHtml()}</tbody>
            </table></div>
            <div class="items-hint">Бланк: в «Позиции» напишите «Футболка», «Худи» или «Лонгслив»; обязательны размер, цвет (чёрный/белый), состав и плотность. Ткань: название, состав, цвет, плотность, ширина рулона; единица — м. Материал: только название (нитки, лента и т.д.).</div>
                        <div class="src-links"><a class="lnk" href="product-photos.html?order=${esc(o.id)}">Фото товара этого заказа (галерея) →</a></div>
            <button class="btn-mini btn-add-item" type="button">+ позиция</button>
            <div class="fields-note"><label>Заметка</label><textarea rows="2" data-of="note">${esc(o.note || '')}</textarea></div>
            <div class="ord-totals">Товары ${eur(goods)} + доставка ${eur(o.delivery_cost)} = ${eur(total)}</div>
            <div class="ord-bar">
                <button class="btn-mini btn-save-order" type="button">Сохранить заказ</button>
                <button class="btn-mini primary btn-receive" type="button">Принять на склад</button>
                <button class="btn-mini btn-cancel-order" type="button">Отменить заказ</button>
                <button class="btn-mini btn-delete-order" type="button">Удалить</button>
                <span class="ord-status"></span>
            </div>
        </div></details>`;
    }

    function ordersHtml(r) {
        if (!r.id) return `<div class="orders"><div class="orders-note">Чтобы вести заказы, сначала сохраните карточку поставщика.</div></div>`;
        const list = orders.filter(o => o.supplier_id === r.id);
        return `<div class="orders">
            <div class="orders-h">Заказы поставщику</div>
            ${list.map(o => orderHtml(o, r)).join('') || '<div class="orders-note">Заказов пока нет.</div>'}
            <button class="btn-mini btn-new-order" type="button">+ Новый заказ</button>
        </div>`;
    }

    function recalc(card) {
        let goods = 0;
        card.querySelectorAll('tr.item-row').forEach(tr => {
            const q = Number(tr.querySelector('[data-i="quantity"]').value) || 0;
            const p = Number(tr.querySelector('[data-i="unit_price"]').value) || 0;
            goods += q * p;
        });
        const delEl = card.querySelector('[data-of="delivery_cost"]');
        const del = delEl ? (Number(delEl.value) || 0) : 0;
        const el = card.querySelector('.ord-totals');
        if (el) el.textContent = `Товары ${eur(goods)} + доставка ${eur(del)} = ${eur(goods + del)}`;
    }

    function readOrder(card) {
        const header = {};
        card.querySelectorAll('[data-of]').forEach(el => {
            const k = el.dataset.of;
            let v = el.value.trim();
            if (k === 'delivery_cost') v = v === '' ? 0 : Number(v);
            else if (k === 'order_date') v = v || new Date().toISOString().slice(0, 10);
            else v = v === '' ? null : v;
            header[k] = v;
        });
        const items = [];
        card.querySelectorAll('tr.item-row').forEach(tr => {
            const g = (f) => tr.querySelector(`[data-i="${f}"]`).value.trim();
            const name = g('item_name');
            if (!name) return;
            const qty = Number(g('quantity'));
            if (!(qty > 0)) throw new Error(`У позиции «${name}» не указано количество`);
            const kind = g('kind') || 'material';
            const item = {
                kind, item_name: name, quantity: qty, unit: g('unit') || 'шт', unit_price: Number(g('unit_price')) || 0,
                garment: null, size: g('size') || null, color: normColor(g('color')) || null,
                composition: g('composition') || null, density: normDensity(g('density')) || null,
                roll_width: g('roll_width') || null
            };
            if (kind === 'blank') {
                item.garment = garmentFromName(name);
                const miss = [];
                if (!item.garment) miss.push('изделие (в названии: Футболка, Худи или Лонгслив)');
                if (!item.size) miss.push('размер');
                if (!item.color) miss.push('цвет');
                if (!item.composition) miss.push('состав');
                if (!item.density) miss.push('плотность');
                if (miss.length) throw new Error(`Бланк «${name}»: укажите ${miss.join(', ')}`);
                if (item.color !== 'black' && item.color !== 'white') throw new Error(`Бланк «${name}»: цвет должен быть чёрный или белый`);
            }
            items.push(item);
        });
        return { header, items };
    }

    async function saveOrderData(card, o) {
        const { header, items } = readOrder(card);
        const { data, error } = await supabase.from('supplier_orders')
            .update(header).eq('id', o.id).eq('status', 'ordered').select('id');
        if (error || !data || !data.length) throw new Error(error ? error.message : 'Заказ уже не в статусе «заказан»');
        const oldIds = (o.supplier_order_items || []).map(i => i.id);
        if (items.length) {
            const { error: e2 } = await supabase.from('supplier_order_items').insert(items.map(i => ({ ...i, order_id: o.id })));
            if (e2) throw new Error(e2.message);
        }
        if (oldIds.length) {
            const { error: e3 } = await supabase.from('supplier_order_items').delete().in('id', oldIds);
            if (e3) throw new Error(e3.message);
        }
    }

    // ---------- слоты ----------
    function slotHtml(n) {
        const r = rows.find(x => x.slot === n) || {};
        const title = r.slot_title || '';
        const supplierName = r.name && r.name !== title ? r.name : '';
        const sub = [supplierName, r.phone].filter(Boolean).join(' · ');
        const site = safeUrl(r.website);
        const msg = messengerLink(r.messenger);
        return `
        <details class="slot" data-slot="${n}"${openSlots.has(n) ? ' open' : ''}>
            <summary>
                <span class="s-n">${n}</span>
                <span class="s-title${title ? '' : ' empty'}">${title ? esc(title) : '— свободно —'}</span>
                <span class="s-sub">${esc(sub)}</span>
            </summary>
            <div class="sup-block">
                <div class="sup-head">Поставщик</div>
                <div class="fields">
                    <div class="wide"><label>Что поставляет (название слота)</label><input type="text" data-f="slot_title" placeholder="${esc(PLACEHOLDERS[n] || 'что поставляет')}" value="${esc(title)}"></div>
                    <div><label>Наименование поставщика</label><input type="text" data-f="name" value="${esc(supplierName)}"></div>
                    <div><label>Контактное лицо</label><input type="text" data-f="contact_person" value="${esc(r.contact_person || '')}"></div>
                    <div><label>Телефон</label><input type="tel" data-f="phone" value="${esc(r.phone || '')}"></div>
                    <div>
                        <label>Сайт (ссылка)</label><input type="text" data-f="website" value="${esc(r.website || '')}">
                        ${linkHtml(site)}
                    </div>
                    <div class="wide">
                        <label>Мессенджер / соцсеть (ссылка или @ник) — если сайта нет</label>
                        <input type="text" data-f="messenger" value="${esc(r.messenger || '')}">
                        ${linkHtml(msg)}
                    </div>
                    <div class="wide"><label>Заметки (условия, сроки, минимальная партия)</label><textarea rows="3" data-f="notes">${esc(r.notes || '')}</textarea></div>
                </div>
                <div class="bar">
                    <button class="btn-save" type="button">Сохранить</button>
                    ${r.id ? '<button class="btn-release" type="button">Освободить слот</button>' : ''}
                    <span class="status"></span>
                </div>
            </div>
            ${ordersHtml(r)}
        </details>`;
    }

    const slotsEl = document.getElementById('slots');

    function render() {
        let html = '';
        for (let n = 1; n <= SLOT_COUNT; n++) html += slotHtml(n);
        slotsEl.innerHTML = html;
    }
    function renderSlot(n) {
        const old = slotsEl.querySelector(`details.slot[data-slot="${n}"]`);
        const tmp = document.createElement('div');
        tmp.innerHTML = slotHtml(n);
        const fresh = tmp.firstElementChild;
        if (old) old.replaceWith(fresh); else slotsEl.appendChild(fresh);
        return fresh;
    }

    function showError(text) {
        const note = document.getElementById('error-note');
        note.style.display = text ? 'block' : 'none';
        note.textContent = text || '';
    }

    async function loadSuppliers() {
        const { data, error } = await supabase.from('suppliers').select('*');
        if (error) { console.error(error); showError('Не удалось загрузить поставщиков: ' + (error.message || '') + ' — проверьте, что SQL выполнен.'); rows = []; }
        else rows = data || [];
    }
    async function loadOrders() {
        const { data, error } = await supabase.from('supplier_orders')
            .select('*, supplier_order_items(*)').order('order_date', { ascending: false });
        if (error) { console.error(error); showError('Заказы недоступны: ' + (error.message || '') + ' — проверьте, что SQL выполнен.'); orders = []; }
        else orders = data || [];
    }
    async function loadNames() {
        const names = new Set();
        try {
            const { data } = await supabase.from('warehouse_stock').select('item_name, kind').eq('item_type', 'raw_material');
            (data || []).filter(r => r.kind !== 'blank').forEach(r => names.add(String(r.item_name).split(',')[0]));
        } catch (e) { /* подсказки необязательны */ }
        ['Футболка', 'Худи', 'Лонгслив'].forEach(n => names.add(n));
        document.getElementById('wh-names').innerHTML = [...names].map(n => `<option value="${esc(n)}"></option>`).join('');
    }

    // запоминаем раскрытые слоты и заказы, чтобы перерисовка их не сворачивала
    slotsEl.addEventListener('toggle', (e) => {
        const el = e.target;
        if (!el.classList) return;
        if (el.classList.contains('slot')) {
            const n = Number(el.dataset.slot);
            if (el.open) openSlots.add(n); else openSlots.delete(n);
        } else if (el.classList.contains('ord')) {
            if (el.open) openOrders.add(el.dataset.oid); else openOrders.delete(el.dataset.oid);
        }
    }, true);

    slotsEl.addEventListener('input', (e) => {
        const card = e.target.closest('details.ord');
        if (card) recalc(card);
    });

    function setStatus(card, text, cls) {
        const st = card.querySelector('.status');
        if (!st) return;
        st.className = 'status' + (cls ? ' ' + cls : '');
        st.textContent = text;
    }
    function flashOrder(oid, text, cls) {
        const st = slotsEl.querySelector(`details.ord[data-oid="${oid}"] .ord-status`);
        if (st) { st.className = 'ord-status' + (cls ? ' ' + cls : ''); st.textContent = text; }
    }

    async function handleOrderClick(e, ordCard, n) {
        const btn = e.target.closest('button');
        if (!btn) return;
        const oid = ordCard.dataset.oid;
        const o = orders.find(x => x.id === oid);
        if (!o) return;
        const setSt = (t, cls) => {
            const st = ordCard.querySelector('.ord-status');
            if (st) { st.className = 'ord-status' + (cls ? ' ' + cls : ''); st.textContent = t; }
        };

        if (btn.classList.contains('btn-add-item')) {
            ordCard.querySelector('tbody').insertAdjacentHTML('beforeend', itemRowHtml());
            return;
        }
        if (btn.classList.contains('btn-del-item')) {
            const tbody = ordCard.querySelector('tbody');
            btn.closest('tr').remove();
            if (!tbody.querySelector('tr')) tbody.insertAdjacentHTML('beforeend', itemRowHtml());
            recalc(ordCard);
            return;
        }

        if (btn.classList.contains('btn-save-order')) {
            setSt('Сохраняю…');
            try {
                await saveOrderData(ordCard, o);
                openOrders.add(oid);
                await loadOrders();
                renderSlot(n);
                flashOrder(oid, 'Сохранено', 'ok');
            } catch (err) { setSt('Ошибка: ' + err.message, 'error'); }
            return;
        }

        if (btn.classList.contains('btn-receive')) {
            if (!confirm('Принять заказ на склад?\n\nПозиции придут на склад, закупка запишется в «Расход», доставка войдёт в себестоимость позиций. Отменить это действие будет нельзя.')) return;
            btn.disabled = true;
            setSt('Принимаю…');
            try {
                await saveOrderData(ordCard, o);
                const { error } = await supabase.rpc('receive_supplier_order', { p_order_id: oid });
                if (error) throw new Error(error.message);
                openOrders.add(oid);
                await loadOrders();
                renderSlot(n);
                flashOrder(oid, 'Принято на склад', 'ok');
            } catch (err) {
                btn.disabled = false;
                setSt('Ошибка: ' + err.message, 'error');
            }
            return;
        }

        if (btn.classList.contains('btn-cancel-order')) {
            if (!confirm('Отменить заказ?')) return;
            const { data, error } = await supabase.from('supplier_orders')
                .update({ status: 'cancelled' }).eq('id', oid).eq('status', 'ordered').select('id');
            if (error || !data || !data.length) { setSt('Ошибка: ' + (error ? error.message : 'заказ уже не в статусе «заказан»'), 'error'); return; }
            openOrders.add(oid);
            await loadOrders();
            renderSlot(n);
            return;
        }

        if (btn.classList.contains('btn-delete-order')) {
            if (!confirm('Удалить заказ?')) return;
            const { data, error } = await supabase.from('supplier_orders')
                .delete().eq('id', oid).neq('status', 'received').select('id');
            if (error || !data || !data.length) { setSt('Ошибка: ' + (error ? error.message : 'принятый заказ удалить нельзя'), 'error'); return; }
            openOrders.delete(oid);
            await loadOrders();
            renderSlot(n);
        }
    }

    slotsEl.addEventListener('click', async (e) => {
        const card = e.target.closest('details.slot');
        if (!card) return;
        const n = Number(card.dataset.slot);
        const row = rows.find(x => x.slot === n);

        const ordCard = e.target.closest('details.ord');
        if (ordCard) { await handleOrderClick(e, ordCard, n); return; }

        if (e.target.closest('.btn-new-order') && row) {
            const { data, error } = await supabase.from('supplier_orders')
                .insert({ supplier_id: row.id }).select('*, supplier_order_items(*)');
            if (error || !data || !data.length) {
                console.error(error);
                setStatus(card, 'Не удалось создать заказ: ' + (error ? error.message : 'нет прав'), 'error');
                return;
            }
            orders.unshift(data[0]);
            openOrders.add(data[0].id);
            renderSlot(n);
            return;
        }

        if (e.target.closest('.btn-save')) {
            const v = (f) => {
                const val = card.querySelector(`[data-f="${f}"]`).value.trim();
                return val === '' ? null : val;
            };
            const title = v('slot_title');
            const payload = {
                slot: n,
                slot_title: title,
                name: v('name') || title || `Слот ${n}`,
                contact_person: v('contact_person'),
                phone: v('phone'),
                website: v('website'),
                messenger: v('messenger'),
                notes: v('notes'),
                updated_at: new Date().toISOString()
            };
            setStatus(card, 'Сохраняю…');
            const query = row
                ? supabase.from('suppliers').update(payload).eq('id', row.id).select()
                : supabase.from('suppliers').insert(payload).select();
            const { data, error } = await query;
            if (error || !data || data.length === 0) {
                console.error('[Suppliers] Не удалось сохранить', error);
                setStatus(card, 'Не удалось сохранить: ' + (error ? error.message : 'нет прав — проверьте SQL (политика update)'), 'error');
                return;
            }
            if (row) Object.assign(row, data[0]); else rows.push(data[0]);
            openSlots.add(n);
            const fresh = renderSlot(n);
            setStatus(fresh, 'Сохранено', 'ok');
            return;
        }

        if (e.target.closest('.btn-release') && row) {
            if (!confirm(`Освободить слот ${n}? Поставщик и его заказы сохранятся в базе, но слот станет свободным.`)) return;
            const { data, error } = await supabase.from('suppliers')
                .update({ slot: null, slot_title: null }).eq('id', row.id).select();
            if (error || !data || data.length === 0) {
                setStatus(card, 'Не удалось освободить слот: ' + (error ? error.message : 'нет прав'), 'error');
                return;
            }
            rows = rows.filter(x => x.id !== row.id);
            openSlots.delete(n);
            renderSlot(n);
        }
    });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');

    await loadSuppliers();
    await loadOrders();
    render();
    loadNames();
</script>
</body>
</html>
