<!DOCTYPE html>
<!--
  destress-studio.html — De-Stress Studio — v5.0.0 — 2026-10-31
  «В глубину»: слой 1 — ситуации; слой 2 — фраза, ситуация остаётся меткой; слой 3 — «Забирай».
  Название крупно, внутри контейнера. Свой случай и своё выражение — «Добавить в коллекцию».
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e0b">
<meta name="google" content="notranslate">
<title>De-Stress Studio — GY-GY Club</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root { --black:#100e0b; --panel:rgba(23,20,16,.94); --gold:#d8b36a; --light:#f0d69d; --dark:#76582d; --text:#f0e8d8; --muted:#b0a38d; --line:rgba(216,179,106,.27); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { min-height: 100%; background: var(--black); }
body { min-height: 100vh; margin: 0; color: var(--text); background: var(--black); font: 15px/1.5 Inter, "Segoe UI", Arial, sans-serif; overflow-x: hidden; }
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--light); outline-offset: 3px; }

.background-photo {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; background-color: var(--black);
  background-image:
    linear-gradient(90deg, rgba(10,9,7,.666), rgba(10,9,7,.513) 50%, rgba(10,9,7,.648)),
    linear-gradient(0deg, rgba(10,9,7,.684), rgba(10,9,7,.135) 55%, rgba(10,9,7,.468)),
    url("destress_bg.jpg");
  background-size: cover; background-position: center; background-repeat: no-repeat;
}
.page { position: relative; z-index: 1; display: flex; flex-direction: column; width: min(1100px, calc(100% - 28px)); min-height: 100vh; margin: 0 auto; padding: 10px 0 14px; }

.topbar { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 6px 4px 12px; border-bottom: 1px solid var(--line); }
.nav-area { display: flex; align-items: center; gap: 18px; font: 900 26px/1 'Share Tech Mono', monospace; }
.back-arrow { color: var(--gold); cursor: pointer; user-select: none; transition: opacity .2s, transform .2s; }
.back-arrow:hover { opacity: .8; transform: scale(1.1); }
.club-brand { justify-self: end; color: var(--light); text-decoration: none; }
.club-logo { font: 700 clamp(26px,3vw,36px)/1 Georgia, serif; letter-spacing: .045em; }

.container { margin: 18px 0; padding: clamp(16px,3vw,28px); border: 1px solid var(--line); border-radius: 13px; background: var(--panel); box-shadow: 0 12px 32px rgba(0,0,0,.18); }
.studio-title { margin: 0 0 clamp(14px,2.4vw,24px); text-align: center; color: var(--light); font: 700 clamp(30px,6.2vw,68px)/1.05 'Playfair Display', Georgia, serif; letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 2px 18px rgba(216,179,106,.25); overflow-wrap: anywhere; }

.stage { position: relative; display: grid; align-items: center; }
.layer { grid-area: 1 / 1; min-width: 0; transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .5s, filter .5s; }
.layer.front { opacity: 1; transform: none; filter: none; visibility: visible; }
.layer.back { opacity: 0; transform: scale(.92) translateY(-14px); filter: blur(4px); pointer-events: none; visibility: hidden; transition: transform .5s, opacity .5s, filter .5s, visibility 0s .5s; }
.layer.ahead { opacity: 0; transform: translateY(26px) scale(1.04); pointer-events: none; visibility: hidden; transition: transform .5s, opacity .5s, visibility 0s .5s; }

.layer-title { margin: 0 0 16px; color: var(--light); font: 400 clamp(22px,3vw,32px)/1.15 Georgia, serif; }
.choice-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.choice-button { display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 12px; border: 1px solid rgba(216,179,106,.2); border-radius: 9px; color: var(--text); background: rgba(255,255,255,.025); text-align: left; transition: background .16s, border-color .16s, transform .16s; }
.choice-button:hover { border-color: var(--dark); background: rgba(216,179,106,.075); transform: translateY(-1px); }
.choice-symbol { flex: 0 0 auto; font-size: 21px; }
.choice-label { font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }

.custom-form { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 9px; margin-top: 13px; }
.text-input { width: 100%; min-width: 0; min-height: 44px; padding: 10px 13px; border: 1px solid rgba(216,179,106,.32); border-radius: 8px; color: var(--text); background: rgba(8,7,5,.78); }
.text-input::placeholder { color: #8f8370; }
.gold-button, .outline-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-align: center; text-decoration: none; transition: background .16s, border-color .16s, transform .16s; }
.gold-button { border: 1px solid var(--gold); color: #1a1308; background: var(--gold); }
.gold-button:hover { background: var(--light); transform: translateY(-1px); }
.outline-button { border: 1px solid var(--line); color: var(--light); background: rgba(0,0,0,.18); }
.outline-button:hover { border-color: var(--gold); background: rgba(216,179,106,.08); }

.phrase-wrap { max-width: 820px; margin: 0 auto; }
.topline { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 12px; }
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; max-width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: rgba(15,13,10,.85); color: var(--light); font-size: 12px; }
.chip:hover { border-color: var(--gold); }
.chip.add { border-style: dashed; color: var(--gold); }
.chip span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recipe-mode { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: rgba(0,0,0,.25); }
.mode-button { padding: 7px 12px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 12px; }
.mode-button.active { color: #18120a; background: var(--gold); font-weight: 700; }
.recipe-card { display: flex; flex-direction: column; justify-content: center; min-height: min(36vh, 280px); padding: clamp(18px,4vw,40px); border: 1px solid rgba(216,179,106,.28); border-radius: 14px; background: linear-gradient(145deg, rgba(45,34,21,.96), rgba(22,19,15,.98) 58%); box-shadow: 0 14px 40px rgba(0,0,0,.35); }
.recipe-title { margin: 0; color: var(--light); font: 400 clamp(26px,4vw,48px)/1.2 Georgia, serif; overflow-wrap: anywhere; }
.mix-count { margin-top: 14px; color: var(--muted); font-size: 11px; }
.actions-main { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin-top: 12px; }
.text-button { padding: 7px 0; border: 0; color: var(--light); background: transparent; font-size: 12px; }
.text-button:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.actions-main .gold-button { margin-left: auto; }
.status-message { min-height: 18px; margin: 10px 0 0; color: var(--light); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 60vh; overflow-y: auto; padding: 14px 16px 18px; border-top: 1px solid var(--gold); background: rgba(16,14,11,.97); transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.7,.2,1); }
.sheet.open { transform: none; }
.sheet-inner { max-width: 820px; margin: 0 auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet-title { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.sheet-x { border: 0; background: transparent; color: var(--light); font-size: 20px; line-height: 1; }
.share-row { display: flex; flex-wrap: wrap; gap: 8px; }

.gy-user-badge { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--gold); background: #111; z-index: 1000000; cursor: pointer; display: none; }
.gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; }
.gy-user-badge .badge-flag { position: absolute; bottom: -2px; right: -4px; width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); }
.gy-passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 2000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity .3s ease; }
.gy-passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; max-width: 94vw; color: #000; text-align: center; position: relative; font-family: 'Share Tech Mono', monospace; }
.gy-passport-close { position: absolute; top: 10px; right: 14px; font-size: 28px; cursor: pointer; }
.gy-passport-title { font-weight: 900; font-size: 16px; }
.gy-passport-id { font-weight: 700; font-size: 13px; margin-top: 5px; color: #555; }
.gy-passport-nick { font-weight: 700; font-size: 14px; margin-top: 4px; }
.gy-passport-avatar-box, .gy-passport-qr-box { width: 90px; height: 90px; border: 2px solid var(--gold); background: #fff; margin: 8px auto; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.gy-passport-avatar { width: 100%; height: 100%; object-fit: cover; }
.gy-passport-edit { margin-top: 14px; padding: 8px 20px; background: #000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; font-size: 11px; }

@media (max-width: 900px) { .choice-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 560px) {
  .page { width: calc(100% - 20px); }
  .choice-grid { grid-template-columns: minmax(0,1fr); gap: 8px; }
  .custom-form { grid-template-columns: minmax(0,1fr); }
  .actions-main .gold-button { margin-left: 0; width: 100%; }
  .share-row .outline-button, .share-row .gold-button { flex: 1 1 calc(50% - 8px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>
</head>

<body>
<div class="background-photo" aria-hidden="true"></div>
<div id="passport-badge-container"></div>

<div class="page">
  <header class="topbar">
    <nav class="nav-area" translate="no">
      <a class="back-arrow" id="btn-back" title="Back" data-translate-title="nav_back">&lt;</a>
      <a class="back-arrow" id="btn-home" title="Home" data-translate-title="nav_home">&lt;&lt;</a>
    </nav>
    <a class="club-brand" href="hall.html" translate="no"><div class="club-logo">GY-GY</div></a>
  </header>

  <main class="container">
    <h1 class="studio-title" translate="no">DE-STRESS STUDIO</h1>

    <div class="stage">

      <section class="layer front" id="layer-sit" aria-labelledby="sitTitle">
        <div>
          <h2 class="layer-title" id="sitTitle">Что случилось?</h2>
          <div class="choice-grid" id="choiceGrid"></div>
          <form class="custom-form" id="customSituationForm">
            <input class="text-input" id="customSituationInput" type="text" maxlength="80" placeholder="Твоя ситуация в двух словах" aria-label="Что? Где? Когда?">
            <button class="gold-button" type="submit">Выпей немного воды и рассказывай →</button>
          </form>
        </div>
      </section>

      <section class="layer ahead" id="layer-phrase" aria-live="polite">
        <div class="phrase-wrap">
          <div class="topline">
            <div class="chip-group">
              <button class="chip" id="chip" type="button"><span id="chipText"></span><span aria-hidden="true">✕</span></button>
              <button class="chip add" id="chipAdd" type="button" hidden>＋ Добавить случай в коллекцию</button>
            </div>
            <div class="recipe-mode" role="group">
              <button class="mode-button active" id="randomMode" type="button" aria-pressed="true">Случайная</button>
              <button class="mode-button" id="myMode" type="button" aria-pressed="false">Своя</button>
            </div>
          </div>

          <div class="recipe-card">
            <h2 class="recipe-title" id="recipeTitle"></h2>
            <span class="mix-count" id="mixCount"></span>
          </div>

          <form class="custom-form" id="customRecipeForm" hidden>
            <input class="text-input" id="customRecipeInput" type="text" maxlength="180" placeholder="Придумай своё ..." aria-label="Твой вариант">
            <button class="gold-button" type="submit">Показать</button>
          </form>

          <div class="actions-main">
            <button class="text-button" type="button" id="anotherRecipe">↻ Другой замес</button>
            <button class="text-button" type="button" id="doubleMix">⚡ Добей!</button>
            <button class="text-button" type="button" id="copyRecipe">Копировать</button>
            <button class="text-button" type="button" id="addPhrase" hidden>＋ Добавить в коллекцию</button>
            <button class="gold-button" type="button" id="openSheet">Забирай ▴</button>
          </div>
          <p class="status-message" id="statusMessage" role="status"></p>
        </div>
      </section>

    </div>
  </main>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-inner">
    <div class="sheet-head">
      <span class="sheet-title">Забирай</span>
      <button class="sheet-x" id="sheetClose" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div class="share-row">
      <button class="gold-button" type="button" id="goToAtelier">На футболку (текст) →</button>
      <button class="gold-button" type="button" id="goToAi">Сделать с ИИ →</button>
      <button class="outline-button" type="button" id="pngDark">PNG на тёмное ⬇</button>
      <button class="outline-button" type="button" id="pngLight">PNG на светлое ⬇</button>
      <button class="outline-button" type="button" id="saveTxt">TXT ⬇</button>
      <button class="outline-button" type="button" id="shareTelegram">Telegram ✈</button>
      <button class="outline-button" type="button" id="publishRecipe">Опубликовать в новостях клуба ↗</button>
    </div>
  </div>
</div>

<script type="module">
import { init as initLocalization, getCurrentLang, onLanguageChange } from './core/localization.js';
import { init as initPassport } from './modules/passport.js';
import { supabase } from './core/supabase-init.js';

initLocalization(document.body);
initPassport(document.getElementById('passport-badge-container'));

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SITUATIONS = [
    ['💼', 'Поругался с начальником'],
    ['🚗', 'Обрызгала машина'],
    ['💩', 'Сел на жвачку'],
    ['🍺', 'Опрокинул бокал с пивом'],
    ['🏴‍☠️', 'Забыл, где заначка'],
    ['💸', 'По пьяне дал в займы'],
    ['💻', 'Не помню, как сюда попал'],
    ['⏰', 'Женился']
];

const FALLBACK_POOL = [
    ['Зафонарь себе в контейнер!', 'Lantern yourself into the container!', 'Lampadaire-toi dans le conteneur !'],
    ['Сахаруй твою поддон!', 'Sugar your pallet!', 'Sucre ta palette !'],
    ['Маракуй тебе в подкладку!', 'Passion-fruit into your lining!', 'Maracuja-toi dans la doublure !'],
    ['Залуди свою табуретку!', 'Solder your stool!', 'Soude ton tabouret !'],
    ['Напильником по сепаратору!', 'File the separator!', 'Un coup de lime sur le séparateur !'],
    ['Застакань свои тапочки!', 'Glassify your slippers!', 'Vitrifie tes pantoufles !'],
    ['Распадись компот в баян!', 'Fall apart, compote, into the accordion!', 'Désagrège-toi, compote, dans l’accordéon !'],
    ['Завались забор в предмете!', 'Collapse, fence, into the object!', 'Écroule-toi, clôture, dans l’objet !'],
    ['Трамбуй педаль в резинку!', 'Tamp the pedal into the rubber band!', 'Tasse la pédale dans l’élastique !']
].map(([text, en, fr]) => ({ id: null, source: 'club', text, translations: { en, fr } }));

let pool = FALLBACK_POOL.slice();
let extraRaw = [];   // одобренные случаи посетителей из коллекции
const state = { situationIndex: null, customSituation: '', mode: 'random', phrase: null, customRecipe: '', mixNumber: 0, sentSituationText: '', sentPhraseText: '' };

// случаи: встроенные + коллекция
const extraList = () => extraRaw.map(r => ['💬', (r.translations && r.translations[getCurrentLang()]) || r.text]);
const allSituations = () => SITUATIONS.concat(extraList());
function renderChoices() {
    $('choiceGrid').innerHTML = allSituations().map(([icon, label], i) =>
        `<button class="choice-button" type="button" data-situation="${i}"><span class="choice-symbol">${icon}</span><span class="choice-label">${esc(label)}</span></button>`).join('');
}

function displayOf(p) {
    if (!p) return '';
    if (p.items) return p.items.map(displayOf).join(' ');
    return (p.translations && p.translations[getCurrentLang()]) || p.text;
}
const currentText = () => displayOf(state.phrase);

function randomPhrase(avoid) {
    const options = pool.filter(p => p !== avoid && !(avoid && avoid.id && p.id === avoid.id));
    const list = options.length ? options : pool;
    return list[Math.floor(Math.random() * list.length)];
}

const say = msg => { $('statusMessage').textContent = msg || ''; };

// слои
function showPhraseLayer(show) {
    $('layer-sit').classList.toggle('front', !show);
    $('layer-sit').classList.toggle('back', show);
    $('layer-phrase').classList.toggle('front', show);
    $('layer-phrase').classList.toggle('ahead', !show);
    if (!show) closeSheet();
}
function openSheet() { $('sheet').classList.add('open'); $('sheet').setAttribute('aria-hidden', 'false'); }
function closeSheet() { $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true'); }

// отрисовка
function renderChip() {
    const el = $('chipText');
    if (state.situationIndex !== null) {
        const [icon, label] = allSituations()[state.situationIndex] || ['', ''];
        el.textContent = (icon + ' ' + label).trim();
        el.removeAttribute('translate');
    } else if (state.customSituation) {
        el.textContent = '✍️ ' + state.customSituation;
        el.setAttribute('translate', 'no');     // слова посетителя на перевод не отправляем
    } else {
        el.textContent = '';
    }
    $('chipAdd').hidden = !state.customSituation || state.customSituation === state.sentSituationText;
}

function render() {
    const p = state.phrase;
    const my = state.mode === 'my';
    const title = $('recipeTitle');
    title.textContent = p ? displayOf(p) : (my ? 'Твой ход, мастер абсурда!' : '');
    if (p && p.source === 'session') title.setAttribute('translate', 'no'); else title.removeAttribute('translate');
    $('mixCount').textContent = (p && p.items) ? 'Двойной замес' : (state.mixNumber ? 'Замес № ' + state.mixNumber : '');
    $('addPhrase').hidden = !(p && p.source === 'session') || p.text === state.sentPhraseText;
}

function setModeButtons() {
    const my = state.mode === 'my';
    $('randomMode').classList.toggle('active', !my);
    $('randomMode').setAttribute('aria-pressed', String(!my));
    $('myMode').classList.toggle('active', my);
    $('myMode').setAttribute('aria-pressed', String(my));
    $('customRecipeForm').hidden = !my;
}

function chooseRandom() {
    state.mode = 'random';
    setModeButtons();
    state.phrase = randomPhrase(state.phrase);
    state.mixNumber++;
    say('');
    render();
}

function bump(kind) {
    const id = state.phrase && state.phrase.id;
    if (!id) return;
    try { supabase.rpc('destress_bump', { p_id: id, p_kind: kind }).then(() => {}, () => {}); } catch (e) { /* не критично */ }
}

// ситуации
renderChoices();

function afterSituation() {
    renderChip();
    showPhraseLayer(true);
    if (state.mode === 'random') chooseRandom();
    else {
        state.phrase = state.customRecipe ? { id: null, text: state.customRecipe, translations: {}, source: 'session' } : null;
        say('');
        render();
    }
}

$('choiceGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-situation]');
    if (!b) return;
    state.situationIndex = Number(b.dataset.situation);
    state.customSituation = '';
    afterSituation();
});

$('customSituationForm').addEventListener('submit', e => {
    e.preventDefault();
    const value = $('customSituationInput').value.trim();
    if (!value) { $('customSituationInput').focus(); return; }
    state.customSituation = value;
    state.situationIndex = null;
    $('customSituationInput').value = '';
    afterSituation();
});

$('chip').addEventListener('click', () => showPhraseLayer(false));

// фраза
$('randomMode').addEventListener('click', chooseRandom);

$('myMode').addEventListener('click', () => {
    state.mode = 'my';
    setModeButtons();
    state.phrase = state.customRecipe ? { id: null, text: state.customRecipe, translations: {}, source: 'session' } : null;
    say('');
    render();
    $('customRecipeInput').focus();
});

$('anotherRecipe').addEventListener('click', () => {
    if (state.mode === 'my') { say('Сначала введи свой вариант или переключись на «Случайная».'); return; }
    chooseRandom();
});

$('doubleMix').addEventListener('click', () => {
    const a = randomPhrase(null);
    const b = randomPhrase(a);
    state.mode = 'random';
    setModeButtons();
    state.phrase = { id: null, items: [a, b], source: 'club' };
    state.mixNumber++;
    say('');
    render();
});

$('customRecipeForm').addEventListener('submit', e => {
    e.preventDefault();
    const value = $('customRecipeInput').value.trim();
    if (!value) { say('Пустой стакан. Напиши своё выражение.'); return; }
    state.customRecipe = value;
    state.mode = 'my';
    state.phrase = { id: null, text: value, translations: {}, source: 'session' };
    state.mixNumber++;
    $('customRecipeInput').value = '';
    say('');
    render();
});

$('copyRecipe').addEventListener('click', async () => {
    const text = currentText();

    }

$('openSheet').addEventListener('click', () => {

    openSheet();

// коллекция: свой случай и своё выражение уходят на проверку
const SUBMIT_KEY = 'gygy-destress-last-submit';
const tooSoon = () => Date.now() - Number(localStorage.getItem(SUBMIT_KEY) || 0) < 20000;
const stamp = () => { try { localStorage.setItem(SUBMIT_KEY, String(Date.now())); } catch (e) { /* ок */ } };
const SENT_TEXT = 'Отправлено на проверку. После одобрения появится в общей коллекции клуба.';

$('chipAdd').addEventListener('click', async () => {
    const text = state.customSituation.trim();
    if (text.length < 3) return;
    if (tooSoon()) { say('Подожди немного перед следующей отправкой.'); return; }
    const { error } = await supabase.from('destress_situations').insert({ text, lang: getCurrentLang(), status: 'pending', translations: {} });
    if (error) { say(error.code === '23505' ? 'Такой случай уже есть в коллекции.' : 'Не удалось отправить. Попробуй позже.'); return; }
    stamp();
    state.sentSituationText = state.customSituation;
    $('chipAdd').hidden = true;
    say(SENT_TEXT);
});

$('addPhrase').addEventListener('click', async () => {
    const p = state.phrase;
    if (!p || p.source !== 'session') return;
    if (tooSoon()) { say('Подожди немного перед следующей отправкой.'); return; }
    const { error } = await supabase.from('destress_phrases').insert({
        text: p.text.trim(), lang: getCurrentLang(), source: 'user', status: 'pending', translations: {},
        situation: state.situationIndex !== null && state.situationIndex < SITUATIONS.length ? 'sit_' + state.situationIndex : null
    });
    if (error) { say(error.code === '23505' ? 'Такая фраза уже есть в коллекции.' : 'Не удалось отправить. Попробуй позже.'); return; }
    stamp();
    state.sentPhraseText = p.text;
    $('addPhrase').hidden = true;
    say(SENT_TEXT);
});

// «Опубликовать в новостях»: та же проверка, но с пометкой «просит в новости»
$('publishRecipe').addEventListener('click', async () => {
    const p = state.phrase;
    if (!p) { say('Сначала выбери выражение.'); return; }
    if (p.source !== 'session') { say('Эта фраза уже в базе клуба.'); return; }
    if (tooSoon()) { say('Подожди немного перед следующей отправкой.'); return; }
    const { error } = await supabase.from('destress_phrases').insert({
        text: p.text.trim(), lang: getCurrentLang(), source: 'user', status: 'pending', translations: {}, news_requested: true,
        situation: state.situationIndex !== null && state.situationIndex < SITUATIONS.length ? 'sit_' + state.situationIndex : null
    });
    if (error) {
        say(error.code === '23505' ? 'Эта фраза уже отправлена на проверку.' : 'Не удалось отправить фразу. Попробуй позже.');
        return;
    }
    stamp();
    state.sentPhraseText = p.text;
    render();
    say('Отправлено на проверку. После одобрения фраза попадёт в общую базу клуба.');
    closeSheet();
});

// картинки и файлы
const FONT = '"Playfair Display", Georgia, serif';
async function ensureFont() { try { await document.fonts.load('700 120px "Playfair Display"'); } catch (e) { /* запасной шрифт */ } }
function wrapLines(ctx, text, maxW) {
    const words = text.split(/\s+/);
    const lines = [];
    let cur = '';
    words.forEach(w => {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
}

async function phrasePng(text, forDark) {
    await ensureFont();
    const W = 1800, pad = 90;
    const probe = document.createElement('canvas').getContext('2d');
    let size = 240, lines;
    for (;;) {
        probe.font = `700 ${size}px ${FONT}`;
        lines = wrapLines(probe, text, W - pad * 2);
        if (lines.length <= 5 || size <= 70) break;
        size -= 10;
    }
    const lineH = Math.round(size * 1.2);
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = lines.length * lineH + pad * 2;
    const ctx = canvas.getContext('2d');
    ctx.font = `700 ${size}px ${FONT}`;
    ctx.fillStyle = forDark ? '#F0EAD6' : '#1a1408';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, pad + lineH * i + lineH / 2));
    return new Promise(res => canvas.toBlob(res, 'image/png'));
}

async function phraseCard(text) {
    await ensureFont();
    const W = 1200, H = 630, pad = 80;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#100e0b';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#76582d';
    ctx.lineWidth = 3;
    ctx.strokeRect(24, 24, W - 48, H - 48);
    let size = 120, lines;
    for (;;) {
        ctx.font = `700 ${size}px ${FONT}`;
        lines = wrapLines(ctx, text, W - pad * 2);
        if (lines.length * size * 1.2 <= H - 220 || size <= 40) break;
        size -= 6;
    }
    ctx.fillStyle = '#f0d69d';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lineH = Math.round(size * 1.2);
    const top = (H - 90 - lines.length * lineH) / 2 + lineH / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, top + lineH * i));
    ctx.font = `700 34px ${FONT}`;
    ctx.fillStyle = '#d8b36a';
    ctx.fillText('GY-GY CLUB', W / 2, H - 70);
    return new Promise(res => canvas.toBlob(res, 'image/png'));
}

function downloadBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

async function savePng(forDark) {
    const text = currentText();
    if (!text) { say('Сначала выбери выражение.'); return; }
    const blob = await phrasePng(text, forDark);
    if (!blob) return;
    downloadBlob(blob, forDark ? 'gygy-phrase-for-dark.png' : 'gygy-phrase-for-light.png');
    say('Сохранено на компьютер.');
    bump('download');
    closeSheet();
}
$('pngDark').addEventListener('click', () => savePng(true));
$('pngLight').addEventListener('click', () => savePng(false));

$('saveTxt').addEventListener('click', () => {
    const text = currentText();
    if (!text) { say('Сначала выбери выражение.'); return; }
    downloadBlob(new Blob([text + '\n— GY-GY Club\n'], { type: 'text/plain;charset=utf-8' }), 'gygy-phrase.txt');
    say('Сохранено на компьютер.');
    bump('download');
    closeSheet();
});

// Ателье и Telegram
function atelierLink(ai) {
    const u = new URL('atelier.html', location.href);
    u.searchParams.set('phrase', currentText());
    if (ai) u.searchParams.set('ai', '1');
    if (state.phrase && state.phrase.id) u.searchParams.set('pid', state.phrase.id);
    u.searchParams.set('from', 'studio');
    return u.href;
}
$('goToAtelier').addEventListener('click', () => {
    if (!currentText()) { say('Сначала выбери выражение.'); return; }
    window.location.href = atelierLink(false);
});
$('goToAi').addEventListener('click', () => {
    if (!currentText()) { say('Сначала выбери выражение.'); return; }
    window.location.href = atelierLink(true);
});

$('shareTelegram').addEventListener('click', async () => {
    const text = currentText();
    if (!text) { say('Сначала выбери выражение.'); return; }
    const link = atelierLink(false);
    const message = text + '\n— GY-GY Club';
    try {
        if (navigator.canShare && navigator.share) {
            const card = await phraseCard(text);
            const file = new File([card], 'gygy-phrase.png', { type: 'image/png' });
            if (navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], text: message + '\n' + link });
                bump('share');
                say('Отправлено.');
                closeSheet();
                return;
            }
        }
    } catch (err) {
        if (err && err.name === 'AbortError') return;
    }
    window.open('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(message), '_blank', 'noopener');
    bump('share');
    say('Открываю Telegram…');
    closeSheet();
});

// база фраз и коллекция случаев
async function loadPool() {
    try {
        const { data, error } = await supabase.from('destress_phrases')
            .select('id, text, translations').eq('status', 'approved').limit(500);
        if (error) throw error;
        if (data && data.length) pool = data.map(r => ({ id: r.id, text: r.text, translations: r.translations || {}, source: 'club' }));
    } catch (e) {
        console.warn('[Studio] База фраз недоступна — используются встроенные фразы.', e);
    }
}
async function loadSituations() {
    try {
        const { data, error } = await supabase.from('destress_situations')
            .select('text, translations').eq('status', 'approved').order('created_at', { ascending: true }).limit(60);
        if (error) throw error;
        extraRaw = data || [];
        renderChoices();
    } catch (e) {
        console.warn('[Studio] Коллекция случаев недоступна — только встроенные.', e);
    }
}

setModeButtons();
await loadPool();
await loadSituations();
