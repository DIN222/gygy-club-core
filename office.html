
<!DOCTYPE html>
<!--
  office.html
  v5.0.0 — 2026-09-29
  Полная пересборка под CONTRACT.md: ES-модули вместо инлайн onclick,
  modules/passport.js вместо самодельного паспорта, core/storage.js
  вместо сырого localStorage, единый визуальный язык клуба (золото/
  ivory/чёрный) вместо отдельной цветовой схемы старого файла.
  Бэк-енд, невидим для обычных посетителей — доступен только по прямой
  ссылке (см. правку hall.html).

  Структура: две схемы — Схема офиса (6 блоков) и Схема клуба
  (club-map.html, отдельный файл, не входит в эту правку).
  Комната переговоров (Блок №3) — занята, как и было.
  Один свободный блок (Блок №1) отдан под Бухгалтерию — ведёт на
  accounting.html, где по тому же принципу дробления будут свои
  подблоки (Калькуляция затрат, Платёжный терминал).
  Остальные свободные блоки (2,4,5,6) — временно заглушки "вызвать
  сотрудника" в духе исходного файла, упрощённые.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Office v5.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="qrcode.min.js"></script>
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; min-height: 100%; background: #000; color: var(--gold);
        overflow-y: auto; font-family: 'Share Tech Mono', monospace;
    }
    .header-right { position: absolute; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; transition: opacity 0.2s; }
    .back-arrow:hover { opacity: 0.6; }
     .gy-user-badge { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: #111; cursor: pointer; display: none; z-index: 1000; }
    .gy-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .gy-user-badge .badge-flag { position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover; border: 1px solid var(--gold); }

    .page-wrap { position: relative; min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; text-align: center; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }

    .top-nav { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 600px; }
    .top-nav button, .top-nav a {
        flex: 1; padding: 10px; background: #0a0a0a; color: var(--gold); border: 1px solid var(--gold-dim);
        font-family: 'Cinzel', serif; font-size: 12px; font-weight: 700; text-align: center;
        text-decoration: none; cursor: pointer; transition: border-color 0.2s;
    }
    .top-nav button.active, .top-nav a:hover, .top-nav button:hover { border-color: var(--gold); }

    .office-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 700px; }
    .office-room {
        background: #0a0a0a; border: 1px solid var(--gold-dim); padding: 16px 10px;
        text-align: center; font-size: 12px; color: var(--ivory); cursor: pointer;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
        min-height: 80px; transition: border-color 0.2s;
    }
    .office-room:hover { border-color: var(--gold); }
    .office-room.occupied { border-color: var(--gold); color: var(--gold); font-family: 'Cinzel', serif; font-weight: 700; cursor: default; background: #14110a; }
    .office-room small { opacity: 0.7; font-size: 10px; }

    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000;
        display: none; align-items: center; justify-content: center; opacity: 0;
        transition: opacity 0.3s ease;
    }
    .modal-card {
        background: var(--ivory); border: 1px solid var(--gold); border-radius: 4px;
        padding: 20px; width: 300px; color: #1a1408; text-align: left; position: relative;
        font-family: 'Share Tech Mono', monospace;
    }
    .modal-close { position: absolute; top: 8px; right: 12px; font-size: 24px; cursor: pointer; }
    .modal-title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 14px; margin-bottom: 10px; text-align: center; }
    .staff-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid rgba(0,0,0,0.1); font-size: 12px; }
    .staff-item:last-child { border-bottom: none; }
    .action-btn { background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 4px 8px; font-size: 10px; cursor: pointer; }
    .status-line { margin-top: 10px; font-size: 11px; color: #1a4; text-align: center; min-height: 14px; }
</style>
</head>
<body>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-hall">&lt;&lt;</a>
</div>
<div id="passport-badge-container"></div>

<div class="page-wrap">
    <div class="title">OFFICE</div>

    <div class="top-nav">
        <button class="active" id="btn-office-map">СХЕМА ОФИСА</button>
        <a href="club-map.html">СХЕМА КЛУБА</a>
    </div>

    <div class="office-grid">
        <div class="office-room" id="room-accounting">БУХГАЛТЕРИЯ</div>
        <div class="office-room" id="room-2">БЛОК №2<br><small>Процессы</small></div>
        <div class="office-room occupied" id="room-meeting">КОМНАТА<br>ПЕРЕГОВОРОВ</div>
        <div class="office-room" id="room-4">БЛОК №4<br><small>Проекты</small></div>
        <div class="office-room" id="room-5">БЛОК №5<br><small>Тех. сектор</small></div>
        <div class="office-room" id="room-6">БЛОК №6<br><small>Безопасность</small></div>
    </div>
</div>

<div class="modal-overlay" id="modal-location-call">
    <div class="modal-card">
        <span class="modal-close" data-close>&times;</span>
        <div class="modal-title" id="location-title">Локация</div>
        <p style="font-size:11px; color:#555; margin-bottom:10px;">Вызвать сотрудника в эту локацию:</p>
        <div id="office-staff-list"></div>
        <div class="status-line" id="location-call-status"></div>
    </div>
</div>

<script type="module">
    import { init as initPassport } from './modules/passport.js';
    import { get, set } from './core/storage.js';
    import { requireAuth, signOut } from './core/auth.js';
  const session = await requireAuth();
if (!session) throw new Error('redirecting to login');

    initPassport(document.getElementById('passport-badge-container'));

    function getStaff() {
        return get('officeStaff', [
            { id: 'GY-001122', name: '@Director' },
            { id: 'GY-102938', name: '@Alex_Dev' },
            { id: 'GY-445566', name: '@Elena_Sec' }
        ]);
    }

    function openModal(id) {
        const m = document.getElementById(id);
        m.style.display = 'flex';
        requestAnimationFrame(() => m.style.opacity = '1');
    }
    function closeModal(m) {
        m.style.opacity = '0';
        setTimeout(() => m.style.display = 'none', 300);
    }
    document.querySelectorAll('[data-close]').forEach(el => {
        el.addEventListener('click', () => closeModal(el.closest('.modal-overlay')));
    });

    let activeLocationName = '';
    function openLocationCall(locationName) {
        activeLocationName = locationName;
        document.getElementById('location-title').textContent = locationName;
        document.getElementById('location-call-status').textContent = '';
        const container = document.getElementById('office-staff-list');
        const staff = getStaff();
        container.innerHTML = staff.length
            ? staff.map(u => `
                <div class="staff-item">
                    <span>${u.name}</span>
                    <button class="action-btn" data-call="${u.name}">Вызвать</button>
                </div>`).join('')
            : '<div style="font-size:11px; color:#888; text-align:center;">В штате нет сотрудников</div>';
        container.querySelectorAll('[data-call]').forEach(btn => {
            btn.addEventListener('click', () => {
                const name = btn.dataset.call;
                document.getElementById('location-call-status').textContent = `${name} вызван в ${activeLocationName}...`;
                setTimeout(() => {
                    document.getElementById('location-call-status').textContent = `${name} прибыл в ${activeLocationName}.`;
                }, 1200);
            });
        });
        openModal('modal-location-call');
    }

    document.getElementById('room-accounting').addEventListener('click', () => {
        window.location.href = 'accounting.html';
    });
    ['2', '4', '5', '6'].forEach(n => {
        document.getElementById('room-' + n).addEventListener('click', () => openLocationCall('Блок №' + n));
    });
    // room-meeting — occupied, без обработчика клика

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-hall').addEventListener('click', () => window.location.href = 'hall.html');
</script>

</body>
</html>
