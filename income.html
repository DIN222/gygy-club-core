<!DOCTYPE html>
<!--
  income.html
  v1.0.0 — 2026-10-01
  Приход. Строки из Ателье приходят автоматически (business_line=atelier,
  заполняет клиент через интерфейс Ателье). Для Лавки древностей и
  Сувениров — своего интерфейса заказа пока нет, поэтому для них
  предусмотрен ручной ввод здесь же, временно.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GY-GY Club — Приход v1.0.0</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    :root { --gold: #FFD700; --gold-dim: #8a6f24; --ivory: #F0EAD6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #000; color: var(--gold); overflow-y: auto; font-family: 'Share Tech Mono', monospace; }
    .header-right { position: absolute; top: 18px; right: 25px; z-index: 1000; font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif; pointer-events: none; }
    .ui-nav-arrows { position: absolute; top: 18px; left: 20px; z-index: 1000; display: flex; gap: 15px; font-size: 24px; font-weight: 900; }
    .back-arrow { color: var(--gold); cursor: pointer; }
    .back-arrow:hover { opacity: 0.6; }
    .page-wrap { position: relative; min-height: 100vh; padding: 70px 16px 40px; display: flex; flex-direction: column; align-items: center; }
    .title { font-family: 'Cinzel', serif; font-weight: 900; font-size: 20px; margin-bottom: 16px; text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .panel { width: 100%; max-width: 640px; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .filter-row select { flex: 1; padding: 8px; border: 1px solid var(--gold); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }

    .manual-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; padding: 12px; border: 1px dashed var(--gold-dim); }
    .manual-form input, .manual-form select { padding: 8px; border: 1px solid var(--gold-dim); background: var(--ivory); color: #1a1408; font-family: inherit; font-size: 11px; }
    .btn-cfg {
        background: #000; color: var(--gold); border: 1px solid var(--gold-dim); padding: 8px 12px;
        cursor: pointer; font-weight: 700; text-transform: uppercase; font-family: inherit; font-size: 11px;
    }
    .btn-cfg:hover { border-color: var(--gold); }

    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th { text-align: left; color: var(--gold-dim); padding: 6px 4px; border-bottom: 1px solid var(--gold-dim); font-size: 10px; text-transform: uppercase; }
    td { padding: 6px 4px; border-bottom: 1px solid #1a1a1a; color: var(--ivory); }
    td.amount { color: var(--gold); text-align: right; white-space: nowrap; }
    .total-row td { font-weight: 900; color: var(--gold); border-top: 1px solid var(--gold-dim); }
    .empty-note { font-size: 11px; color: #666; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="header-right">GY-GY</div>
<div class="ui-nav-arrows">
    <a class="back-arrow" id="btn-back">&lt;</a>
    <a class="back-arrow" id="btn-accounting">&lt;&lt;</a>
</div>

<div class="page-wrap">
    <div class="title">ПРИХОД</div>

    <div class="panel">
        <div class="filter-row">
            <select id="filter-line">
                <option value="">Все направления</option>
                <option value="atelier">Ателье</option>
                <option value="store">Лавка древностей</option>
                <option value="souvenirs">Сувениры</option>
            </select>
        </div>

        <div class="manual-form">
            <span style="font-size:9px; opacity:0.7;">РУЧНОЙ ВВОД (для Лавки/Сувениров — своего интерфейса заказа пока нет)</span>
            <select id="manual-line">
                <option value="store">Лавка древностей</option>
                <option value="souvenirs">Сувениры</option>
            </select>
            <input type="text" id="manual-order-number" placeholder="Номер заказа">
            <input type="text" id="manual-description" placeholder="Что продано">
            <input type="number" id="manual-amount" placeholder="Сумма, €" min="0" step="0.01">
            <button class="btn-cfg" id="btn-manual-add">ДОБАВИТЬ ЗАПИСЬ</button>
        </div>

        <table>
            <thead><tr><th>Дата</th><th>Напр.</th><th>№ заказа</th><th>Детали</th><th>Сумма</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
        <div class="empty-note" id="empty-note" style="display:none;">Пока записей нет.</div>
    </div>
</div>

<script type="module">
    import { init as initPassport } from './modules/passport.js';
    import { supabase } from './core/supabase-init.js';
  import { requireAuth, signOut } from './core/auth.js';
  const session = await requireAuth();
if (!session) throw new Error('redirecting to login');

    initPassport(document.getElementById('passport-badge-container') || document.createElement('div'));

    const LINE_LABELS = { atelier: 'Ателье', store: 'Лавка', souvenirs: 'Сувениры' };

    async function loadRows() {
        const lineFilter = document.getElementById('filter-line').value;
        let query = supabase.from('income_entries').select('*').order('order_date', { ascending: false });
        if (lineFilter) query = query.eq('business_line', lineFilter);
        const { data, error } = await query;
        const tbody = document.getElementById('rows');
        const emptyNote = document.getElementById('empty-note');
        if (error) {
            tbody.innerHTML = '';
            emptyNote.style.display = 'block';
            emptyNote.textContent = 'Не удалось загрузить — проверьте таблицу income_entries.';
            return;
        }
        emptyNote.style.display = (data && data.length) ? 'none' : 'block';
        emptyNote.textContent = 'Пока записей нет.';
        let total = 0;
        tbody.innerHTML = (data || []).map(row => {
            total += Number(row.total_amount) || 0;
            const details = row.business_line === 'atelier'
                ? `${row.atelier_order?.garment || ''} ${row.atelier_order?.size || ''}`
                : (row.atelier_order?.description || '');
            return `<tr>
                <td>${new Date(row.order_date).toLocaleDateString()}</td>
                <td>${LINE_LABELS[row.business_line] || row.business_line}</td>
                <td>${row.order_number}</td>
                <td>${details}</td>
                <td class="amount">€${Number(row.total_amount).toFixed(2)}</td>
            </tr>`;
        }).join('') + (data && data.length ? `<tr class="total-row"><td colspan="4">ИТОГО</td><td class="amount">€${total.toFixed(2)}</td></tr>` : '');
    }

    document.getElementById('filter-line').addEventListener('change', loadRows);

    document.getElementById('btn-manual-add').addEventListener('click', async () => {
        const business_line = document.getElementById('manual-line').value;
        const order_number = document.getElementById('manual-order-number').value.trim() || ('M-' + Date.now().toString(36).toUpperCase());
        const description = document.getElementById('manual-description').value.trim();
        const amount = parseFloat(document.getElementById('manual-amount').value) || 0;
        if (!description || amount <= 0) return;
        const { error } = await supabase.from('income_entries').insert({
            business_line, order_number,
            atelier_order: { description },
            total_amount: amount
        });
        if (!error) {
            document.getElementById('manual-order-number').value = '';
            document.getElementById('manual-description').value = '';
            document.getElementById('manual-amount').value = '';
            loadRows();
        }
    });

    document.getElementById('btn-back').addEventListener('click', () => history.back());
    document.getElementById('btn-accounting').addEventListener('click', () => window.location.href = 'accounting.html');

    loadRows();
</script>

</body>
</html>
