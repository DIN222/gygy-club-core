<!DOCTYPE html>
<!--
  bar.html — GY-GY Club BAR — v1.73
  Изменения относительно v1.71:
  1. Компьютерный Конь уменьшен на 3% относительно v1.72 (113.344 → 109.944vw/vh).
  2. Мобильный bar_horse.jpg сохранён в прежнем масштабе 94vw/78vh.
  3. Приветствие поднято ещё на 5vh.
  4. Паспорт расположен справа под логотипом GY-GY.
  5. Компьютерные и мобильные правила разделены; мобильные переопределения
     находятся только внутри media query.
  Навигация, паспорт, локализация, звук и переходы сохранены.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <title>GY-GY Club - BAR (v1.73)</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; }

        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body {
            width: 100%; height: 100%; background: #000; color: var(--gold);
            font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0;
        }

        .ui-header-right {
            position: fixed; top: 18px; right: 25px; z-index: 1000000;
            font-size: 24px; letter-spacing: 5px; font-weight: bold;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* Сквозной аватар: сохранён для совместимости, отдельно не показывается. */
        .ui-user-badge {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--gold); background: #111;
            box-shadow: 0 0 0 1px #000, inset 0 0 5px rgba(0,0,0,0.8);
            z-index: 1000000; cursor: pointer; display: none;
        }
        .ui-user-badge .badge-img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            display: block; background-color: #fff;
        }
        .ui-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px;
            width: 17px; height: 12px; object-fit: cover;
            border: 1px solid var(--gold); box-shadow: 0 0 0 1px #000;
        }

        /* Паспорт */
        .passport-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000000;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .passport-card {
            background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px;
            padding: 25px; width: 280px; color: #000; text-align: center;
            box-shadow: 0 0 25px rgba(0,0,0,0.5); position: relative;
        }
        .passport-card .box-final { margin: 15px auto; border-color: #000; }
        .passport-close-btn {
            position: absolute; top: 10px; right: 14px; font-size: 28px;
            font-weight: bold; color: #000; cursor: pointer; line-height: 1; user-select: none;
        }

        .block {
            position: fixed; inset: 0; display: none; flex-direction: column;
            align-items: center; background: #000; z-index: 10; opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        .block.active { display: flex !important; opacity: 1 !important; z-index: 5000 !important; }

        .quote-text {
            font-family: 'Playfair Display', serif; font-style: italic; font-size: 26px;
            text-align: center; max-width: 85%; text-shadow: 2px 2px 6px #000;
        }

        .btn-gy {
            min-width: 140px; padding: 10px 14px;
            background: rgba(0,0,0,0.85) !important;
            border: 1px solid var(--gold) !important; color: var(--gold) !important;
            cursor: pointer; text-transform: uppercase; font-weight: 900;
            font-family: 'Share Tech Mono'; transition: none !important;
        }
        .btn-gy:hover {
            cursor: pointer !important; background: rgba(0,0,0,0.85) !important;
            color: var(--gold) !important; border-color: var(--gold) !important;
        }

        .box-final {
            width: 85px; height: 85px; border: 2px solid #000; background: #fff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 9999999;
            display: flex; gap: 20px; align-items: center; user-select: none;
            pointer-events: auto !important;
        }
        .arrow-item {
            font-family: 'Share Tech Mono', monospace; font-size: 26px;
            font-weight: 900 !important; color: var(--gold); cursor: pointer;
            display: inline-flex; align-items: center; line-height: 1;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transition: opacity 0.2s;
        }
        .arrow-item:hover { opacity: 0.8; }
        .arrow-item span:nth-child(2) { margin-left: -4px; }

        /* BAR: фон */
        #block-bar {
            background: radial-gradient(ellipse at center, #292116 0%, #17130e 48%, #090807 78%, #020202 100%) !important;
        }

        /* Паспорт — справа непосредственно под логотипом GY-GY. */
        .bar-passport-trigger {
            position: fixed; top: 52px; right: 8px; left: auto;
            transform: none; width: 42px; height: 42px;
            display: none; align-items: center; justify-content: center;
            border: 2px solid var(--gold); border-radius: 50%;
            background: rgba(0,0,0,0.88); color: var(--gold);
            font-family: 'Share Tech Mono', monospace; font-size: 25px; line-height: 1;
            cursor: pointer; z-index: 1000001;
            box-shadow: 0 0 8px rgba(212,175,55,0.25);
        }
        .bar-passport-trigger:hover { background: #292116; }

        /* Компьютерный Конь: +12% к прежним 101.2vw/101.2vh. */
        #block-bar img.bar-bg-horse {
            position: absolute !important;
            width: 105.944vw !important;
            height: 105.944vh !important;
            max-width: none !important;
            max-height: none !important;
            top: 50% !important; left: 50% !important;
            right: auto !important; bottom: auto !important;
            transform: translate(-50%, -50%) !important;
            object-fit: contain !important;
            object-position: center !important;
            z-index: 1 !important;
        }

        /* Приветствие: ещё на 5vh выше предыдущего положения. */
        #block-bar .bar-top-content {
            position: absolute !important;
            top: calc(clamp(76px, 12vh, 118px) - 18vh) !important;
            left: 50% !important; right: auto !important;
            width: 92% !important; max-width: 760px !important;
            padding: 0 !important; margin: 0 !important;
            transform: translateX(-50%) !important;
            display: flex !important; flex-direction: column !important;
            align-items: center !important; justify-content: center !important;
            background: transparent !important; border: none !important;
            border-radius: 0 !important; z-index: 2 !important;
            pointer-events: none !important;
        }
        #block-bar .bar-top-content .quote-text {
            width: 100% !important; max-width: 100% !important;
            text-align: center !important; color: #f5f0df !important;
            font-size: clamp(16px, 2.2vw, 24px) !important;
            line-height: 1.35 !important;
            -webkit-text-stroke: 0 !important; paint-order: normal !important;
            text-shadow: 2px 2px 6px #000 !important;
        }

        /* Нижняя панель */
        #block-bar .bar-bottom-panel {
            position: fixed; bottom: 5vh; left: 50%;
            transform: translateX(-50%); z-index: 999999 !important;
            display: flex; gap: 15px; width: auto;
            justify-content: center; pointer-events: auto !important;
        }

        /* МОБИЛЬНАЯ ВЕРСИЯ: изменения действуют только при ширине до 700px. */
        @media (max-width: 700px) {
            .bar-passport-trigger { top: 48px; right: 14px; }

            /* Мобильный bar_horse.jpg — масштаб оставлен без изменений. */
            #block-bar img.bar-bg-horse {
                width: 94vw !important;
                height: 78vh !important;
            }

            /* Мобильное приветствие также поднято на 5vh. */
            #block-bar .bar-top-content {
                top: calc(76px - 15vh) !important;
                width: 92% !important; max-width: 92% !important;
            }
            #block-bar .bar-top-content .quote-text {
                font-size: clamp(15px, 4vw, 21px) !important;
            }

            #block-bar .bar-bottom-panel {
                gap: 8px; width: calc(100% - 24px);
            }
            #block-bar .btn-gy {
                min-width: 0; padding: 9px 10px; font-size: 11px;
            }
            .ui-header-right { right: 14px; font-size: 20px; }
            .ui-nav-arrows { left: 14px; gap: 14px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="notranslate ui-nav-arrows" id="global-nav">
        <div class="arrow-item" onclick="goBack()">&lt;</div>
        <div class="arrow-item" onclick="leaveToEntrance()">
            <span>&lt;</span><span>&lt;</span>
        </div>
    </div>

    <button id="bar-passport-trigger" class="bar-passport-trigger notranslate"
        type="button" onclick="openPassport()" title="GY-GY Passport"
        aria-label="Open GY-GY Passport">
        <span aria-hidden="true">▤</span>
    </button>

    <div id="modal-passport" class="passport-overlay" onclick="closePassport()">
        <div class="passport-card" onclick="event.stopPropagation()">
            <div class="passport-close-btn" onclick="closePassport()">&times;</div>
            <div id="pass-id-title" style="font-weight:900; font-size:16px; letter-spacing:1px;">GY-GY PASSPORT</div>
            <div id="pass-id-val" style="font-weight:700; font-size:13px; margin-top:5px; color:#555;">#ID</div>
            <div class="box-final" style="width:100px; height:100px; border-radius:50%; border:2px solid var(--gold);">
                <img id="pass-avatar-img" style="width:100%; height:100%; object-fit:cover; border-radius:50%; background-color:#fff;" alt="">
            </div>
            <div class="box-final" id="pass-qr-box" style="width:110px; height:110px; padding:5px;"></div>
            <div style="font-size:10px; font-weight:900; color:#333; margin-top:5px; text-transform:uppercase;">Click &times; or outside to close</div>
        </div>
    </div>

    <div class="ui-header-right notranslate">GY-GY</div>
    <audio id="snd-ambient" src="bar_ambient.mp3" loop preload="auto"></audio>

    <div id="block-bar" class="block">
        <picture>
            <source media="(max-width: 700px)" srcset="bar_horse.jpg">
            <source srcset="bar_horse_desktop.png">
            <img src="bar_horse.jpg" class="bar-bg-horse" alt="">
        </picture>
        <div class="bar-top-content">
            <div class="quote-text" data-translate="welcome_quote">In every joke there is a share of whisky</div>
        </div>
        <div class="bar-bottom-panel">
            <button class="btn-gy" data-translate="bar_tables" onclick="event.stopPropagation(); goToTablesZone();">TABLES ZONE</button>
            <button class="btn-gy" translate="no" onclick="openSarcasmBook()">DE-STRESS STUDIO</button>
        </div>
    </div>

    <script>
        let currentID = "";
        let currentUserImage = "";

        function safeStorageGet(key, fallback = "") {
            try { return localStorage.getItem(key) || fallback; }
            catch (e) { return fallback; }
        }

        // Паспорт использует актуальные данные пользователя из localStorage.
        function syncUserBadge() {
            currentUserImage =
                safeStorageGet('gygy_avatar') ||
                safeStorageGet('gy_user_img') ||
                safeStorageGet('gy_user_avatar');

            currentID =
                safeStorageGet('gygy_id') ||
                safeStorageGet('gy_user_id') ||
                safeStorageGet('gy_trace');

            const trigger = document.getElementById('bar-passport-trigger');
            const passImg = document.getElementById('pass-avatar-img');

            if (trigger) trigger.style.display = currentID ? 'flex' : 'none';

            if (passImg) {
                if (currentUserImage) {
                    passImg.src = currentUserImage;
                    passImg.style.display = 'block';
                } else {
                    passImg.removeAttribute('src');
                    passImg.style.display = 'none';
                }
            }

            if (currentID) {
                const passIdVal = document.getElementById('pass-id-val');
                const passQrBox = document.getElementById('pass-qr-box');
                if (passIdVal) passIdVal.innerText = currentID;
                if (passQrBox && typeof QRCode !== 'undefined') {
                    passQrBox.innerHTML = "";
                    new QRCode(passQrBox, { text: currentID, width: 100, height: 100 });
                }
            }
        }

        function switchLocalBlock(blockId) {
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                b.style.display = 'none';
            });
            const target = document.getElementById(blockId);
            if (target) {
                target.style.display = 'flex';
                setTimeout(() => { target.classList.add('active'); }, 20);
            }
        }

        function goBack() {
            document.body.classList.remove('page-loaded');
            setTimeout(() => { window.location.href = 'hall.html'; }, 400);
        }

        function leaveToEntrance() {
            document.body.classList.remove('page-loaded');
            setTimeout(() => { window.location.href = 'index.html'; }, 400);
        }

        function goToTablesZone() {
            document.body.classList.remove('page-loaded');
            setTimeout(() => { window.location.href = 'tables.html'; }, 400);
        }

        function openSarcasmBook() {
            document.body.classList.remove('page-loaded');
            setTimeout(() => { window.location.href = 'destress-studio.html'; }, 400);
        }

        function openPassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) {
                modal.style.display = 'flex';
                setTimeout(() => { modal.style.opacity = '1'; }, 10);
            }
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) {
                modal.style.opacity = '0';
                setTimeout(() => { modal.style.display = 'none'; }, 300);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            syncUserBadge();
            switchLocalBlock('block-bar');
            document.body.classList.add('page-loaded');
        });
    </script>

    <script type="module">
        import { init as initLocalization } from './core/localization.js';
        import { resumeAmbient } from './modules/ambient.js';

        initLocalization(document.body);
        resumeAmbient({ volume: 0.55 });
    </script>
    <script type="module" src="./bar-complexes.js"></script>
</body>
</html>
