<!DOCTYPE html>
<!--
  space-construction.html — Центр космического строительства — v3.0.0 — 2026-11-02
  Интерфейс «в глубину»: четыре уровня, на каждом завершается своё действие:
  1 Миссия → 2 Ракета → 3 Груз → 4 Пуск. Форум — отдельный уровень (кнопка в полосе шагов и «Обсудить» у модулей).
  Переход на Луну появляется только после пуска. Печать отсюда убрана (переедет в Ателье «Конь в скафандре»).
  Первый испытательный полёт везёт модуль «Ателье».
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>GY-GY Club — Space Construction Center</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="space.css">
<style>
    [hidden] { display: none !important; }
    .sp-title { text-align: center; font-size: clamp(24px, 4.2vw, 44px); margin-bottom: 12px; }

    .stepbar { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
    .stepbar button { background: rgba(0,0,0,.55); color: var(--ivory); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 11px; }
    .stepbar button.cur { border-color: var(--o); color: var(--o); box-shadow: 0 0 10px var(--og); }
    .stepbar button.done { border-color: #6fd48a; color: #6fd48a; }
    .stepbar button:disabled { opacity: .35; cursor: not-allowed; }
    .stepbar .sep { opacity: .4; }
    .stepbar .forum-btn { margin-left: 12px; }

    /* уровни: front — на переднем плане, back — позади, ahead — впереди */
    .layers { position: relative; display: grid; }
    .L { grid-area: 1 / 1; min-width: 0; transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .5s, filter .5s; }
    .L.front { opacity: 1; transform: none; filter: none; visibility: visible; }
    .L.back { opacity: 0; transform: scale(.93) translateY(-12px); filter: blur(3px); pointer-events: none; visibility: hidden; transition: transform .5s, opacity .5s, filter .5s, visibility 0s .5s; }
    .L.ahead { opacity: 0; transform: translateY(24px) scale(1.03); pointer-events: none; visibility: hidden; transition: transform .5s, opacity .5s, visibility 0s .5s; }
    .L-card { max-width: 760px; margin: 0 auto; }
    .L-head { margin: 0 0 12px; text-align: center; color: var(--gold); font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
    .L-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; }
    .L-note { font-size: 11px; opacity: .7; text-align: center; margin: 8px 0 0; }

    .opt-group { margin: 12px 0; }
    .opt-group .lbl2 { font-size: 11px; opacity: .75; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .rocket-prev canvas { display: block; width: 100%; max-width: 520px; height: auto; margin: 0 auto; border-radius: 8px; background: #05060f; }

    .cargo-grid { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .mcard { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.02); }
    .mcard.locked { opacity: .55; }
    .mcard.link { cursor: pointer; }
    .mcard.link:hover { border-color: var(--o); }
    .mcard .ic { font-size: 24px; flex: 0 0 auto; }
    .mcard .mt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .mcard .mt b { color: var(--ivory); font-size: 13px; overflow-wrap: anywhere; }
    .mcard .mt small { font-size: 10px; opacity: .7; }
    .mcard .mp { display: block; height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
    .mcard .mp u { display: block; height: 100%; background: var(--o); text-decoration: none; }
    .mcard.done .mp u { background: #6fd48a; }
    .mcard .mb { display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto; }
    .sp-btn.sm { padding: 6px 9px; font-size: 10px; }
    .sp-btn.on { border-color: var(--o); color: var(--o); }

    @media (max-width: 520px) {
        .stepbar .forum-btn { margin-left: 0; }
        .mcard { flex-wrap: wrap; }
        .mcard .mb { flex-direction: row; width: 100%; }
    }
</style>
</head>
<body>
<div class="sp-bg" id="sp-bg"></div>

<div class="sp-top">
    <div class="sp-nav" translate="no">
        <span id="btn-back" title="Back" data-translate-title="nav_back">&lt;</span>
        <span id="btn-home" title="Home" data-translate-title="nav_home">&lt;&lt;</span>
    </div>
    <div class="sp-logo" translate="no">GY-GY</div>
</div>
<div id="passport-badge-container"></div>

<main class="sp-page">
    <h1 class="sp-title" data-translate="sp_center_title">Space Construction Center</h1>
    <nav class="stepbar" id="stepbar" aria-label="steps" translate="no"></nav>

    <div class="layers">

        <!-- 1. МИССИЯ -->
        <section class="L front" data-layer="mission">
            <div class="sp-panel L-card">
                <h2 class="L-head" data-translate="cx2_l1_title">Name your mission</h2>
                <input class="sp-input" id="mission" type="text" maxlength="28" placeholder="Mission name (up to 28 characters)" data-translate-placeholder="sp_mission_ph">
                <input class="sp-input" id="crew" type="text" maxlength="30" placeholder="Crew name" data-translate-placeholder="sp_crew_ph">
                <input class="sp-input" id="motto" type="text" maxlength="40" placeholder="Motto (up to 40 characters)" data-translate-placeholder="sp_motto_ph">
                <div class="sp-row"><button class="sp-btn" id="motto-pick" type="button" data-translate="sp_motto_charlie">Take a phrase from De-Stress Studio</button></div>
                <div class="L-nav"><span></span><button class="sp-btn primary" id="next-1" type="button" disabled data-translate="cx2_next">NEXT →</button></div>
            </div>
        </section>

        <!-- 2. РАКЕТА -->
        <section class="L ahead" data-layer="rocket">
            <div class="sp-panel L-card">
                <h2 class="L-head" data-translate="cx2_l2_title">Build the rocket</h2>
                <div class="rocket-prev"><canvas id="cv-rocket" width="640" height="400"></canvas></div>
                <p class="L-note" data-translate="cx2_rocket_note">Dashed parts are not chosen yet. Each engine carries two modules.</p>
                <div class="opt-group">
                    <div class="lbl2" data-translate="cx2_capsule">Capsule</div>
                    <div class="sp-row">
                        <button class="sp-opt" type="button" data-k="capsule" data-v="classic" data-translate="sp_capsule_classic">Classic</button>
                        <button class="sp-opt" type="button" data-k="capsule" data-v="dome" data-translate="sp_capsule_dome">Dome</button>
                        <button class="sp-opt" type="button" data-k="capsule" data-v="probe" data-translate="sp_capsule_probe">Probe</button>
                    </div>
                </div>
                <div class="opt-group">
                    <div class="lbl2" data-translate="cx2_hull">Hull</div>
                    <div class="sp-row">
                        <button class="sp-opt" type="button" data-k="hull" data-v="ivory" data-translate="sp_hull_ivory">Ivory</button>
                        <button class="sp-opt" type="button" data-k="hull" data-v="gold" data-translate="sp_hull_gold">Gold</button>
                        <button class="sp-opt" type="button" data-k="hull" data-v="black" data-translate="sp_hull_black">Black</button>
                    </div>
                </div>
                <div class="opt-group">
                    <div class="lbl2" data-translate="cx2_engines">Engines</div>
                    <div class="sp-row">
                        <button class="sp-opt" type="button" data-k="engines" data-v="1" translate="no">1</button>
                        <button class="sp-opt" type="button" data-k="engines" data-v="2" translate="no">2</button>
                        <button class="sp-opt" type="button" data-k="engines" data-v="3" translate="no">3</button>
                    </div>
                </div>
                <div class="L-nav">
                    <button class="sp-btn" id="back-2" type="button" data-translate="cx2_back">← BACK</button>
                    <button class="sp-btn primary" id="next-2" type="button" disabled data-translate="cx2_next">NEXT →</button>
                </div>
            </div>
        </section>

        <!-- 3. ГРУЗ -->
        <section class="L ahead" data-layer="cargo">
            <div class="sp-panel L-card">
                <h2 class="L-head" data-translate="cx2_l3_title">Load the cargo</h2>
                <div class="rocket-prev"><canvas id="cv-cargo" width="640" height="340"></canvas></div>
                <p class="sp-slots" id="slots" translate="no" style="text-align:center; margin-top:8px;"></p>
                <div class="cargo-grid" id="mods" translate="no"></div>
                <div class="L-nav">
                    <button class="sp-btn" id="back-3" type="button" data-translate="cx2_back">← BACK</button>
                    <button class="sp-btn primary" id="next-3" type="button" disabled data-translate="sp_to_pad">TO THE LAUNCH PAD →</button>
                </div>
            </div>
        </section>

        <!-- 4. ПУСК -->
        <section class="L ahead" data-layer="launch">
            <div class="sp-panel L-card" style="max-width:900px;">
                <h2 class="L-head" data-translate="cx2_l4_title">Launch pad</h2>
                <div class="sp-stagewrap">
                    <canvas id="stage" width="720" height="460"></canvas>
                    <div class="sp-overlay" id="overlay" translate="no"></div>
                </div>
                <p class="sp-slots" id="manifest" translate="no" style="text-align:center; margin-top:10px;"></p>
                <div class="L-nav">
                    <button class="sp-btn" id="back-4" type="button" data-translate="cx2_back">← BACK</button>
                    <button class="sp-btn primary" id="launch" type="button" disabled data-translate="sp_launch">LAUNCH</button>
                </div>
                <div class="sp-after" id="after" hidden>
                    <div class="sp-row" style="justify-content:center;">
                        <button class="sp-btn primary" id="after-moon" type="button" data-translate="sp_after_moon">To the Lunar Base →</button>
                        <button class="sp-btn" id="again" type="button" data-translate="sp_again">Build another rocket</button>
                    </div>
                </div>
                <p class="sp-status" id="status" role="status" translate="no" style="text-align:center;"></p>
            </div>
        </section>

        <!-- ФОРУМ: отдельный уровень -->
        <section class="L ahead" data-layer="forum">
            <div class="sp-panel L-card">
                <h2 class="L-head" data-translate="cx2_forum_title">Forum: module threads</h2>
                <div id="forum-list" class="cargo-grid" translate="no"></div>
                <div id="forum-thread-wrap" hidden>
                    <button class="sp-btn sm" id="all-threads" type="button" data-translate="cx2_all_threads">← All threads</button>
                    <div id="forum-thread" translate="no" style="margin-top:10px;"></div>
                </div>
            </div>
        </section>

    </div>
</main>

<script type="module">
    import { init as initLocalization, t, getCurrentLang, onLanguageChange, registerDictionary } from './core/localization.js';
    import { SPACE_DICT } from './core/i18n/space.js';
    import { init as initPassport } from './modules/passport.js';
    import { supabase } from './core/supabase-init.js';
    import { drawStage, runLaunch, ensureFonts } from './modules/spaceArt.js';
    import { mountForum, getCrewName, setCrewName } from './modules/spaceForum.js';
    import { mountStarfield } from './modules/starfield.js';
    import { loadModules, moduleTitle, deliver } from './modules/moonData.js';

    const CENTER_DICT = {
        en: {
            cx2_step1: 'Mission', cx2_step2: 'Rocket', cx2_step3: 'Cargo', cx2_step4: 'Launch', cx2_forum: 'Forum',
            cx2_l1_title: 'Name your mission', cx2_l2_title: 'Build the rocket', cx2_l3_title: 'Load the cargo', cx2_l4_title: 'Launch pad',
            cx2_capsule: 'Capsule', cx2_hull: 'Hull', cx2_engines: 'Engines',
            cx2_rocket_note: 'Dashed parts are not chosen yet. Each engine carries two modules.',
            cx2_next: 'NEXT →', cx2_back: '← BACK',
            cx2_soon: 'Coming later', cx2_discuss: 'Discuss',
            cx2_nothing: 'Nothing to deliver now: all available modules are built. You can still fly.',
            cx2_forum_title: 'Forum: module threads', cx2_all_threads: '← All threads'
        },
        fr: {
            cx2_step1: 'Mission', cx2_step2: 'Fusée', cx2_step3: 'Cargaison', cx2_step4: 'Lancement', cx2_forum: 'Forum',
            cx2_l1_title: 'Nomme ta mission', cx2_l2_title: 'Construis la fusée', cx2_l3_title: 'Charge la cargaison', cx2_l4_title: 'Piste de lancement',
            cx2_capsule: 'Capsule', cx2_hull: 'Coque', cx2_engines: 'Moteurs',
            cx2_rocket_note: 'Les parties en pointillés ne sont pas encore choisies. Chaque moteur emporte deux modules.',
            cx2_next: 'SUITE →', cx2_back: '← RETOUR',
            cx2_soon: 'Bientôt', cx2_discuss: 'Discuter',
            cx2_nothing: 'Rien à livrer pour l’instant : tous les modules disponibles sont construits. Tu peux quand même partir.',
            cx2_forum_title: 'Forum : fils par module', cx2_all_threads: '← Tous les fils'
        }
    };

    registerDictionary(SPACE_DICT);
    registerDictionary(CENTER_DICT);
    initLocalization(document.body);
    initPassport(document.getElementById('passport-badge-container'));
    mountStarfield(document.getElementById('sp-bg'));

    const $ = id => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const ORDER = ['mission', 'rocket', 'cargo', 'launch'];
    const STEP_KEYS = { mission: ['cx2_step1', 'Mission'], rocket: ['cx2_step2', 'Rocket'], cargo: ['cx2_step3', 'Cargo'], launch: ['cx2_step4', 'Launch'] };

    const S = { mission: '', capsule: null, hull: null, engines: null, motto: '', cargo: [] };
    let modules = [], postCounts = {};
    let layer = 'mission', prevLayer = 'mission', threadCode = null;
    let launching = false, finished = false, stopLaunch = null;

    const iconOf = (code) => { const m = modules.find(x => x.code === code); return m ? m.icon : '📦'; };
    const cap = () => (S.engines || 0) * 2;
    const rocketCfg = () => ({ capsule: S.capsule, hull: S.hull, engines: S.engines });
    const cfg = () => ({ ...rocketCfg(), cargo: S.cargo.map(iconOf) });
    const crew = () => ($('crew').value.trim() || getCrewName()).slice(0, 30);
    const say = (m) => { $('status').textContent = m || ''; };

    const loadable = () => modules.filter(m => m.available !== false && m.delivered < m.needed);
    const cargoOk = () => S.cargo.length > 0 || loadable().length === 0;     // нечего везти — можно лететь без груза
    const isDone = (n) => n === 'mission' ? S.mission.trim().length >= 2
        : n === 'rocket' ? !!(S.capsule && S.hull && S.engines)
        : n === 'cargo' ? cargoOk() : finished;
    function reach() { let i = 0; while (i < 3 && isDone(ORDER[i])) i++; return i; }

    // ---------- уровни ----------
    function applyLayers() {
        document.querySelectorAll('.L').forEach(el => {
            const n = el.dataset.layer;
            el.classList.remove('front', 'back', 'ahead');
            if (n === layer) el.classList.add('front');
            else if (layer === 'forum') el.classList.add(ORDER.indexOf(n) <= ORDER.indexOf(prevLayer) ? 'back' : 'ahead');
            else if (n === 'forum') el.classList.add('ahead');
            else el.classList.add(ORDER.indexOf(n) < ORDER.indexOf(layer) ? 'back' : 'ahead');
        });
    }
    function go(name) {
        if (name !== 'forum' && ORDER.indexOf(name) > reach()) return;
        if (name === 'forum' && layer !== 'forum') { prevLayer = layer; renderForumList(); showList(); }
        layer = name;
        applyLayers();
        renderStepbar();
        drawAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderStepbar() {
        const r = reach();
        const steps = ORDER.map((n, i) => {
            const [k, fb] = STEP_KEYS[n];
            const cls = [layer === n ? 'cur' : '', (isDone(n) && layer !== n) ? 'done' : ''].join(' ').trim();
            return `<button type="button" class="${cls}" data-go="${n}"${(i > r || launching) ? ' disabled' : ''}>${i + 1} · ${esc(t(k, fb))}</button>`;
        }).join('<span class="sep">›</span>');
               const flown = finished || (() => { try { return localStorage.getItem('gygy_space_launched') === '1'; } catch (e) { return false; } })();
        $('stepbar').innerHTML = steps +
            `<button type="button" class="forum-btn${layer === 'forum' ? ' cur' : ''}" data-go="forum"${launching ? ' disabled' : ''}>💬 ${esc(t('cx2_forum', 'Forum'))}</button>` +
            (flown ? `<button type="button" class="forum-btn" data-moon${launching ? ' disabled' : ''}>🌙 ${esc(t('sp_moon_title', 'Lunar Base'))}</button>` : '');
    }
      $('stepbar').addEventListener('click', (e) => {
        const m = e.target.closest('[data-moon]');
        if (m && !m.disabled && !launching) { window.location.href = 'lunar-base.html'; return; }
        const b = e.target.closest('[data-go]');
        if (!b || b.disabled || launching) return;
        go(b.dataset.go);
    });

    function drawAll() {
        drawStage($('cv-rocket'), rocketCfg());
        drawStage($('cv-cargo'), cfg());
        if (!launching && !finished) drawStage($('stage'), cfg());
    }

    // ---------- модули: карточки груза ----------
    function pctOf(m) { return Math.min(100, Math.round(m.delivered / m.needed * 100)); }

    function cargoCard(m) {
        const built = m.delivered >= m.needed;
        const open = m.available !== false;
        const on = S.cargo.includes(m.code);
        const full = S.cargo.length >= cap();
        const label = built ? t('sp_built', 'Built') : (!open ? t('cx2_soon', 'Coming later') : (on ? t('sp_loaded', '✓ Loaded') : t('sp_load', '+ Load')));
        const disabled = built || !open || (!on && (full || !S.engines));
        return `<div class="mcard${(built || !open) ? ' locked' : ''}${built ? ' done' : ''}" data-code="${esc(m.code)}">
            <span class="ic">${esc(m.icon)}</span>
            <span class="mt"><b>${esc(moduleTitle(m))}</b><i class="mp"><u style="width:${pctOf(m)}%"></u></i>
                <small>${esc(t('sp_need', '{d} of {n} delivered', { d: m.delivered, n: m.needed }))}</small></span>
            <span class="mb">
                <button class="sp-btn sm${on ? ' on' : ''}" type="button" data-load${disabled ? ' disabled' : ''}>${esc(label)}</button>
                <button class="sp-btn sm" type="button" data-discuss>💬 ${esc(t('cx2_discuss', 'Discuss'))}</button>
            </span>
        </div>`;
    }

    function renderCargo() {
        $('mods').innerHTML = modules.map(cargoCard).join('');
        $('slots').textContent = loadable().length === 0
            ? t('cx2_nothing', 'Nothing to deliver now: all available modules are built. You can still fly.')
            : (S.engines
                ? t('sp_cargo_slots', 'Cargo: {n} of {m}', { n: S.cargo.length, m: cap() })
                : t('sp_cargo_noengine', 'Choose engines first: each engine carries two modules.'));
    }

    $('mods').addEventListener('click', (e) => {
        const card = e.target.closest('.mcard');
        if (!card) return;
        const code = card.dataset.code;
        if (e.target.closest('[data-discuss]')) { go('forum'); showThread(code); return; }
        if (e.target.closest('[data-load]')) {
            const at = S.cargo.indexOf(code);
            if (at >= 0) S.cargo.splice(at, 1);
            else if (S.cargo.length < cap()) S.cargo.push(code);
            refresh();
        }
    });

    // ---------- форум ----------
    function forumRow(m) {
        const posts = postCounts[m.code] || 0;
        return `<div class="mcard link${m.delivered >= m.needed ? ' done' : ''}" data-code="${esc(m.code)}">
            <span class="ic">${esc(m.icon)}</span>
            <span class="mt"><b>${esc(moduleTitle(m))}</b><i class="mp"><u style="width:${pctOf(m)}%"></u></i>
                <small>${esc(t('sp_need', '{d} of {n} delivered', { d: m.delivered, n: m.needed }))} · ${esc(t('sp_posts', '{n} messages', { n: posts }))}</small></span>
        </div>`;
    }
    function renderForumList() { $('forum-list').innerHTML = modules.map(forumRow).join(''); }
    function showList() { threadCode = null; $('forum-list').hidden = false; $('forum-thread-wrap').hidden = true; }
    function showThread(code) {
        const m = modules.find(x => x.code === code);
        if (!m) return;
        threadCode = code;
        $('forum-list').hidden = true;
        $('forum-thread-wrap').hidden = false;
        mountForum($('forum-thread'), { area: 'center', topic: code, title: () => moduleTitle(m) });
    }
    $('forum-list').addEventListener('click', (e) => {
        const row = e.target.closest('.mcard');
        if (row) showThread(row.dataset.code);
    });
    $('all-threads').addEventListener('click', showList);

    async function loadCounts() {
        postCounts = {};
        try {
            const { data } = await supabase.from('space_posts').select('topic')
                .eq('area', 'center').eq('status', 'approved').not('topic', 'is', null).limit(1000);
            (data || []).forEach(r => { postCounts[r.topic] = (postCounts[r.topic] || 0) + 1; });
        } catch (e) { /* без счётчиков */ }
    }
    async function refreshModules() {
        const r = await loadModules();
        modules = r.modules;
        S.cargo = S.cargo.filter(c => modules.some(m => m.code === c && m.available !== false && m.delivered < m.needed));
        await loadCounts();
        renderForumList();
    }

    // ---------- обновление экрана ----------
    function refresh() {
        $('next-1').disabled = !isDone('mission');
        $('next-2').disabled = !isDone('rocket');
        $('next-3').disabled = !isDone('cargo');
        $('launch').disabled = launching || finished || !(isDone('mission') && isDone('rocket') && cargoOk());
        $('manifest').textContent = (S.mission.trim() || '—') + ' · ' + crew() + ' · ' + (S.cargo.map(iconOf).join(' ') || '—');
        renderCargo();
        renderStepbar();
        drawAll();
    }

    // ---------- уровень 1: миссия ----------
    $('mission').addEventListener('input', (e) => { S.mission = e.target.value; refresh(); });
    $('motto').addEventListener('input', (e) => { S.motto = e.target.value; });
    $('crew').value = (getCrewName() === 'Guest') ? '' : getCrewName();
    $('crew').addEventListener('change', (e) => { setCrewName(e.target.value); refresh(); });
    $('motto-pick').addEventListener('click', async () => {
        let list = [];
        try {
            const { data } = await supabase.from('destress_phrases').select('text, translations').eq('status', 'approved').limit(200);
            list = (data || []).map(r => (r.translations && r.translations[getCurrentLang()]) || r.text).filter(x => x && x.length <= 40);
        } catch (e) { /* запасной вариант ниже */ }
        const pick = list.length ? list[Math.floor(Math.random() * list.length)] : 'Per aspera ad astra';
        $('motto').value = pick;
        S.motto = pick;
    });

    // ---------- уровень 2: ракета ----------
    document.querySelectorAll('.sp-opt[data-k]').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.k;
        S[k] = (k === 'engines') ? Number(b.dataset.v) : b.dataset.v;
        if (k === 'engines') S.cargo = S.cargo.slice(0, cap());     // меньше двигателей — меньше мест
        document.querySelectorAll(`.sp-opt[data-k="${k}"]`).forEach(x => x.classList.toggle('sel', x === b));
        refresh();
    }));

    // ---------- кнопки уровней ----------
    $('next-1').addEventListener('click', () => go('rocket'));
    $('next-2').addEventListener('click', () => go('cargo'));
    $('next-3').addEventListener('click', () => go('launch'));
    $('back-2').addEventListener('click', () => go('mission'));
    $('back-3').addEventListener('click', () => go('rocket'));
    $('back-4').addEventListener('click', () => { if (!launching) go('cargo'); });

    // ---------- уровень 4: пуск и доставка груза ----------
    $('launch').addEventListener('click', async () => {
        if (launching || finished || !(isDone('mission') && isDone('rocket') && cargoOk())) return;
        await ensureFonts();
        launching = true;
        $('launch').disabled = true;
        $('back-4').disabled = true;
        $('after').hidden = true;
        say('');
        renderStepbar();
        const ov = $('overlay');
        ov.className = 'sp-overlay show';
        stopLaunch = runLaunch($('stage'), cfg(), {
            onCount: (n) => { ov.textContent = String(n); },
            onLiftoff: () => { ov.textContent = t('sp_liftoff', 'LIFTOFF'); setTimeout(() => ov.classList.remove('show'), 1500); },
            onDone: finish
        });
    });

    async function finish() {
        launching = false; finished = true;
        $('back-4').disabled = false;
        const ov = $('overlay');
        ov.className = 'sp-overlay show final';
        ov.textContent = t('sp_final', 'See you on the Moon');
        try {
            localStorage.setItem('gygy_space_launched', '1');
            localStorage.setItem('gygy_space_mission', JSON.stringify({
                capsule: S.capsule, hull: S.hull, engines: S.engines,
                mission: S.mission.trim(), motto: S.motto.trim(), crew: crew(), at: Date.now()
            }));
        } catch (e) { /* ок */ }
        $('after').hidden = false;       // переход на Луну — только после пуска
        renderStepbar();

        if (!S.cargo.length) { say(t('cx2_nothing', 'Nothing to deliver now: all available modules are built. You can still fly.')); return; }
        try {
            const accepted = await deliver(crew(), S.mission.trim(), S.cargo.slice());
            const names = accepted.map(c => { const m = modules.find(x => x.code === c); return m ? moduleTitle(m) : c; });
            say(accepted.length
                ? t('sp_delivered_msg', 'Cargo delivered: {list}', { list: names.join(', ') })
                : t('sp_delivery_none', 'These modules are already built: the cargo was not needed.'));
            await refreshModules();
            renderCargo();
        } catch (e) {
            console.warn('[space] Доставка груза не записалась', e);
            say(t('sp_delivery_fail', 'Launch recorded, but the base did not receive the cargo (try later).'));
        }
    }

    $('after-moon').addEventListener('click', () => { window.location.href = 'lunar-base.html'; });
    $('again').addEventListener('click', () => {
        if (stopLaunch) stopLaunch();
        launching = false; finished = false;
        S.cargo = [];
        $('overlay').className = 'sp-overlay';
        $('after').hidden = true;
        say('');
        refresh();
        go('cargo');
    });

    // ---------- навигация: стрелка поднимает на уровень выше ----------
    $('btn-back').addEventListener('click', () => {
        if (launching) return;
        if (layer === 'forum') { if (threadCode) showList(); else go(prevLayer); return; }
        const i = ORDER.indexOf(layer);
        if (i > 0) go(ORDER[i - 1]); else window.location.href = 'verses.html';
    });
    $('btn-home').addEventListener('click', () => { window.location.href = 'index.html'; });
    onLanguageChange(() => { refresh(); renderForumList(); });

    await refreshModules();
    applyLayers();
    refresh();
</script>
</body>
</html>
